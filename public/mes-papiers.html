</head><body><main class="wrap"><a class="back" href="index.html">← RETOUR</a><h1>📁 MES PAPIERS</h1><p>Les documents enregistrés dans « Documents de travail » apparaissent automatiquement ici sur cet appareil.</p><section class="paper"><h2>📄 Kbis / extrait RNE</h2><div id="kstate" class="state">Recherche du document…</div><button id="kopen" class="open">OUVRIR MON KBIS / RNE</button></section><section class="paper"><h2>🛡️ Assurance parapluie</h2><div id="astate" class="state">Recherche du document…</div><button id="aopen" class="open">OUVRIR MON ASSURANCE</button></section><section class="paper" id="tvaBelgiqueDocument"><h2>🇧🇪 TVA belge</h2><div id="tvastate" class="state">Recherche du document…</div><button id="tvaopen" class="open">OUVRIR MA TVA BELGE</button></section></main><script>function db(){return new Promise((ok,no)=>{const r=indexedDB.open('carplayDocuments',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function get(key){return db().then(x=>new Promise((ok,no)=>{const r=x.transaction('files','readonly').objectStore('files').get(key);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)}))}function bind(key,stateId,buttonId){let rec=null,st=document.getElementById(stateId),bt=document.getElementById(buttonId);get(key).then(r=>{rec=r;if(!r){st.textContent='Aucun document enregistré.';return}st.textContent='✅ Enregistré le '+new Date(r.savedAt).toLocaleDateString('fr-FR');bt.style.display='block'}).catch(()=>st.textContent='Impossible de lire le document sur cet appareil.');bt.onclick=()=>{if(!rec||!rec.blob)return;let u=URL.createObjectURL(rec.blob);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}}bind('extrait-rne','kstate','kopen');bind('assurance-parapluie','astate','aopen');
bind('tva-belge','tvastate','tvaopen');
</script><script src="weather-all-pages.js?v=62"></script><script src="new-feature-bubbles.js?v=20260905b"></script></body></html>
