<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>Inscription événement</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#07111d;color:#fff}.wrap{width:min(760px,94vw);margin:auto;padding:14px}.back{display:inline-block;padding:12px 16px;border-radius:14px;background:#f57c00;color:#fff;text-decoration:none;font-weight:950}.hero{margin:14px 0;padding:16px;border:3px solid #f39b19;border-radius:20px;background:#101a28}.hero h1{margin:0 0 7px;color:#ffd84a;font-size:25px}.hero p{margin:4px 0;color:#dbe8f4;font-weight:800;line-height:1.35}.box{margin:12px 0;padding:14px;border:2px solid #36506c;border-radius:18px;background:#101a28}.box h2{margin:0 0 10px;color:#62d8ff;font-size:20px}.requirements{border-color:#f39b19}.requirements h2{color:#ffd84a}.reqList{display:grid;gap:8px}.reqItem{display:flex;gap:9px;align-items:flex-start;padding:10px;border-radius:12px;background:#081727;border:1px solid #45617e;font-weight:900;line-height:1.35}.reqItem input{width:22px;height:22px;flex:0 0 auto}.reqNone{padding:11px;border-radius:12px;background:#102235;color:#dbe8f4;font-weight:850;line-height:1.4}.uploadBlock{display:none}.uploadBlock.show{display:block}.destination{margin:12px 0;padding:12px;border-radius:14px;border:2px solid #168a4e;background:#0b2a1d;color:#dfffea;font-weight:900;line-height:1.4}.destination strong{color:#8ff0b6}.methodBox{margin:12px 0;padding:13px;border-radius:14px;border:2px solid #62d8ff;background:#0a2034;font-weight:900;line-height:1.45}.methodBox h2{margin:0 0 7px;color:#62d8ff;font-size:19px}.officialLink{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin-top:10px;padding:10px 12px;border-radius:14px;background:#7b3fc6;color:#fff;text-decoration:none;text-align:center;font-size:15px;font-weight:1000}.callLink{background:#168a4e}.contactName{color:#ffd84a;font-size:18px;font-weight:1000}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.label{display:block;margin:9px 0 5px;font-weight:950}.field,select,textarea,input[type=file]{width:100%;min-height:48px;border:2px solid #62d8ff;border-radius:12px;background:#081727;color:#fff;padding:9px 10px;font-size:16px}textarea{min-height:100px;resize:vertical}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:8px;align-items:flex-start;padding:9px;border:1px solid #45617e;border-radius:12px;background:#081727;font-weight:850}.check input{width:22px;height:22px;flex:0 0 auto}.hint{margin-top:7px;color:#aebed0;font-size:12px;line-height:1.35;font-weight:750}.warning{margin:10px 0;padding:10px;border-radius:12px;background:#3a2b0b;border:1px solid #ffd36c;color:#ffe2a0;font-size:12px;line-height:1.4;font-weight:850}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.btn{min-height:60px;border:0;border-radius:15px;color:#fff;font-size:16px;font-weight:1000;padding:10px;cursor:pointer;touch-action:manipulation}.btn:disabled{opacity:.38;cursor:not-allowed}.dynField{margin-top:9px}.organizerMissing{color:#ffcf4a;font-weight:950}.green{background:#168a4e}.blue{background:#087ee5}.sms{background:#2f9c52}.orange{background:#f57c00}.gray{background:#4b5563}.shareTitle{margin:18px 0 6px;text-align:center;color:#ffd84a;font-size:20px;font-weight:1000}.optional{color:#aebed0;font-size:12px;font-weight:800}.status{margin-top:10px;padding:10px;border-radius:12px;background:#081727;display:none;font-weight:850;line-height:1.4}.status.show{display:block}.required{color:#ffcf4a}.private{color:#8ff0b6;font-weight:900}.event{font-size:17px;font-weight:950;color:#fff}@media(max-width:600px){.grid2,.checks,.actions{grid-template-columns:1fr}.hero h1{font-size:21px}}
</style>
<script defer src="/accessibility-zoom-v466.js?v=470-direct-load"></script>
<link rel="stylesheet" href="/subscription-locks.css?v=471-restore">
<script defer src="/subscription-web.js?v=471-restore"></script>
</head>
<body>
<main class="wrap">
<a class="back" href="javascript:history.back()">← RETOUR</a>
<section class="hero">
<h1>📝 INSCRIPTION</h1>
<div class="event" id="eventTitle"></div>
<p id="eventMeta"></p>
<p id="organizerInfo"></p><p id="sourceStatus" style="color:#62d8ff;font-weight:900"></p>
</section>
<section class="methodBox" id="methodBox">
<h2 id="methodTitle">Inscription</h2>
<div id="methodText"></div>
<a id="callLink" class="officialLink callLink" href="#" style="display:none">📞 APPELER POUR S’INSCRIRE</a>
</section>
<section class="box">
<h2>Vos renseignements</h2>
<div class="grid2"><div><label class="label">Nom</label><input class="field" id="lastName" autocomplete="family-name"></div><div><label class="label">Prénom</label><input class="field" id="firstName" autocomplete="given-name"></div></div>
<label class="label">Adresse</label><input class="field" id="address" autocomplete="street-address" placeholder="Adresse complète">
<div class="grid2"><div><label class="label">Adresse e-mail <span class="optional">(facultatif)</span></label><input class="field" id="userEmail" type="email" autocomplete="email"></div><div><label class="label">Numéro de téléphone</label><input class="field" id="phone" type="tel" autocomplete="tel"></div></div>
<div class="grid2"><div id="metersWrap"><label class="label">Métrage souhaité</label><input class="field" id="meters" inputmode="decimal" placeholder="Ex. 6 mètres"></div><div id="itemsWrap"><label class="label">Articles vendus</label><input class="field" id="items" placeholder="Ex. vêtements, jouets…"></div></div>
<div id="travellerFields" style="display:none">
<div class="grid2">
  <div><label class="label">Véhicule derrière le stand</label>
    <select id="travellerVehicle"><option value="">Choisir</option><option value="Oui">Oui</option><option value="Non">Non</option></select>
  </div>
  <div><label class="label">Barnum</label>
    <select id="travellerBarnum"><option value="">Choisir</option><option value="Oui">Oui</option><option value="Non">Non</option></select>
  </div>
</div>
</div>
<div id="dynamicFields"></div>
</section>
<section class="box requirements">
<h2>📎 À FOURNIR</h2>
<div id="requirementsSummary" class="reqList"></div>
<div id="requirementsNote" class="hint"></div>
</section>
<section class="box" id="sourceInfoBox" style="display:none"><h2>ℹ️ CONSIGNES</h2><div id="sourceInfo"></div></section>
<section class="box" id="uploadsBox" style="display:none">
<h2>PIÈCES À JOINDRE</h2>
<div id="uploadId" class="uploadBlock">
<label class="label">Pièce d’identité — recto</label><input id="idFront" type="file" accept="image/*,.pdf" capture="environment">
<label class="label">Pièce d’identité — verso</label><input id="idBack" type="file" accept="image/*,.pdf" capture="environment">
</div>
<div id="uploadHonor" class="uploadBlock"><label class="label">Attestation sur l’honneur</label><input id="fileHonor" type="file" accept="image/*,.pdf"></div>
<div id="uploadSiret" class="uploadBlock"><label class="label">SIRET / Kbis</label><input id="fileSiret" type="file" accept="image/*,.pdf"></div>
<div id="uploadInsurance" class="uploadBlock"><label class="label">Assurance responsabilité civile / professionnelle</label><input id="fileInsurance" type="file" accept="image/*,.pdf"></div>
<div id="uploadCard" class="uploadBlock"><label class="label">Carte de commerçant ambulant</label><input id="fileCard" type="file" accept="image/*,.pdf"></div>
<div id="uploadProof" class="uploadBlock"><label class="label">Justificatif de domicile</label><input id="fileProof" type="file" accept="image/*,.pdf"></div>
<div id="uploadPhotos" class="uploadBlock"><label class="label">Photos du stand / des produits</label><input id="photosFiles" type="file" accept="image/*,.pdf" multiple></div>
<div id="uploadOther" class="uploadBlock"><label class="label">Autre document demandé par l’organisateur</label><input id="otherFiles" type="file" accept="image/*,.pdf" multiple></div>
<div class="hint">Uniquement les pièces demandées par l’organisateur.</div>
</section>
<textarea id="message" style="display:none"></textarea>
<div class="destination" id="destinationBox"><div class="contactName" id="destinationEvent"></div><div id="destinationText"></div></div>
<div class="shareTitle">ENVOYER À L’ORGANISATEUR</div>
<div class="actions" id="mailActions">
<button class="btn blue" id="mailBtn" type="button">✉️ ENVOYER PAR MAIL</button>
<button class="btn sms" id="smsBtn" type="button">💬 ENVOYER PAR SMS</button>
</div>
<div class="hint" id="contactHint" style="margin-top:-5px;text-align:center"></div><div class="status" id="status"></div>
<p class="private">🔒 Documents non stockés.</p>
</main>
<script>
(function(){
'use strict';
const p=new URLSearchParams(location.search);
let target=p.get('email')||'';
let actionUrl=p.get('url')||'';
let contactPhone=p.get('phone')||'';
const sourceUrl=p.get('source')||actionUrl||'';
const sourceCountry=(p.get('country')||'FR').toUpperCase()==='BE'?'BE':'FR';
const mode=p.get('mode')||'';
const eventName=p.get('event')||'Événement';
const city=p.get('city')||'';
const date=p.get('date')||'Date à confirmer';
let info=p.get('info')||'';
const kind=p.get('kind')||'événement';
const q=id=>document.getElementById(id);
function getIdentity(){let a={};try{a=JSON.parse(localStorage.getItem('carplay_app_identity_v240')||'null')||{}}catch(_){}let s={};try{s=JSON.parse(localStorage.getItem('carplay_shared_subscription')||'null')||{}}catch(_){}return{firstName:a.firstName||a.first_name||s.firstName||s.first_name||'',lastName:a.lastName||a.last_name||s.lastName||s.last_name||'',email:a.email||s.email||localStorage.getItem('carplay_recovery_email')||''}}
function escText(v){return String(v||'').trim()}
function normalize(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
const travellerSimple=normalize(kind).includes('voyageur');
function applyTravellerSimpleMode(){
  if(!travellerSimple) return;
  q('methodText').textContent='Remplir puis envoyer.';
  q('sourceStatus').style.display='none';
  q('organizerInfo').style.display='none';
  q('travellerFields').style.display='block';
  q('itemsWrap').style.display='none';
  q('requirementsSummary').closest('section').style.display='none';
  q('uploadsBox').style.display='none';
  q('sourceInfoBox').style.display='none';
  q('dynamicFields').style.display='none';
}
const requirementDefs=[
  {id:'id',label:'Pièce d’identité — recto + verso',rx:/piece d identite|carte d identite|identite|\bcni\b|passeport|recto|verso/,upload:'uploadId'},
  {id:'honor',label:'Attestation sur l’honneur',rx:/attestation[^.;]{0,35}honneur|declaration[^.;]{0,35}honneur/,upload:'uploadHonor'},
  {id:'siret',label:'SIRET / Kbis',rx:/\bsiret\b|\bkbis\b|extrait k|num[eé]ro d.?entreprise|bce/,upload:'uploadSiret'},
  {id:'insurance',label:'Attestation d’assurance',rx:/assurance|responsabilite civile|\brc pro\b/,upload:'uploadInsurance'},
  {id:'card',label:'Carte de commerçant ambulant',rx:/carte[^.;]{0,30}(commercant|ambulant)|commercant ambulant/,upload:'uploadCard'},
  {id:'proof',label:'Justificatif de domicile',rx:/justificatif[^.;]{0,25}domicile|preuve[^.;]{0,25}domicile/,upload:'uploadProof'},
  {id:'photos',label:'Photos du stand / des produits',rx:/photo[^.;]{0,35}(stand|produit|article|marchandise)|photos? (du|des) stand|photos? (du|des) produits?/,upload:'uploadPhotos'}
];
let detected=[];let remoteRequirements=[];let remoteFields=[];
function detectRequirements(){
  const t=normalize(info);
  const local=requirementDefs.filter(r=>r.rx.test(t));
  const ids=new Set();detected=[];
  local.concat(remoteRequirements).forEach(r=>{const def=requirementDefs.find(d=>d.id===r.id);if(def&&!ids.has(def.id)){ids.add(def.id);detected.push(def)}});
  return detected;
}
function applyEventFields(){
  const box=q('dynamicFields');
  if(travellerSimple){box.innerHTML='';return;}
  const ids=new Set((remoteFields||[]).map(x=>String(x&&x.id||'')));
  if(detected.some(x=>x.id==='siret')) ids.add('siret');
  const fields=[];
  if(ids.has('siret')) fields.push(['siretNumber','SIRET / n° entreprise','text','Ex. 123 456 789 00012']);
  if(ids.has('sellerType')) fields.push(['sellerType','Statut','select','']);
  if(ids.has('vehicle')) fields.push(['vehicle','Véhicule / remorque / immatriculation','text','']);
  if(ids.has('address') && !q('address').value){} // adresse est déjà dans la fiche
  box.innerHTML=fields.map(f=>{
    if(f[2]==='select') return '<div class="dynField"><label class="label">'+f[1]+'</label><select id="'+f[0]+'"><option value="">Choisir</option><option>Particulier</option><option>Professionnel</option></select></div>';
    return '<div class="dynField"><label class="label">'+f[1]+'</label><input class="field" id="'+f[0]+'" type="'+f[2]+'" placeholder="'+f[3]+'"></div>';
  }).join('');
  fields.forEach(f=>{const el=q(f[0]);if(el)el.addEventListener('input',refreshMessage)});
}

function renderRequirements(){
  const list=q('requirementsSummary'),note=q('requirementsNote'),box=q('uploadsBox');
  if(travellerSimple){box.style.display='none';return;}
  const reqs=detectRequirements();
  document.querySelectorAll('.uploadBlock').forEach(el=>el.classList.remove('show'));
  if(!reqs.length){
    list.innerHTML='<div class="reqNone">Aucune pièce jointe précise n’a été trouvée dans les consignes récupérées pour cet événement. Le formulaire ne demande donc aucune photo ou document par défaut.</div>';
    note.textContent=info?'Consigne trouvée : '+info:'Les pièces demandées n’ont pas été publiées dans les informations disponibles.';
    box.style.display='none';
    return;
  }
  list.innerHTML=reqs.map((r,i)=>'<label class="reqItem"><input type="checkbox" id="req_'+r.id+'"><span><b>'+r.label+'</b><br><small>Demandé par l’organisateur</small></span></label>').join('');
  note.textContent='';
  box.style.display='block';
  reqs.forEach(r=>{const el=q(r.upload);if(el)el.classList.add('show')});
  reqs.forEach(r=>{const cb=q('req_'+r.id);if(cb)cb.addEventListener('change',refreshMessage)});
}
function selectedDocs(){
  return detected.filter(r=>{
    const cb=q('req_'+r.id);
    return cb&&cb.checked;
  }).map(r=>r.label)
}
function buildMessage(){
  const who=[escText(q('firstName').value),escText(q('lastName').value)].filter(Boolean).join(' ');
  const lines=['Bonjour,','','Je souhaite m’inscrire à '+eventName+(city?' à '+city:'')+'.','Date : '+date+'.'];
  if(who)lines.push('Nom / prénom : '+who);
  if(q('address').value.trim())lines.push('Adresse : '+q('address').value.trim());
  if(q('userEmail').value.trim())lines.push('E-mail : '+q('userEmail').value.trim());
  if(q('phone').value.trim())lines.push('Téléphone : '+q('phone').value.trim());
  if(q('meters').value.trim())lines.push('Métrage souhaité : '+q('meters').value.trim());
  if(travellerSimple){
    if(q('travellerVehicle')&&q('travellerVehicle').value)lines.push('Véhicule derrière le stand : '+q('travellerVehicle').value);
    if(q('travellerBarnum')&&q('travellerBarnum').value)lines.push('Barnum : '+q('travellerBarnum').value);
  } else if(q('items').value.trim())lines.push('Articles vendus : '+q('items').value.trim());
  if(q('siretNumber')&&q('siretNumber').value.trim())lines.push('SIRET / n° entreprise : '+q('siretNumber').value.trim());
  if(q('sellerType')&&q('sellerType').value.trim())lines.push('Statut : '+q('sellerType').value.trim());
  if(q('vehicle')&&q('vehicle').value.trim())lines.push('Véhicule / immatriculation : '+q('vehicle').value.trim());
  const docs=selectedDocs();if(docs.length)lines.push('Pièces prévues : '+docs.join(', '));
  if(info&&!travellerSimple)lines.push('','Consignes de l’organisateur : '+info);
  lines.push('','Merci de me confirmer mon inscription.','','Cordialement,',who);
  return lines.join('\n');
}
function refreshMessage(){q('message').value=buildMessage()}
function filesFrom(id){const e=q(id);return e&&e.files?Array.from(e.files):[]}
function allFiles(){let files=[];['idFront','idBack','fileHonor','fileSiret','fileInsurance','fileCard','fileProof','photosFiles','otherFiles'].forEach(id=>{files=files.concat(filesFrom(id))});return files}
function status(text){q('status').textContent=text;q('status').classList.add('show')}
function renderMethod(){
  const title=q('methodTitle'),text=q('methodText'),call=q('callLink');
  title.textContent='📝 Inscription';
  text.textContent='Remplir puis envoyer directement à l’organisateur.';
  call.style.display='none';
  if(contactPhone){call.href='tel:'+contactPhone.replace(/[^0-9+]/g,'');call.style.display='flex';}
  q('mailActions').style.display='grid';
}

function updateOrganizerButtons(){
  const mail=q('mailBtn'),sms=q('smsBtn'),hint=q('contactHint');
  mail.disabled=!target;sms.disabled=!contactPhone;
  if(target&&contactPhone) hint.textContent='E-mail et SMS vers l’organisateur.';
  else if(target) hint.textContent='E-mail vers l’organisateur.';
  else if(contactPhone) hint.textContent='SMS vers l’organisateur.';
  else {hint.innerHTML='<span class="organizerMissing">Coordonnées organisateur non trouvées.</span>';}
}
async function loadEventSource(){
  if(!sourceUrl){q('sourceStatus').textContent='Les consignes détaillées ne sont pas publiées dans une source exploitable.';applyEventFields();return;}
  q('sourceStatus').textContent='🔎 Recherche des pièces et renseignements demandés pour cet événement…';
  try{
    const res=await fetch('/api/event-registration-info?url='+encodeURIComponent(sourceUrl)+'&country='+encodeURIComponent(sourceCountry),{cache:'no-store'}),j=await res.json();
    if(!j||!j.ok){q('sourceStatus').textContent='ℹ️ Impossible de lire automatiquement toutes les consignes. Les informations déjà connues restent affichées.';applyEventFields();return;}
    if(j.email)target=String(j.email);
    if(j.phone)contactPhone=String(j.phone);
    if(j.registrationUrl)actionUrl=String(j.registrationUrl);
    remoteRequirements=Array.isArray(j.requirements)?j.requirements:[];
    remoteFields=Array.isArray(j.fields)?j.fields:[];
    const extra=[];
    if(Array.isArray(j.instructions)&&j.instructions.length)extra.push(...j.instructions.slice(0,8));
    if(j.price)extra.push('Tarif / prix : '+j.price);
    if(j.deadline)extra.push('Date limite : '+j.deadline);
    if(extra.length){
      const existing=normalize(info);extra.forEach(x=>{if(x&&!existing.includes(normalize(x)))info+=(info?' — ':'')+x});
      q('sourceInfoBox').style.display='block';q('sourceInfo').innerHTML=extra.map(x=>'<div style="margin:7px 0;font-weight:850">• '+String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div>').join('');
    }
    q('sourceStatus').textContent='✅ Consignes de cette foire / brocante / braderie récupérées quand elles sont publiées.';
    q('organizerInfo').textContent=info?'Consignes trouvées : '+info:'Consignes précises non publiées.';
    q('destinationText').innerHTML=(target?'E-mail : <strong>'+target.replace(/[&<>]/g,'')+'</strong><br>':'')+(contactPhone?'Téléphone / SMS : <strong>'+contactPhone.replace(/[&<>]/g,'')+'</strong><br>':'')+(!target&&!contactPhone?(actionUrl?'Coordonnées de l’organisateur à vérifier.':'Coordonnées de l’organisateur à vérifier.'):'');
    renderMethod();applyEventFields();renderRequirements();applyTravellerSimpleMode();updateOrganizerButtons();refreshMessage();
  }catch(e){q('sourceStatus').textContent='ℹ️ La source n’a pas répondu. Les informations déjà connues restent disponibles.';applyEventFields();}
}
const ident=getIdentity();q('firstName').value=ident.firstName;q('lastName').value=ident.lastName;q('userEmail').value=ident.email;q('phone').value=localStorage.getItem('event_reg_phone')||'';q('address').value=localStorage.getItem('event_reg_address')||'';
q('eventTitle').textContent=eventName;q('eventMeta').textContent=(city?city+' — ':'')+date;q('organizerInfo').textContent=info?'Consignes trouvées : '+info:'Consignes précises non publiées.';
q('destinationEvent').textContent='Envoi pour : '+eventName+(city?' — '+city:'');
q('destinationText').innerHTML=(target?'E-mail : <strong>'+target.replace(/[&<>]/g,'')+'</strong><br>':'')+(contactPhone?'Téléphone / SMS : <strong>'+contactPhone.replace(/[&<>]/g,'')+'</strong><br>':'')+(!target&&!contactPhone?(actionUrl?'Coordonnées de l’organisateur à vérifier.':'Coordonnées de l’organisateur à vérifier.'):'');
renderMethod();renderRequirements();applyEventFields();applyTravellerSimpleMode();updateOrganizerButtons();refreshMessage();loadEventSource();
// V345 — Formulaire simplifié avec partage par e-mail ou SMS. Aucun champ ni pièce ne bloque le partage.
// Les pièces sont affichées uniquement quand elles sont détectées dans les consignes de l'événement.
Array.from(document.querySelectorAll('input,select,textarea,button')).forEach(el=>{ el.required=false; });
updateOrganizerButtons();
['firstName','lastName','userEmail','phone','address','meters','items'].forEach(id=>q(id).addEventListener('input',refreshMessage));
['travellerVehicle','travellerBarnum'].forEach(id=>{const el=q(id);if(el)el.addEventListener('change',refreshMessage)});
q('mailBtn').onclick=function(){
  localStorage.setItem('event_reg_phone',q('phone').value.trim());localStorage.setItem('event_reg_address',q('address').value.trim());
  if(!target){status('Adresse e-mail de l’organisateur introuvable.');return;}
  const subject='Inscription '+eventName;const body=q('message').value;
  location.href='mailto:'+encodeURIComponent(target)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  status('E-mail pour '+target+'.');
};
q('smsBtn').onclick=function(){
  localStorage.setItem('event_reg_phone',q('phone').value.trim());localStorage.setItem('event_reg_address',q('address').value.trim());
  const body=q('message').value;
  const tel=contactPhone?contactPhone.replace(/[^0-9+]/g,''):'';
  if(!tel){status('Numéro de l’organisateur introuvable.');return;}
  const isiPhone=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  const url='sms:'+tel+(isiPhone?'&':'?')+'body='+encodeURIComponent(body);
  location.href=url;
  status('SMS pour '+contactPhone+'.');
};
})();
</script>
<script src="/voice-assist-v498.js?v=498-long-first-press"></script>
</body>
</html>
