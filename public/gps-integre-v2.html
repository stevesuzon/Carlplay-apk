<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GPS intégré — Couteau Suisse</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#071321;color:white;font-family:system-ui,Arial}header{padding:12px 16px;background:#10283d;display:flex;align-items:center;justify-content:space-between}a{color:white;text-decoration:none}main{padding:14px;max-width:760px;margin:auto}.panel{background:#142a42;border:1px solid #39546e;border-radius:18px;padding:16px}label{display:block;margin-bottom:8px}input{width:100%;padding:15px;border:1px solid #789;border-radius:12px;font-size:17px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}button{cursor:pointer;border-radius:12px;border:2px solid #60778c;background:#243e55;color:white;padding:13px 8px;font-size:15px;font-weight:800}button[aria-pressed=true]{background:#137d45;border-color:#74ffa5}#confirm{width:100%;background:#f28c18;border-color:#f28c18;color:#141414}#change{width:100%;margin-top:8px}#map{height:52dvh;min-height:300px;margin-top:12px;border-radius:14px;overflow:hidden}#guidance{margin-top:10px;padding:12px;background:#173d57;border-radius:12px;font-weight:750}#status{min-height:40px;padding-top:10px;color:#d4e6f3}.hidden{display:none!important}@media(max-width:390px){.modes button{font-size:13px;padding:12px 3px}}
</style></head><body><header><strong>🧭 GPS — Couteau Suisse</strong><a href="/index.html">← Accueil</a></header>
<main><section class="panel" id="setup"><label for="address">Adresse de destination</label><input id="address" autocomplete="street-address" placeholder="Ville, rue et numéro"><div class="modes" role="group" aria-label="Mode de déplacement"><button type="button" data-mode="normal" aria-pressed="true">🚗 Normal</button><button type="button" data-mode="convoi" aria-pressed="false">🚛 Convoi</button><button type="button" data-mode="pieton" aria-pressed="false">🚶 Piéton</button></div><button id="confirm" type="button">CONFIRMER</button><button id="change" type="button">CHANGER L’ADRESSE</button><div id="status" role="status" aria-live="polite"></div><div id="guidance" aria-live="polite" hidden></div><button id="stop" type="button" class="hidden">ARRÊTER LE GUIDAGE</button></section><div id="map" aria-label="Carte GPS"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(function(){
const address=document.getElementById('address'),status=document.getElementById('status'),buttons=[...document.querySelectorAll('[data-mode]')];
let mode='normal',map,marker,routeLine,originMarker,watchId=null,steps=[],lastSpoken=-1,destination=null;
const guidance=document.getElementById('guidance');
const meters=(a,b)=>{const rad=Math.PI/180,dLat=(b[0]-a[0])*rad,dLon=(b[1]-a[1])*rad,q=Math.sin(dLat/2)**2+Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dLon/2)**2;return 12742000*Math.asin(Math.min(1,Math.sqrt(q)))};
const instruction=(step)=>{const m=step.maneuver||{},type=m.type||'',mod=m.modifier||'',road=step.name?' sur '+step.name:'';if(type==='arrive')return 'Vous êtes arrivé à destination';if(type==='depart')return 'Démarrez'+road;if(type==='roundabout'||type==='rotary')return 'Entrez dans le rond-point'+(m.exit?', prenez la sortie '+m.exit:'');if(mod.includes('left'))return 'Tournez à gauche'+road;if(mod.includes('right'))return 'Tournez à droite'+road;if(mod==='uturn')return 'Faites demi-tour';return 'Continuez'+road};
function speak(message){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(message);u.lang='fr-FR';u.rate=.95;speechSynthesis.speak(u)}catch(_){}}
function stopGuide(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}steps=[];lastSpoken=-1;guidance.hidden=true;document.getElementById('stop').classList.add('hidden');try{speechSynthesis.cancel()}catch(_){}}
document.getElementById('stop').addEventListener('click',()=>{stopGuide();status.textContent='Guidage arrêté.'});
buttons.forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));status.textContent='Mode '+b.textContent.trim()+' sélectionné.'}));
document.getElementById('change').addEventListener('click',()=>{address.focus();address.select()});
if(window.L){map=L.map('map').setView([46.6,2.2],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map)}else status.textContent='Carte indisponible : vérifiez la connexion.';
document.getElementById('confirm').addEventListener('click',async()=>{
 stopGuide();const query=address.value.trim();if(!query){status.textContent='Saisissez une adresse.';address.focus();return}
 if(mode==='convoi'){status.textContent='Le guidage convoi est en cours de reconstruction : aucun itinéraire voiture non sécurisé ne sera proposé pour un grand gabarit.';return}
 status.textContent='Recherche de la destination et de votre position…';
 try{const response=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(query),{headers:{'Accept-Language':'fr'}});if(!response.ok)throw Error('Service de recherche indisponible');const places=await response.json();if(!places.length)throw Error('Adresse introuvable');const p=places[0],lat=Number(p.lat),lon=Number(p.lon);destination=[lat,lon];if(!map)throw Error('Carte indisponible');if(marker)map.removeLayer(marker);marker=L.marker([lat,lon]).addTo(map).bindPopup(p.display_name).openPopup();map.setView([lat,lon],15);
 if(!navigator.geolocation){status.textContent='Destination localisée. Autorisez la géolocalisation pour calculer le trajet.';return}
 const position=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:18000,maximumAge:10000}));
 const from=[position.coords.latitude,position.coords.longitude];
 if(originMarker)map.removeLayer(originMarker);originMarker=L.circleMarker(from,{radius:9,color:'#1463d9',fillColor:'#60b3ff',fillOpacity:1}).addTo(map).bindPopup('Votre position');
 status.textContent='Calcul du trajet '+(mode==='pieton'?'à pied':'en voiture')+'…';
 // OSRM public demo supports driving only; never present it as a pedestrian route.
 if(mode==='pieton'){map.fitBounds(L.latLngBounds([from,[lat,lon]]).pad(.18));status.textContent='Position et destination affichées. Le calcul piéton dédié reste à intégrer.';return}
 const endpoint='https://router.project-osrm.org/route/v1/driving/'+from[1]+','+from[0]+';'+lon+','+lat+'?overview=full&geometries=geojson&steps=true';
 const routeResponse=await fetch(endpoint);if(!routeResponse.ok)throw Error('Calcul d’itinéraire indisponible');
 const routeData=await routeResponse.json();const result=routeData.routes&&routeData.routes[0];
 if(!result||!result.geometry)throw Error('Aucun itinéraire trouvé');
 if(routeLine)map.removeLayer(routeLine);
 routeLine=L.geoJSON(result.geometry,{style:{color:'#258dff',weight:7,opacity:.9}}).addTo(map);
 map.fitBounds(routeLine.getBounds().pad(.12));
 const km=(result.distance/1000).toFixed(1),minutes=Math.round(result.duration/60);
 status.textContent='Itinéraire voiture : '+km+' km · environ '+minutes+' min. Guidage indicatif : respectez la signalisation.';
 steps=(result.legs||[]).flatMap(leg=>leg.steps||[]).filter(step=>step.maneuver&&step.maneuver.location);
 guidance.hidden=false;document.getElementById('stop').classList.remove('hidden');
 const update=(pos)=>{const point=[pos.coords.latitude,pos.coords.longitude];originMarker.setLatLng(point);if(meters(point,destination)<35){guidance.textContent='Vous êtes arrivé à destination';speak('Vous êtes arrivé à destination');stopGuide();return}
 let next=steps.findIndex(st=>meters(point,[st.maneuver.location[1],st.maneuver.location[0]])<Math.max(35,Math.min(250,st.distance||80)));
 if(next<0){let best=Infinity;steps.forEach((st,i)=>{const d=meters(point,[st.maneuver.location[1],st.maneuver.location[0]]);if(d<best){best=d;next=i}})}
 if(next<0)return;const st=steps[next],d=Math.round(meters(point,[st.maneuver.location[1],st.maneuver.location[0]]));const message=(d>30?'Dans '+d+' mètres, ':'')+instruction(st);
 guidance.textContent=message;if(next!==lastSpoken&&d<250){lastSpoken=next;speak(message)}
 };
 watchId=navigator.geolocation.watchPosition(update,()=>{status.textContent='Signal GPS perdu : vérifiez la localisation.'},{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
 update(position);
 
 }catch(e){status.textContent=e.message||'Erreur de localisation'}
});
})();
</script></body></html>
