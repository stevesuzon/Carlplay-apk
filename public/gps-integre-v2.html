<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GPS intégré — Couteau Suisse</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#071321;color:white;font-family:system-ui,Arial}header{padding:12px 16px;background:#10283d;display:flex;align-items:center;justify-content:space-between}a{color:white;text-decoration:none}main{padding:14px;max-width:760px;margin:auto}.panel{background:#142a42;border:1px solid #39546e;border-radius:18px;padding:16px}label{display:block;margin-bottom:8px}input{width:100%;padding:15px;border:1px solid #789;border-radius:12px;font-size:17px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}button{cursor:pointer;border-radius:12px;border:2px solid #60778c;background:#243e55;color:white;padding:13px 8px;font-size:15px;font-weight:800}button[aria-pressed=true]{background:#137d45;border-color:#74ffa5}#confirm{width:100%;background:#f28c18;border-color:#f28c18;color:#141414}#change{width:100%;margin-top:8px}#map{height:52dvh;min-height:300px;margin-top:12px;border-radius:14px;overflow:hidden}#status{min-height:40px;padding-top:10px;color:#d4e6f3}.hidden{display:none!important}@media(max-width:390px){.modes button{font-size:13px;padding:12px 3px}}
</style></head><body><header><strong>🧭 GPS — Couteau Suisse</strong><a href="/index.html">← Accueil</a></header>
<main><section class="panel" id="setup"><label for="address">Adresse de destination</label><input id="address" autocomplete="street-address" placeholder="Ville, rue et numéro"><div class="modes" role="group" aria-label="Mode de déplacement"><button type="button" data-mode="normal" aria-pressed="true">🚗 Normal</button><button type="button" data-mode="convoi" aria-pressed="false">🚛 Convoi</button><button type="button" data-mode="pieton" aria-pressed="false">🚶 Piéton</button></div><button id="confirm" type="button">CONFIRMER</button><button id="change" type="button">CHANGER L’ADRESSE</button><div id="status" role="status" aria-live="polite"></div></section><div id="map" aria-label="Carte GPS"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(function(){
const address=document.getElementById('address'),status=document.getElementById('status'),buttons=[...document.querySelectorAll('[data-mode]')];
let mode='normal',map,marker;
buttons.forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));status.textContent='Mode '+b.textContent.trim()+' sélectionné.'}));
document.getElementById('change').addEventListener('click',()=>{address.focus();address.select()});
if(window.L){map=L.map('map').setView([46.6,2.2],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map)}else status.textContent='Carte indisponible : vérifiez la connexion.';
document.getElementById('confirm').addEventListener('click',async()=>{
 const query=address.value.trim();if(!query){status.textContent='Saisissez une adresse.';address.focus();return}
 if(mode==='convoi'){status.textContent='Le guidage convoi est en cours de reconstruction : aucun itinéraire voiture non sécurisé ne sera proposé pour un grand gabarit.';return}
 status.textContent='Recherche de la destination…';
 try{const response=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(query),{headers:{'Accept-Language':'fr'}});if(!response.ok)throw Error('Service de recherche indisponible');const places=await response.json();if(!places.length)throw Error('Adresse introuvable');const p=places[0],lat=Number(p.lat),lon=Number(p.lon);if(!map)throw Error('Carte indisponible');if(marker)map.removeLayer(marker);marker=L.marker([lat,lon]).addTo(map).bindPopup(p.display_name).openPopup();map.setView([lat,lon],15);status.textContent='Destination localisée. Le guidage virage par virage sera ajouté après intégration du moteur de calcul '+(mode==='pieton'?'piéton':'normal')+'.';
 }catch(e){status.textContent=e.message||'Erreur de localisation'}
});
})();
</script></body></html>
