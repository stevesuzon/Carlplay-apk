<!doctype html>
<html lang="fr">
  <head>

    <title>Catégorie marchés</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {

        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #152f42, #6d4b28);
        color: #fff;
      }
      .wrap {
        width: min(980px, 94vw);
        margin: auto;
        padding: 18px;
      }
      .back,
      .go {
        display: inline-block;
        padding: 13px 18px;
        border-radius: 15px;
        background: linear-gradient(135deg, #ff9a19, #ff5b00);
        color: #fff;
        text-decoration: none;
        font-weight: 900;
      }
      .marketActions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .marketActions .go,
      .marketActions .verify {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 46px;
        margin: 0;
        padding: 8px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        text-decoration: none;
        text-align: center;
        font-size: 12px;
        font-weight: 950;
      }
      .marketActions .go {
        background: linear-gradient(135deg, #ff9a19, #ff5b00);
      }
      .marketActions .verify {
        background: #087ee5;
      }
      .marketActions .call,.marketActions .register {
        display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;margin:0;padding:8px;border:0;border-radius:12px;background:#168a4e;color:#fff;text-decoration:none;text-align:center;font-size:12px;font-weight:950;
      }
      .marketActions .register{grid-column:1/-1;background:#168a4e}
      .hero {
        margin: 16px 0;
        padding: 18px;
        border-radius: 22px;
        background: #101724e8;
        border: 2px solid #f39b19;
      }
      .hero h1 {
        margin: 0 0 7px;
        color: #ffd84a;
        font-size: 31px;
      }
      .hero p {
        margin: 0;
        color: #ddd;
        font-weight: 700;
      }
      .filters {
        display: flex;
        gap: 10px;
        margin: 12px 0;
      }
      .filters input {
        width: 100%;
        height: 52px;
        border: 2px solid #fff;
        border-radius: 14px;
        background: #07111d;
        color: #fff;
        padding: 0 14px;
        font-size: 18px;
        font-weight: 850;
      }
      .list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .item {
        position: relative;
        padding: 14px 14px;
        border-radius: 18px;
        background: #101724e8;
        border: 2px solid #f39b19;
        box-shadow: 0 5px 16px #0005;
        min-width: 0;
      }
      .item h2 {
        margin: 0 58px 8px 0;
        font-size: 21px;
        color: #fff;
      }
      .item.eventBig{min-height:255px;padding:18px 16px 16px;border-width:3px}
      .eventTypeBadge{display:inline-flex;align-items:center;gap:7px;margin:0 0 10px;padding:9px 14px;border-radius:999px;font-size:19px;font-weight:1000;letter-spacing:.4px;color:#fff;box-shadow:0 4px 12px #0006}
      .eventTypeBadge.foire{background:linear-gradient(135deg,#8c35d9,#d56d00)}
      .eventTypeBadge.brocante{background:linear-gradient(135deg,#e46b00,#ff9a19)}
      .eventTypeBadge.vide{background:linear-gradient(135deg,#087f72,#17b661)}
      .eventTypeBadge.braderie{background:linear-gradient(135deg,#b62e55,#f06464)}
      .item.eventBig .eventDateStrong{font-size:17px;color:#ffe38a;font-weight:1000;margin:5px 0}

      .favStar {
        position: absolute;
        right: 42px;
        top: 9px;
        border: 0;
        background: transparent;
        color: #fff;
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
        padding: 2px;
      }
      .favStar.active {
        color: #ffc52b;
      }
      .statusDot {
        position: absolute;
        right: 9px;
        top: 12px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #ff9818;
        box-shadow: 0 0 8px #ff9818;
      }
      .statusDot.ok {
        background: #19d35b;
        box-shadow: 0 0 8px #19d35b;
      }
      .go {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 9px 11px;
        font-size: 13px;
      }
      .meta {
        line-height: 1.5;
        font-weight: 800;
      }
      .go {
        margin-top: 12px;
      }
      .empty {
        padding: 24px;
        text-align: center;
        border-radius: 20px;
        background: #101724e8;
        color: #ffd84a;
        font-size: 20px;
        font-weight: 900;
      }
      .count {
        margin: 10px 0 14px;
        font-weight: 900;
        color: #fff;
      }
      @media (max-width: 720px) {
        .wrap {
          width: 98vw;
          padding: 8px;
        }
        .hero {
          padding: 10px;
          margin: 8px 0;
        }
        .hero h1 {
          font-size: 19px;
        }
        .hero p {
          font-size: 12px;
        }
        .filters {
          margin: 7px 0;
        }
        .filters input {
          height: 44px;
          font-size: 14px;
        }
        .list {
          grid-template-columns: 1fr 1fr;
          gap: 7px;
        }
        .item {
          padding: 9px;
          border-radius: 14px;
        }
        .item h2 {
          font-size: 15px;
          margin-right: 42px;
        }
        .item.eventBig{min-height:230px;padding:11px;border-width:3px}
        .eventTypeBadge{font-size:14px;padding:7px 9px;margin-bottom:7px}
        .item.eventBig .eventDateStrong{font-size:13px}

        .meta {
          font-size: 12px;
          line-height: 1.35;
        }
        .go {
          font-size: 10px;
          min-height: 38px;
          padding: 7px;
        }
        .marketActions {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        .marketActions .go,
        .marketActions .verify,
        .marketActions .call {
          min-height: 38px;
          font-size: 10px;
          padding: 6px;
        }
        .favStar {
          font-size: 22px;
          right: 36px;
          top: 6px;
        }
        .statusDot {
          width: 12px;
          height: 12px;
          right: 7px;
          top: 10px;
        }
        .count {
          font-size: 12px;
        }
      }
    </style>

        function esc(x) {

        function specialDistanceText(r) {

            b = parseFloat(localStorage.getItem("return_lon")),

            return "";

            db = (d - b) * p,

                Math.sin(db / 2),
            km = 2 * 6371 * Math.asin(Math.sqrt(x));

            "specialMarketFavoriteDeviceOnlyV1:" +

        }
        function isFav(r) {

        }
        function marketIdentity(r) {

        }
        function marketVerificationKey(r) {

            "marketVerifyV9:" +

        }
        function marketVerifyUrl(r) {
          var back =
            "special-marches.html?country=" +
            encodeURIComponent(country) +
            "&type=" +
            encodeURIComponent(type);
          return (
            "verification-v9.html?k=" +
            encodeURIComponent(marketVerificationKey(r)) +

            "&t=" +

            "&c=" +
            encodeURIComponent(r[7] || "") +
            "&mk=" +

            "&country=" +
            encodeURIComponent(country) +
            "&type=" +

            "&lat=" +
            encodeURIComponent(r[10] == null ? "" : r[10]) +

        }

        function eventVisual(r){var x=norm([r&&r[1],r&&r[2],r&&r[6]].join(" "));if(/foire/.test(x))return{cls:"foire",label:"🎪 FOIRE"};if(/vide[ -]?grenier/.test(x))return{cls:"vide",label:"🧺 VIDE-GRENIER"};if(/braderie/.test(x))return{cls:"braderie",label:"🛍️ BRADERIE"};return{cls:"brocante",label:"🧳 BROCANTE"};}
        function capacityLabel(){if(type==="noel")return"🎄 Nombre de chalets : ";if(type==="brocante")return"👥 Nombre d’emplacements / exposants : ";if(type==="saisonnier")return"👥 Nombre d’emplacements / commerçants : ";return"👥 Nombre de places / commerçants : ";}
        function eventEndIso(r){var s=String((r&&r[4])||"")+" "+String((r&&r[6])||"");var months={janvier:1,fevrier:2,"février":2,mars:3,avril:4,mai:5,juin:6,juillet:7,aout:8,"août":8,septembre:9,octobre:10,novembre:11,decembre:12,"décembre":12,januari:1,februari:2,maart:3,april:4,mei:5,juni:6,juli:7,augustus:8,oktober:10,december:12},all=[].slice.call(s.matchAll(/(\d{1,2})\s+(janvier|f[eé]vrier|mars|avril|mai|juin|juillet|ao[uû]t|septembre|octobre|novembre|d[eé]cembre|januari|februari|maart|april|mei|juni|juli|augustus|oktober|december)\s+(20\d{2})/gi));if(all.length){var m=all[all.length-1],mo=months[String(m[2]).toLowerCase()];return m[3]+"-"+String(mo).padStart(2,"0")+"-"+String(Number(m[1])).padStart(2,"0")}var n=[].slice.call(s.matchAll(/(\d{1,2})[-\/.](\d{1,2})[-\/.](20\d{2})/g));if(n.length){var q=n[n.length-1];return q[3]+"-"+String(Number(q[2])).padStart(2,"0")+"-"+String(Number(q[1])).padStart(2,"0")}return"";}
        function eventExpired(r){if(type!=="brocante"&&type!=="noel")return false;var e=eventEndIso(r),d=new Date(),today=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");return !!e&&e<today;}
        function normalizeDepartmentSearch(raw) {
          raw=String(raw||"").trim().toUpperCase();
          if(!raw)return"";
          if(/^2[AB]$/.test(raw))return raw;
          if(/^\d{1,3}$/.test(raw)){
            var n=String(Number(raw));
            return n.length<2?n.padStart(2,"0"):n;
          }
          return"";
        }
        function areaMatchesDepartment(r,department) {
          if(!department)return false;
          var area=String((r&&r[0])||"").trim().toUpperCase();
          if(/^\d{1,3}$/.test(area)){
            var n=String(Number(area));
            area=n.length<2?n.padStart(2,"0"):n;
          }
          return area===department;
        }
        function render() {
          var searchRaw=document.getElementById("q").value,
            needle = norm(searchRaw),
            department = country === "fr" ? normalizeDepartmentSearch(searchRaw) : "",
            out = rows.filter(function (r) {
              if (eventExpired(r)) return false;
              if (department) return areaMatchesDepartment(r, department);
              return !needle || norm(r.join(" ")).includes(needle);
            });
          document.getElementById("count").textContent =
            out.length +
            " entrée" +
            (out.length > 1 ? "s" : "") +
            (department ? " dans le département " + department : "") +
            (type === "brocante"
              ? " dans la base locale + compléments croisés"
              : " dans la base locale");
          var box = document.getElementById("list");
          if (!out.length) {
            box.innerHTML =
              '<div class="empty">Aucun marché de cette catégorie n’est encore intégré pour cette zone.</div>';
            return;
          }
          box.innerHTML = out
            .map(function (r) {
              var idx = rows.indexOf(r);
              var hasGps =
                r[10] !== null &&
                r[10] !== "" &&
                r[11] !== null &&
                r[11] !== "" &&
                Number.isFinite(Number(r[10])) &&
                Number.isFinite(Number(r[11]));
              var destination = hasGps
                ? r[10] + "," + r[11]
                : (r[2] || "") + ", " + (r[8] || r[3] || "");
              var pref = localStorage.getItem("gps_pref") || "Google Maps";
              var maps =
                pref === "Waze"
                  ? "https://www.waze.com/ul?ll=" +
                    (hasGps ? encodeURIComponent(destination) : "") +
                    "&q=" +
                    encodeURIComponent(destination) +
                    "&navigate=yes"
                  : pref === "Plans Apple"
                    ? "https://maps.apple.com/?daddr=" +
                      encodeURIComponent(destination) +
                      "&dirflg=d"
                    : "https://www.google.com/maps/dir/?api=1&destination=" +
                      encodeURIComponent(destination) +
                      "&travelmode=driving&dir_action=navigate";
              var places =
                String(r[7] || "").trim() ||
                "Nombre de places non publié officiellement";
              var fav = isFav(r);
              var verifyUrl = marketVerifyUrl(r);
              var phone = specialPhone(r);
              var regAction = registrationAction(r);
              var goText = goLabel(r);
              var ev = type === "brocante" ? eventVisual(r) : null;
              return (
                '<article class="item card ' + (ev ? "eventBig" : "") + '" data-voice-card="market" data-voice-name="'+esc(r[2]||'Marché')+'" data-voice-day="'+esc(r[4]||'Date à vérifier')+'" data-voice-distance="'+esc(specialDistanceText(r)||'')+'" data-voice-count="'+esc(String(places).replace(/ officiellement/gi, ''))+'" data-voice-count-label="'+esc(type==="noel"?"chalets":type==="brocante"?"emplacements / exposants":"commerçants")+'" data-market-key="' +
                esc(marketIdentity(r)) +
                '"><button class="favStar ' +
                (fav ? "active" : "") +
                '" type="button" onclick="return window.toggleSpecialFav(' +
                idx +
                ',this)">' +
                (fav ? "★" : "☆") +
                '</button>' + (ev ? '<div class="eventTypeBadge '+ev.cls+'">'+ev.label+'</div>' : '') + '<h2>' +
                esc((r[3] || "") + " — " + (r[2] || "")) +
                "</h2>" +
                (specialDistanceText(r)
                  ? '<div class="meta" data-feature="market-distance" style="color:#6fe0ff;font-size:16px;font-weight:950;margin-bottom:5px">' +
                    esc(specialDistanceText(r)) +
                    "</div>"
                  : "") +
                '<div class="meta">📍 ' +
                esc(r[8] || "Adresse à vérifier") +
                '</div><div class="meta ' + (ev ? 'eventDateStrong' : '') + '">📅 ' +
                esc(r[4] || "Date / fréquence à vérifier") +
                '</div><div class="meta">🕒 ' +
                esc(r[5] || "Horaire à vérifier") +
                '</div><div class="meta">' + esc(capacityLabel()) +
                esc(String(places).replace(/ officiellement/gi, "")) +
                '</div><div class="meta">Tirage au sort : ' +
                esc(
                  String(r[12] || "Non publié").replace(
                    / officiellement/gi,
                    "",
                  ),
                ) +
                '</div><div class="meta">Humeur du placier : À vérifier</div><div class="meta">Responsable : À vérifier</div>' +
                (phone?'<div class="meta" style="color:#9ff0b7;font-weight:950">📞 '+esc(phone)+'</div>':'') +
                (r[6]
                  ? '<div class="meta">ℹ️ ' +
                    esc(
                      String(r[6])
                        .replace(/ officiellement/gi, "")
                        .replace(/GPS à confirmer sur place/gi, ""),
                    ) +
                    "</div>"
                  : "") +
                '<div class="marketActions"><a class="go" data-navigation="1" target="_blank" rel="noopener" href="' +
                maps +
                '">' + esc(goText) + '</a>' + (phone&&(!regAction||regAction.kind!=="phone")?'<a class="call" href="tel:'+esc(phone)+'">APPELER</a>':'') + '<a class="verify" href="' +
                verifyUrl +
                '">MODIFIER / VÉRIFIER</a>' + (regAction?'<a class="register" '+(regAction.kind==="web"?'target="_blank" rel="noopener" ':'')+'href="'+esc(regAction.href)+'">'+esc(regAction.label)+'</a>':'') + '</div></article>'
              );
            })
            .join("");
        }
        document.getElementById("q").oninput = render;
        render();
      })();
    </script>
