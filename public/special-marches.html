<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"
    />
    <title>Catégorie marchés</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #152f42, #6d4b28);
        color: #fff;
      }
      .wrap {
        width: min(980px, 94vw);
        margin: auto;
        padding: 18px;
      }
      .back,
      .go {
        display: inline-block;
        padding: 13px 18px;
        border-radius: 15px;
        background: linear-gradient(135deg, #ff9a19, #ff5b00);
        color: #fff;
        text-decoration: none;
        font-weight: 900;
      }
      .hero {
        margin: 16px 0;
        padding: 18px;
        border-radius: 22px;
        background: #101724e8;
        border: 2px solid #f39b19;
      }
      .hero h1 {
        margin: 0 0 7px;
        color: #ffd84a;
        font-size: 31px;
      }
      .hero p {
        margin: 0;
        color: #ddd;
        font-weight: 700;
      }
      .filters {
        display: flex;
        gap: 10px;
        margin: 12px 0;
      }
      .filters input {
        width: 100%;
        height: 52px;
        border: 2px solid #fff;
        border-radius: 14px;
        background: #07111d;
        color: #fff;
        padding: 0 14px;
        font-size: 18px;
        font-weight: 850;
      }
      .list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .item {
        position: relative;
        padding: 14px 14px;
        border-radius: 18px;
        background: #101724e8;
        border: 2px solid #f39b19;
        box-shadow: 0 5px 16px #0005;
        min-width: 0;
      }
      .item h2 {
        margin: 0 58px 8px 0;
        font-size: 21px;
        color: #fff;
      }
      .favStar {
        position: absolute;
        right: 32px;
        top: 9px;
        border: 0;
        background: transparent;
        color: #fff;
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
        padding: 2px;
      }
      .favStar.active {
        color: #ffc52b;
      }
      .statusDot {
        position: absolute;
        right: 9px;
        top: 12px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #ff9818;
        box-shadow: 0 0 8px #ff9818;
      }
      .statusDot.ok {
        background: #19d35b;
        box-shadow: 0 0 8px #19d35b;
      }
      .go {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 9px 11px;
        font-size: 13px;
      }
      .meta {
        line-height: 1.5;
        font-weight: 800;
      }
      .go {
        margin-top: 12px;
      }
      .empty {
        padding: 24px;
        text-align: center;
        border-radius: 20px;
        background: #101724e8;
        color: #ffd84a;
        font-size: 20px;
        font-weight: 900;
      }
      .count {
        margin: 10px 0 14px;
        font-weight: 900;
        color: #fff;
      }
      @media (max-width: 720px) {
        .wrap {
          width: 98vw;
          padding: 8px;
        }
        .hero {
          padding: 10px;
          margin: 8px 0;
        }
        .hero h1 {
          font-size: 19px;
        }
        .hero p {
          font-size: 12px;
        }
        .filters {
          margin: 7px 0;
        }
        .filters input {
          height: 44px;
          font-size: 14px;
        }
        .list {
          grid-template-columns: 1fr 1fr;
          gap: 7px;
        }
        .item {
          padding: 9px;
          border-radius: 14px;
        }
        .item h2 {
          font-size: 15px;
          margin-right: 42px;
        }
        .meta {
          font-size: 12px;
          line-height: 1.35;
        }
        .go {
          font-size: 10px;
          min-height: 38px;
          padding: 7px;
        }
        .favStar {
          font-size: 22px;
          right: 25px;
          top: 6px;
        }
        .statusDot {
          width: 12px;
          height: 12px;
          right: 7px;
          top: 10px;
        }
        .count {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <a class="back" href="choix-marches-final.html">← RETOUR</a>
      <section class="hero">
        <h1 id="title">CATÉGORIE</h1>
        <p id="subtitle">
          Dates, horaires, adresse, places et GPS disponibles.
        </p>
      </section>
      <div class="filters">
        <input id="q" placeholder="Rechercher une commune ou un marché" />
      </div>
      <div class="count" id="count"></div>
      <section class="list" id="list"></section>
    </main>
    <script src="market-data-fr.js"></script>
    <script src="markets-france-update-v139.js?v=139"></script>
    <script src="markets-france-osm-v139.js?v=139"></script>
    <script src="markets-35-corrections-v142.js?v=142"></script>
    <script src="markets-35-missing-v143.js?v=143"></script>
    <script>
      window.__FR_DATA = Array.isArray(data) ? data.slice() : [];
    </script>
    <script src="market-data-be.js?v=20260905-dedup-fr"></script>
    <script>
      (function () {
        var BE = Array.isArray(data) ? data.slice() : [],
          FR = window.__FR_DATA || [];
        var p = new URLSearchParams(location.search),
          country = p.get("country") === "be" ? "be" : "fr";
        var requested = p.get("type") || "brocante";
        var allowed = ["noel", "brocante", "saisonnier", "periodique"];
        var type = allowed.indexOf(requested) >= 0 ? requested : "brocante";
        function norm(s) {
          return String(s || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[’']/g, "'")
            .replace(/\s+/g, " ")
            .trim();
        }
        function blob(r) {
          return norm([r[1], r[2], r[4], r[5], r[6], r[8]].join(" "));
        }
        function isNoel(r) {
          var typ = norm(r[1]),
            name = norm(r[2]),
            note = norm(r[6]);
          return (
            /(^|\s)(noel|kerst)(\s|$)/.test(typ) ||
            /(marche|markt)[^,;]{0,30}(noel|kerst)/.test(name) ||
            /(marche|markt)[^,;]{0,30}(noel|kerst)/.test(note)
          );
        }
        function isBroc(r) {
          var s = blob(r);
          return /(brocante|antiquite|puces|vide grenier|rommelmarkt|vlooienmarkt)/.test(
            s,
          );
        }
        function isPeriodic(r) {
          var s = blob(r);
          return (
            /(toutes? les 2 semaines|toutes? les deux semaines|une semaine sur deux|semaines? (?:paires?|impaires?)|bimensuel|bi-?mensuel|mensuel|trimestriel|1er|1ere|premier|premiere|2e|2eme|deuxieme|3e|3eme|troisieme|4e|4eme|quatrieme)[^.;]{0,40}(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)/.test(
              s,
            ) ||
            /(chaque|tous? les) (?:1er|2e|3e|4e|premier|deuxieme|troisieme|quatrieme)\b/.test(
              s,
            ) ||
            /(?:1er|2e|3e|4e)\s*(?:et|&)\s*(?:1er|2e|3e|4e)/.test(s)
          );
        }
        function isSeasonal(r) {
          var s = blob(r);
          if (isNoel(r) || isBroc(r)) return false;
          if (
            /(?:pornic|la birochere|sainte-marie-sur-mer|le clion-sur-mer|la baule-les-pins|guezy)/.test(
              s,
            )
          )
            return false;
          var named =
            /(saisonnier|saisonniere|saison |marche d'?ete|zomermarkt|wintermarkt hors noel|uniquement en (?:ete|hiver|printemps|automne)|pendant (?:l'?ete|l'?hiver|le printemps|l'?automne)|du \d{1,2}\s*(?:mai|juin|juillet|aout|septembre) au \d{1,2}\s*(?:mai|juin|juillet|aout|septembre)|de (?:mai|juin|juillet|aout|septembre) a (?:mai|juin|juillet|aout|septembre))/.test(
              s,
            );
          if (named) return true;
          var m = String(r[6] || "").match(
            /Période publiée : (\d{4}-\d{2}-\d{2})<->(\d{4}-\d{2}-\d{2})/,
          );
          if (!m) return false;
          if (!/(marche|markt)/.test(norm([r[1], r[2]].join(" "))))
            return false;
          var a = Date.parse(m[1] + "T00:00:00Z"),
            b = Date.parse(m[2] + "T00:00:00Z");
          return (
            Number.isFinite(a) &&
            Number.isFinite(b) &&
            b > a &&
            (b - a) / 86400000 < 300
          );
        }
        function belongs(r) {
          if (type === "noel") return isNoel(r);
          if (type === "brocante") return isBroc(r) && !isNoel(r);
          if (type === "saisonnier") return isSeasonal(r);
          if (type === "periodique")
            return isPeriodic(r) && !isNoel(r) && !isBroc(r) && !isSeasonal(r);
          return false;
        }
        var src = country === "be" ? BE : FR;
        var rows = src.filter(belongs);
        var names = {
          noel: ["MARCHÉS DE NOËL ", "🎄 "],
          brocante: ["BROCANTES ", "🧳 "],
          saisonnier: ["MARCHÉS SAISONNIERS ", "☀️ "],
          periodique: ["MARCHÉS PÉRIODIQUES ", "📅 "],
        };
        var spec = names[type],
          label = spec[0] + (country === "be" ? "BELGIQUE" : "FRANCE");
        document.getElementById("title").textContent = spec[1] + label;
        document.getElementById("subtitle").textContent =
          type === "saisonnier"
            ? "Marchés présents seulement pendant une période de l’année. La période publiée reste affichée dans la fiche."
            : type === "periodique"
              ? "Marchés récurrents qui ne sont pas toutes les semaines : toutes les 2 semaines, 1er/2e/3e/4e jour du mois, mensuels ou trimestriels."
              : "Dates, horaires, adresse, places et GPS disponibles.";
        function esc(x) {
          return String(x || "").replace(/[&<>\"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '\"': "&quot;" }[
              c
            ];
          });
        }
        function specialDistanceText(r) {
          var a = parseFloat(localStorage.getItem("return_lat")),
            b = parseFloat(localStorage.getItem("return_lon")),
            c = parseFloat(r && r[10]),
            d = parseFloat(r && r[11]);
          if (!isFinite(a) || !isFinite(b) || !isFinite(c) || !isFinite(d))
            return "";
          var p = Math.PI / 180,
            da = (c - a) * p,
            db = (d - b) * p,
            x =
              Math.sin(da / 2) * Math.sin(da / 2) +
              Math.cos(a * p) *
                Math.cos(c * p) *
                Math.sin(db / 2) *
                Math.sin(db / 2),
            km = 2 * 6371 * Math.asin(Math.sqrt(x));
          if (km < 1) return Math.round(km * 1000) + " m";
          return (km < 10 ? km.toFixed(1) : Math.round(km)) + " km";
        }
        function favKey(r) {
          return (
            "specialMarketFavoriteDeviceOnlyV1:" +
            country +
            ":" +
            [r[0], r[1], r[2], r[3], r[4], r[8] || ""].join("|")
          );
        }
        function isFav(r) {
          try {
            return localStorage.getItem(favKey(r)) === "1";
          } catch (e) {
            return false;
          }
        }
        window.toggleSpecialFav = function (id, btn) {
          var r = rows[Number(id)];
          if (!r) return false;
          var k = favKey(r),
            on = isFav(r);
          try {
            if (on) localStorage.removeItem(k);
            else localStorage.setItem(k, "1");
            on = !on;
          } catch (e) {}
          btn.textContent = on ? "★" : "☆";
          btn.classList.toggle("active", on);
          return false;
        };
        function render() {
          var needle = norm(document.getElementById("q").value),
            out = rows.filter(function (r) {
              return !needle || norm(r.join(" ")).includes(needle);
            });
          document.getElementById("count").textContent =
            out.length +
            " entrée" +
            (out.length > 1 ? "s" : "") +
            " dans la base locale";
          var box = document.getElementById("list");
          if (!out.length) {
            box.innerHTML =
              '<div class="empty">Aucun marché de cette catégorie n’est encore intégré pour cette zone.</div>';
            return;
          }
          box.innerHTML = out
            .map(function (r) {
              var idx = rows.indexOf(r);
              var hasGps =
                r[10] !== null &&
                r[10] !== "" &&
                r[11] !== null &&
                r[11] !== "" &&
                Number.isFinite(Number(r[10])) &&
                Number.isFinite(Number(r[11]));
              var destination = hasGps
                ? r[10] + "," + r[11]
                : (r[2] || "") + ", " + (r[8] || r[3] || "");
              var pref = localStorage.getItem("gps_pref") || "Google Maps";
              var maps =
                pref === "Waze"
                  ? "https://www.waze.com/ul?ll=" +
                    (hasGps ? encodeURIComponent(destination) : "") +
                    "&q=" +
                    encodeURIComponent(destination) +
                    "&navigate=yes"
                  : pref === "Plans Apple"
                    ? "https://maps.apple.com/?daddr=" +
                      encodeURIComponent(destination) +
                      "&dirflg=d"
                    : "https://www.google.com/maps/dir/?api=1&destination=" +
                      encodeURIComponent(destination) +
                      "&travelmode=driving&dir_action=navigate";
              var places =
                String(r[7] || "").trim() ||
                "Nombre de places non publié officiellement";
              var fav = isFav(r);
              return (
                '<article class="item"><button class="favStar ' +
                (fav ? "active" : "") +
                '" type="button" onclick="return window.toggleSpecialFav(' +
                idx +
                ',this)">' +
                (fav ? "★" : "☆") +
                '</button><span class="statusDot"></span><h2>' +
                esc((r[3] || "") + " — " + (r[2] || "")) +
                "</h2>" +
                (specialDistanceText(r)
                  ? '<div class="meta" data-feature="market-distance" style="color:#6fe0ff;font-size:16px;font-weight:950;margin-bottom:5px">' +
                    esc(specialDistanceText(r)) +
                    "</div>"
                  : "") +
                '<div class="meta">📍 ' +
                esc(r[8] || "Adresse à vérifier") +
                "<br>📅 " +
                esc(r[4] || "Date / fréquence à vérifier") +
                "<br>🕒 " +
                esc(r[5] || "Horaire à vérifier") +
                "<br>👥 " +
                esc(String(places).replace(/ officiellement/gi, "")) +
                "<br>🎲 Tirage : " +
                esc(
                  String(r[12] || "Non publié").replace(
                    / officiellement/gi,
                    "",
                  ),
                ) +
                (r[6]
                  ? "<br>ℹ️ " +
                    esc(
                      String(r[6])
                        .replace(/ officiellement/gi, "")
                        .replace(/GPS à confirmer sur place/gi, ""),
                    )
                  : "") +
                '</div><a class="go" target="_blank" rel="noopener" href="' +
                maps +
                '">ALLER AU MARCHÉ</a></article>'
              );
            })
            .join("");
        }
        document.getElementById("q").oninput = render;
        render();
      })();
    </script>
    <script src="new-feature-bubbles.js?v=20260905"></script>
  </body>
</html>
