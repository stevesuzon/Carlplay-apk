<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152f"/><stop offset=".45" stop-color="#3b0d7c"/><stop offset="1" stop-color="#b10b68"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff8b3"/><stop offset=".3" stop-color="#ffd636"/><stop offset=".65" stop-color="#ff9d00"/><stop offset="1" stop-color="#a73d00"/></linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4bd8"/><stop offset="1" stop-color="#8c20ff"/></linearGradient>
  <radialGradient id="burst"><stop stop-color="#fff"/><stop offset=".2" stop-color="#58e5ff"/><stop offset=".55" stop-color="#3c4cff" stop-opacity=".8"/><stop offset="1" stop-color="#33106f" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
