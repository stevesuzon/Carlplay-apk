<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>Marchés de voyageurs</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:linear-gradient(135deg,#152f42,#6d4b28);color:#fff}.wrap{width:min(980px,96vw);margin:auto;padding:12px}.back{display:inline-block;padding:12px 16px;border-radius:14px;background:linear-gradient(135deg,#ff9a19,#ff5b00);color:#fff;text-decoration:none;font-weight:950}.hero{margin:12px 0;padding:15px;border-radius:20px;background:#101724ee;border:2px solid #9ca3af}.hero h1{margin:0 0 6px;color:#ffd84a;font-size:27px}.hero p{margin:4px 0;color:#e5e7eb;font-weight:750}.beta{display:inline-block;margin-top:7px;padding:6px 10px;border-radius:10px;background:#7f1d1d;border:1px solid #fca5a5;color:#fff;font-size:12px;font-weight:950}.notice{margin:10px 0;padding:11px;border-radius:14px;background:#271d08;border:1px solid #f59e0b;color:#ffe7a3;font-size:13px;font-weight:850}.filters{display:grid;grid-template-columns:1fr auto;gap:8px;margin:10px 0}.filters input,.filters button{height:46px;border-radius:13px;border:2px solid #fff;font-size:15px;font-weight:900}.filters input{background:#07111d;color:#fff;padding:0 12px}.filters button{background:#26364a;color:#fff;padding:0 13px}.count{font-weight:900;margin:8px 0}.list{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{position:relative;padding:12px;border-radius:17px;background:#101724ef;border:2px solid #6b7280;box-shadow:0 5px 16px #0005}.card.future{border-color:#22c55e}.card.current{border-color:#ffd84a}.card.past{opacity:.76}.tag{position:absolute;right:9px;top:9px;padding:4px 7px;border-radius:10px;background:#26364a;font-size:10px;font-weight:950}.statusDot{position:absolute;left:9px;top:9px;width:12px;height:12px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 2px #0007}.statusDot.ok{background:#22c55e}.card h2{margin:0 70px 7px 18px;font-size:18px;color:#fff}.meta{font-size:13px;line-height:1.45;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.go,.call{display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:12px;color:#fff;text-decoration:none;font-size:11px;font-weight:950;text-align:center;padding:7px}.go{background:linear-gradient(135deg,#ff9a19,#ff5b00)}.call{background:#168a4e}.source{margin-top:7px;color:#9ca3af;font-size:10px}.empty{grid-column:1/-1;padding:22px;text-align:center;border-radius:17px;background:#101724ef;color:#ffd84a;font-weight:900}@media(max-width:700px){.wrap{padding:8px}.hero h1{font-size:20px}.hero p{font-size:12px}.notice{font-size:11px}.list{grid-template-columns:1fr 1fr;gap:6px}.card{padding:9px}.card h2{font-size:14px;margin-right:55px}.meta{font-size:10.5px}.tag{font-size:8px;right:6px;top:6px}.statusDot{left:6px;top:6px;width:10px;height:10px}.go,.call{font-size:9px;min-height:36px}.filters{grid-template-columns:1fr}.filters button{height:40px}.actions{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><a class="back" href="choix-marches-final.html">← RETOUR</a><section class="hero"><h1 id="title">🚐 MARCHÉS DE VOYAGEURS</h1><p id="sub"></p><span class="beta">BÊTA — MARCHÉS À VÉRIFIER</span></section><div class="notice" id="notice"></div><div class="filters"><input id="q" placeholder="Rechercher une ville, un département ou une adresse"><button id="togglePast" type="button">VOIR AUSSI LES ANCIENS</button></div><div class="count" id="count"></div><section id="list" class="list"></section></main>
<script src="traveller-markets-data-v162.js?v=163"></script><script>
(function(){var p=new URLSearchParams(location.search),country=p.get('country')==='be'?'be':'fr',db=window.CARPLAY_TRAVELLER_MARKETS||{},rows=(db[country]||[]).slice(),showPast=country==='be';var today=new Date();today.setHours(0,0,0,0);function d(s){if(!s)return null;var x=new Date(s+'T00:00:00');return isNaN(x)?null:x}function status(r){var a=d(r.start),b=d(r.end||r.start);if(!a||!b)return'unknown';if(today<a)return'future';if(today>b)return'past';return'current'}function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}function esc(s){return String(s||'').replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}function cleanPhone(s){return String(s||'').replace(/[^0-9+]/g,'')}function nav(r){var dest=(Number.isFinite(Number(r.latitude))&&Number.isFinite(Number(r.longitude)))?String(r.latitude)+','+String(r.longitude):(r.address||r.city);var pref=localStorage.getItem('gps_pref')||'Google Maps';if(pref==='Waze')return'https://www.waze.com/ul?q='+encodeURIComponent(dest)+'&navigate=yes';if(pref==='Plans Apple')return'https://maps.apple.com/?daddr='+encodeURIComponent(dest)+'&dirflg=d';return'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+'&travelmode=driving&dir_action=navigate'}
function render(){var q=norm(document.getElementById('q').value);var out=rows.filter(function(r){if(q&&!norm([r.name,r.city,r.area,r.address,r.dateLabel,r.organizer,r.phone].join(' ')).includes(q))return false;return showPast||status(r)!=='past'});out.sort(function(a,b){var sa=status(a),sb=status(b),rank={current:0,future:1,unknown:2,past:3};if(rank[sa]!==rank[sb])return rank[sa]-rank[sb];var da=d(a.start),db=d(b.start);if(sa==='past')return (db?db.getTime():0)-(da?da.getTime():0);return(da?da.getTime():9e15)-(db?db.getTime():9e15)});document.getElementById('count').textContent=out.length+' marché'+(out.length>1?'s':'')+' affiché'+(out.length>1?'s':'');var box=document.getElementById('list');if(!out.length){box.innerHTML='<div class="empty">Aucune date publiée pour le moment.</div>';return}box.innerHTML=out.map(function(r){var st=status(r),label=st==='current'?'EN COURS':st==='future'?'À VENIR':st==='past'?'ANCIEN':'DATE À CONFIRMER',phone=cleanPhone(r.phone),gps=(Number.isFinite(Number(r.latitude))&&Number.isFinite(Number(r.longitude)))?(Number(r.latitude).toFixed(6)+', '+Number(r.longitude).toFixed(6)):'À vérifier sur place',org=r.organizer||'';return'<article class="item card '+st+'" data-base-address="'+esc(r.address||r.city)+'"><span class="statusDot"></span><span class="tag">'+label+'</span><h2>'+esc(r.name)+'</h2><div class="meta">📍 '+esc(r.address||r.city)+'<br>🛰️ GPS : '+esc(gps)+'<br>📅 '+esc(r.dateLabel)+'<br>🕒 '+esc(r.hours||'Horaire à confirmer')+(org?'<br>📞 Organisateur : '+esc(org):'')+(r.note?'<br>ℹ️ '+esc(r.note):'')+'</div><div class="actions"><a class="go" target="_blank" rel="noopener" href="'+nav(r)+'">ALLER AU MARCHÉ</a>'+(phone?'<a class="call" href="tel:'+phone+'">APPELER L’ORGANISATEUR</a>':'')+'</div><div class="source">Source : '+esc(r.source||'')+' — mise à jour '+esc(db.updatedAt||'')+'</div></article>'}).join('')}
document.getElementById('title').textContent='🚐 MARCHÉS DE VOYAGEURS '+(country==='be'?'BELGIQUE':'FRANCE');document.getElementById('sub').textContent=country==='be'?'Belgique — section en cours de construction.':'France — calendrier en cours de vérification.';document.getElementById('notice').textContent='BÊTA : dates, horaires et GPS à vérifier. Chaque fiche peut être renseignée et corrigée comme les autres marchés. Le GPS exact validé sur place devient le point officiel du serveur.';var b=document.getElementById('togglePast');if(country==='be'){b.textContent='ANCIENNES DATES AFFICHÉES';b.disabled=true}else b.onclick=function(){showPast=!showPast;b.textContent=showPast?'MASQUER LES ANCIENS':'VOIR AUSSI LES ANCIENS';render()};document.getElementById('q').oninput=render;render();})();
</script><script src="special-market-server-v157.js?v=163"></script><script src="sanction-guard-v161.js?v=161"></script></body></html>
