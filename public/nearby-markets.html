.market-photo{display:block;width:100%;max-width:330px;margin:12px 0 4px;padding:0;border:3px solid #f39b19;border-radius:15px;overflow:hidden;background:#05090f;cursor:pointer}.market-photo img{display:block;width:100%;height:150px;object-fit:cover}.photo-note{display:block;padding:7px 9px;color:#dbe8f4;font-size:12px;font-weight:850;text-align:left}.photo-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:18px;background:#000e}.photo-modal.open{display:flex}.photo-box{position:relative;width:min(920px,96vw);max-height:94vh;padding:12px;border:3px solid #f39b19;border-radius:20px;background:#07111d}.photo-box img{display:block;width:100%;max-height:78vh;object-fit:contain;border-radius:12px;background:#000}.photo-caption{padding:10px 50px 2px 4px;color:#fff;font-weight:850}.photo-close{position:absolute;right:16px;top:16px;width:44px;height:44px;border:0;border-radius:50%;background:#f39b19;color:#111;font-size:27px;font-weight:950;cursor:pointer}
.market-photo-add{display:flex;width:100%;max-width:330px;min-height:100px;margin:12px 0 4px;align-items:center;justify-content:center;border:3px dashed #62d8ff;border-radius:15px;background:#081727;color:#62d8ff;text-align:center;text-decoration:none;font-size:17px;font-weight:950}.marketFavoriteStar{position:absolute;right:42px;top:8px;border:0;background:transparent;color:#dce8f5;font-size:31px;line-height:1;cursor:pointer;padding:0}.marketFavoriteStar.active{color:#ffc533}.card .name{padding-right:78px}@media(max-width:340px){.cards{grid-template-columns:1fr}}

/* V145 — même petit carré que les fiches marchés France/Belgique */

.eventCityBig{margin:2px 0 7px;font-size:23px;line-height:1.05;color:#6fe0ff;font-weight:1000;letter-spacing:.2px}.specialDate{margin-top:2px;font-size:15px!important;line-height:1.25!important;color:#ffe38a!important;font-weight:1000!important}.specialTimer{margin-top:3px;font-size:12px!important;line-height:1.2!important;color:#ffd84a!important;font-weight:950!important}.specialPhone{margin-top:4px;color:#8ff0b6!important;font-weight:950!important}.market-actions.has-three{grid-template-columns:1fr 1fr!important}.market-actions .register{grid-column:1/-1!important;display:flex!important;align-items:center!important;justify-content:center!important;min-height:38px!important;padding:6px 5px!important;border-radius:8px!important;background:#168a4e!important;color:#fff!important;text-decoration:none!important;text-align:center!important;font-size:9px!important;line-height:1.15!important;font-weight:1000!important}
@media(max-width:650px){.sectionTitle{font-size:18px}.specialDate{font-size:14px!important}}
.card{position:relative!important;min-width:0!important;padding:8px!important;border:2px solid #f39b19!important;border-radius:14px!important;background:rgba(5,17,34,.97)!important;overflow:hidden!important}

.card .market-photo,.card .market-photo-add{float:left!important;width:38%!important;max-width:105px!important;min-height:78px!important;margin:3px 6px 5px 0!important;border-radius:6px!important}

.card .market-actions .open{background:#138be8!important;color:#fff!important}.card .market-actions .details{background:#f39b19!important;color:#fff!important}
.marketVerificationDot{width:13px!important;height:13px!important;right:6px!important;top:6px!important}.marketFavoriteStar{right:27px!important;top:2px!important;font-size:25px!important}

</style>

<!-- V490 : données 250 km chargées par petits fichiers selon « Retourner sur la place ». -->
<script>
(() => {
  'use strict';
  const requestedRadius=Number(new URLSearchParams(location.search).get('radius')||250);
  const LIMIT_KM = requestedRadius===80?80:(requestedRadius===150?150:250);
  const DAYS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  let viewDate = new Date();
  let showTomorrow = viewDate.getHours() >= 17;
  if(showTomorrow) viewDate.setDate(viewDate.getDate()+1);
  let selectedDay = DAYS[viewDate.getDay()];
  let viewToken = viewDate.getFullYear()+'-'+viewDate.getMonth()+'-'+viewDate.getDate()+'-'+(showTomorrow?'tomorrow':'today');
  // V428-period-rollover : à 17 h on passe à demain, à minuit on revient à aujourd’hui.
  setInterval(()=>{
    const shouldTomorrow=(new Date()).getHours()>=17;
    if(shouldTomorrow!==showTomorrow) location.reload();
  },30000);
  const heading = document.getElementById('marketHeading');
  const status = document.getElementById('status');
  const cards = document.getElementById('cards');
  const photoModal = document.getElementById('photoModal');
  const photoLarge = document.getElementById('photoLarge');
  const storedNumber = key => { const raw=localStorage.getItem(key); return raw===null||String(raw).trim()===''?NaN:Number(raw); };
  const returnLat = storedNumber('return_lat');
  const returnLon = storedNumber('return_lon');
  let userLat=returnLat,userLon=returnLon;
  try{
    const recent=JSON.parse(localStorage.getItem('marketDistanceReferenceV1')||'null');
    const age=Date.now()-Number(recent&&recent.updatedAt||0),lat=Number(recent&&recent.latitude),lon=Number(recent&&recent.longitude);
    if(age>=0&&age<=15*60*1000&&Number.isFinite(lat)&&Number.isFinite(lon)){userLat=lat;userLon=lon;}
  }catch(e){}
  let disabledKeys = new Set();
  let disabledSignature = '';
  const usingRecentGps = Number.isFinite(userLat)&&Number.isFinite(userLon)&&(userLat!==returnLat||userLon!==returnLon);
  const referenceLabel = usingRecentGps?'ta position GPS vérifiée':'« Retourner sur la place »';

  const norm = v => String(v ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  const cleanCardText = v => String(v ?? '').replace(/\s+officiellement\b/gi,'').replace(/\s*[,;:-]?\s*GPS\s+[àa]\s+confirmer\s+sur\s+place\b/gi,'').replace(/\s{2,}/g,' ').trim();
  const displayCity = row => {
    const direct=cleanCardText(row?.[3]||'');
    if(direct) return direct;
    const address=cleanCardText(row?.[8]||'');
    let m=address.match(/\b\d{5}\s*,?\s*([^,]+)$/);
    if(m&&m[1]) return m[1].trim();
    const parts=address.split(',').map(x=>x.trim()).filter(Boolean);
    if(parts.length>1) return parts[parts.length-1].replace(/^\d{5}\s*/,'').trim()||'Ville à vérifier';
    return 'Ville à vérifier';
  };
  const identity = (country,row) => [country,row?.[0],row?.[2],row?.[3],row?.[4],row?.[8]||''].join('|');
  const isServerDisabled = (country,row) => { const key=identity(country,row); if(disabledKeys.has(key)) return true; try{return localStorage.getItem('marketPresenceV174:'+key)==='non'}catch(e){return false} };
  async function loadDisabledKeys(){
    try{
      const r=await fetch('/api/market-presence/disabled',{cache:'no-store'}),j=await r.json();
      if(!r.ok||!j||!Array.isArray(j.keys))throw 0;
      const keys=j.keys.map(String).filter(Boolean),sig=keys.slice().sort().join('\n'),changed=sig!==disabledSignature;
      disabledSignature=sig;disabledKeys=new Set(keys);
      keys.forEach(k=>{try{localStorage.setItem('marketPresenceV174:'+k,'non')}catch(e){}});
      return changed;
    }catch(e){return false}
  }
  const verificationKey = (country,row) => 'marketVerifyV9:'+country+':'+[row?.[0],row?.[1],row?.[2],row?.[3],row?.[4],row?.[5],row?.[8]||''].join('|');
  const saved = (country,row) => { try { const v=localStorage.getItem(verificationKey(country,row)); return v?JSON.parse(v):null; } catch(e){ return null; } };
  const builtInVerified = row => { const note=norm(row?.[6]); return note.includes('verifie sur le site officiel')||note.includes('verifie officiellement'); };
  const favoriteKey = (country,row) => 'marketFavoriteDeviceOnlyV1:'+country+':'+identity(country,row);
  const isFavorite = (country,row) => { try { return localStorage.getItem(favoriteKey(country,row))==='1'; } catch(e){ return false; } };
  const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const distanceKm = (a,b,c,d) => { const R=6371,p=Math.PI/180,da=(c-a)*p,db=(d-b)*p,x=Math.sin(da/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(db/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };

  // V335 — La page rayon utilise EXCLUSIVEMENT le point enregistré par « Retourner sur la place ».
  // Elle ne charge plus les ~8 Mo de bases France/Belgique au démarrage : seulement les zones géographiques utiles.
  window.NEAR_FR=[]; window.NEAR_BE=[]; window.SPECIAL_FR=[]; window.SPECIAL_BE=[];
  function nearestPointToBox(lat,lon,b){
    return {lat:Math.max(Number(b.minLat),Math.min(lat,Number(b.maxLat))),lon:Math.max(Number(b.minLon),Math.min(lon,Number(b.maxLon)))};
  }
  function mergeRows(target,rows){
    const seen=new Set((target||[]).map(r=>[r?.[0],r?.[1],r?.[2],r?.[3],r?.[4],r?.[8]||''].join('|').toLowerCase()));
    for(const r of (rows||[])){const k=[r?.[0],r?.[1],r?.[2],r?.[3],r?.[4],r?.[8]||''].join('|').toLowerCase();if(!seen.has(k)){seen.add(k);target.push(r)}}
  }
  let cityPointIndexV430=new Map();
  function cityPointKeyV430(country,row){
    return String(country||'')+'|'+norm(row?.[3]||'');
  }
  function rebuildCityPointIndexV430(){
    cityPointIndexV430=new Map();
    for(const country of ['fr','be']){
      const rows=[...(country==='fr'?(window.NEAR_FR||[]):(window.NEAR_BE||[])),...(country==='fr'?(window.SPECIAL_FR||[]):(window.SPECIAL_BE||[]))];
      for(const row of rows){const p=validPoint(row);if(!p)continue;const k=cityPointKeyV430(country,row);if(k&&!cityPointIndexV430.has(k))cityPointIndexV430.set(k,p)}
    }
  }
  function pointForRadiusV430(country,row){
    const exact=validPoint(row);if(exact)return exact;
    const p=cityPointIndexV430.get(cityPointKeyV430(country,row));
    return p?{lat:p.lat,lon:p.lon,exact:false}:null;
  }
  async function loadServerMarketsV430(lat,lon){
    let live=[];
    try{
      const r=await fetch('/api/markets?nearby_v430='+Date.now(),{cache:'no-store'});
      const j=await r.json();
      if(r.ok&&j&&Array.isArray(j.markets)){
        live=j.markets;
        try{localStorage.setItem('server_markets',JSON.stringify(live));localStorage.setItem('markets_last_update',new Date().toISOString())}catch(_){}
      }
    }catch(_){
      try{live=JSON.parse(localStorage.getItem('server_markets')||'[]')}catch(__){live=[]}
    }
    if(!Array.isArray(live))return;
    for(const m of live){
      const row=[m.area||'',m.kind||'marche',m.name||'Marché',m.city||'',m.date_label||m.day||'',m.hours||'',m.note||m.kind||'',m.merchants||'',m.address||m.city||'',m.source_url?[m.source_url]:[],m.latitude,m.longitude,m.draw||'',m.registration||'','',m.phone||'',m.date_label||m.day||''];
      const country=String(m.country||'FR').toUpperCase()==='BE'?'be':'fr';
      const blob=norm([row[1],row[2],row[4],row[6],row[8]].join(' '));
      const regular=String(row[1]||'').toLowerCase()==='marche'&&!/producteur|producteurs|producent|producenten|paysan|paysans|boerenmarkt|vente directe/.test(blob)&&!/mensuel|trimestriel|bimensuel|une semaine sur deux|toutes les 2 semaines|saisonnier|marche d ete/.test(blob);
      if(regular)mergeRows(country==='be'?window.NEAR_BE:window.NEAR_FR,[row]);
      mergeRows(country==='be'?window.SPECIAL_BE:window.SPECIAL_FR,[row]);
    }
  }
  function addServerMarketsFromCache(lat,lon){
    try{
      const live=JSON.parse(localStorage.getItem('server_markets')||'[]');
      if(!Array.isArray(live))return;
      for(const m of live){
        const la=Number(m.latitude),lo=Number(m.longitude);if(!Number.isFinite(la)||!Number.isFinite(lo)||distanceKm(lat,lon,la,lo)>LIMIT_KM+15)continue;
        const row=[m.area||'',m.kind||'marche',m.name||'Marché',m.city||'',m.date_label||m.day||'',m.hours||'',m.note||m.kind||'',m.merchants||'',m.address||m.city||'',m.source_url?[m.source_url]:[],la,lo,m.draw||'',m.registration||'','',m.phone||'',m.date_label||m.day||''];
        const country=String(m.country||'FR').toUpperCase()==='BE'?'be':'fr';
        const blob=norm([row[1],row[2],row[4],row[6],row[8]].join(' '));
        const regular=String(row[1]||'').toLowerCase()==='marche'&&!/producteur|producteurs|producent|producenten|paysan|paysans|boerenmarkt|vente directe/.test(blob)&&!/mensuel|trimestriel|bimensuel|une semaine sur deux|toutes les 2 semaines|saisonnier|marche d ete/.test(blob);
        if(regular)mergeRows(country==='be'?window.NEAR_BE:window.NEAR_FR,[row]);
        mergeRows(country==='be'?window.SPECIAL_BE:window.SPECIAL_FR,[row]);
      }
    }catch(_){ }
  }
  async function loadNearbyShards(lat,lon){
    window.NEAR_FR=[];window.NEAR_BE=[];window.SPECIAL_FR=[];window.SPECIAL_BE=[];
    const indexResponse=await fetch('/nearby-shards/index.json?v=335',{cache:'force-cache'});
    if(!indexResponse.ok)throw new Error('INDEX_NEARBY');
    const index=await indexResponse.json();
    const candidates=(index.areas||[]).filter(a=>{
      const p=nearestPointToBox(lat,lon,a);return distanceKm(lat,lon,p.lat,p.lon)<=LIMIT_KM+15;
    });
    status.textContent='Position '+referenceLabel+' trouvée — chargement de '+candidates.length+' zone'+(candidates.length>1?'s':'')+' proche'+(candidates.length>1?'s':'')+'…';
    const chunks=await Promise.all(candidates.map(async a=>{
      try{const r=await fetch('/nearby-shards/'+a.file+'?v=430',{cache:'no-store'});return r.ok?await r.json():null}catch(_){return null}
    }));
    for(let i=0;i<chunks.length;i++){
      const a=candidates[i],j=chunks[i];if(!j)continue;
      const weekly=a.country==='be'?window.NEAR_BE:window.NEAR_FR;
      const special=a.country==='be'?window.SPECIAL_BE:window.SPECIAL_FR;
      mergeRows(weekly,j.weekly||[]);mergeRows(special,j.special||[]);
    }
    // V490 : la page 250 km recharge aussi les mêmes fichiers que la rubrique « Marchés ».
    // Cela évite qu'un marché présent dans Marchés disparaisse simplement parce que le shard 250 km est plus ancien.
    const dayFile=norm(selectedDay);
    const mainChunks=await Promise.all(candidates.map(async a=>{
      try{
        const area=String(a.area||'');
        const url=a.country==='be'?('/market-chunks/be/'+encodeURIComponent(area)+'/'+dayFile+'.json?v=430'):('/market-chunks/fr/'+encodeURIComponent(area.toUpperCase())+'/'+dayFile+'.json?v=430');
        const r=await fetch(url,{cache:'no-store'});return r.ok?{a,rows:await r.json()}:null;
      }catch(_){return null}
    }));
    for(const pack of mainChunks){if(!pack||!Array.isArray(pack.rows))continue;mergeRows(pack.a.country==='be'?window.NEAR_BE:window.NEAR_FR,pack.rows)}
    await loadServerMarketsV430(lat,lon);
    addServerMarketsFromCache(lat,lon);
    rebuildCityPointIndexV430();
  }
  const isToday = row => {
    const value=norm(row?.[4]);
    if(!value || value.includes('non publie') || value.includes('a verifier')) return false;
    if(value.includes('tous les jours')) return true;
    const months={janvier:0,fevrier:1,mars:2,avril:3,mai:4,juin:5,juillet:6,aout:7,septembre:8,octobre:9,novembre:10,decembre:11};
    const dated=value.match(/\b(\d{1,2})\s+(janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre)\s+(20\d{2})\b/);
    if(dated) return viewDate.getFullYear()===Number(dated[3])&&viewDate.getMonth()===months[dated[2]]&&viewDate.getDate()===Number(dated[1]);
    return new RegExp('(^| )'+norm(selectedDay)+'( |$)').test(value);
  };

  const specialKind = row => {
    const value=norm([row?.[1],row?.[2],row?.[4],row?.[6],row?.[8]].join(' '));
    if(/(^| )(noel|kerst)( |$)/.test(value)) return 'noel';
    if(/brocante|antiquite|puces|vide grenier|foire a tout|foire aux greniers|foire a la brocante|foire|braderie|bric a brac|rederie|troc et puces|rommelmarkt|vlooienmarkt/.test(value)) return 'brocante';

        '<div class="meta">👥 '+esc(countLabel)+' : <span class="shared-count">'+esc(count)+'</span></div>'+
        '<div class="meta">Tirage au sort : <span class="shared-draw">'+esc(draw)+'</span></div>'+
        '<div class="meta">Humeur du placier : <span class="shared-welcome">'+esc(welcome)+'</span></div>'+
        '<div class="meta">Responsable : <span class="shared-placer">'+esc(placer)+'</span></div>'+
        '<div class="meta">Modèle de clients : <span class="shared-client-model">'+esc(clientModel)+'</span></div>'+
        '<div class="market-actions'+(regAction&&item.special?' has-three':'')+'"><a class="open" data-navigation="1" target="_blank" rel="noopener" href="'+link+'">'+esc(goText)+'</a><a class="details" href="'+details+'">VOIR LA FICHE</a>'+(regAction&&item.special?'<a class="register" '+(regAction.kind==='web'?'target="_blank" rel="noopener" ':'')+'href="'+esc(regAction.href)+'">'+esc(regAction.label)+'</a>':'')+'</div></article>';
    }
    let html='';
    if(weekly.length){ html+='<div class="sectionTitle">'+(showTomorrow?'MARCHÉS DE DEMAIN':'MARCHÉS DU JOUR')+'</div>'+weekly.map(renderCard).join(''); }
    if(special.length){ html+='<div class="sectionTitle">BROCANTES · BRADERIES · FOIRES · NOËL</div>'+special.map(renderCard).join(''); }
    cards.innerHTML=html;
    wireFavorites();
    wirePhotos();
    loadShared(list);
  }

  function wireFavorites(){cards.querySelectorAll('.marketFavoriteStar').forEach(btn=>{if(btn.dataset.wired)return;btn.dataset.wired='1';btn.addEventListener('click',()=>{let on=false;try{on=localStorage.getItem(btn.dataset.favoriteKey)==='1';if(on)localStorage.removeItem(btn.dataset.favoriteKey);else localStorage.setItem(btn.dataset.favoriteKey,'1');on=!on}catch(e){}btn.classList.toggle('active',on);btn.textContent=on?'★':'☆';btn.setAttribute('aria-label',on?'Retirer des favoris':'Ajouter aux favoris');btn.setAttribute('title',on?'Retirer des favoris':'Ajouter aux favoris');});});}
  let photoObserver=null;
  function ensurePhotoObserver(){
    if(photoObserver||!('IntersectionObserver' in window))return photoObserver;
    photoObserver=new IntersectionObserver(entries=>{
      for(const entry of entries){
        if(!entry.isIntersecting)continue;
        const img=entry.target,url=img.dataset.photoSrc;
        if(url&&!img.getAttribute('src'))img.src=url;
        photoObserver.unobserve(img);
      }
    },{root:null,rootMargin:'500px 0px',threshold:0.01});
    return photoObserver;
  }
  function armPhoto(img){
    if(!img||img.dataset.photoArmed==='1')return;
    img.dataset.photoArmed='1';
    const observer=ensurePhotoObserver();
    if(observer)observer.observe(img);else if(img.dataset.photoSrc&&!img.getAttribute('src'))img.src=img.dataset.photoSrc;
  }
  function wirePhotos(){cards.querySelectorAll('.market-photo').forEach(button=>{armPhoto(button.querySelector('img[data-photo-src]'));if(button.dataset.wired)return;button.dataset.wired='1';button.addEventListener('click',()=>{photoLarge.src=button.dataset.src;photoLarge.alt=button.dataset.caption||'Photo du marché';photoModal.classList.add('open');});});}
  function refreshVisibleStatus(){
    const n=cards.querySelectorAll('.card').length,period=showTomorrow?'demain':'aujourd’hui';
    if(!n){status.textContent='Aucun marché du jour ni événement prévu dans les 30 prochains jours à moins de '+LIMIT_KM+' km.';return}
    statusCopy(n);
  }

  function loadShared(list){
    const keys=list.map(item=>{const r=item.row;return[item.country,r[0],r[2],r[3],r[4],r[8]||''].join('|')});
    fetch('/api/market-verifications/batch',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({keys}),cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(result=>{
      cards.querySelectorAll('[data-market-key]').forEach(card=>{const state=result.states&&result.states[card.dataset.marketKey];if(!state)return;const v=state.values||{};if(v.exists&&String(v.exists.value||'').toLowerCase()==='non'){disabledKeys.add(card.dataset.marketKey);try{localStorage.setItem('marketPresenceV174:'+card.dataset.marketKey,'non')}catch(e){}card.remove();return}else if(v.exists&&String(v.exists.value||'').toLowerCase()==='oui'){disabledKeys.delete(card.dataset.marketKey);try{localStorage.removeItem('marketPresenceV174:'+card.dataset.marketKey)}catch(e){}}const done=v.time&&v.count&&v.draw,inProgress=Object.keys(state.leaders||{}).length>0||!!state.photo,dot=card.querySelector('.marketVerificationDot');if(done||inProgress){if(dot){dot.className='marketVerificationDot '+(done?'green':'orange');dot.title=done?'Fiche vérifiée':'Vérification en cours';dot.setAttribute('aria-label',dot.title)}}if(state.location&&Number.isFinite(Number(state.location.latitude))&&Number.isFinite(Number(state.location.longitude))){const go=card.querySelector('[data-navigation]'),destination={lat:Number(state.location.latitude),lon:Number(state.location.longitude),text:Number(state.location.latitude)+','+Number(state.location.longitude)};if(go)go.href=navigationUrl(destination);try{localStorage.setItem('marketLocalLocationV1:'+card.dataset.marketKey,JSON.stringify({latitude:destination.lat,longitude:destination.lon,address:state.location.address||'',pending:false,updatedAt:Date.now()}))}catch(e){}}if(v.time)card.querySelector('.shared-time').textContent=v.time.value;if(v.count){const unit=card.dataset.countKind==='chalets'?' chalets':card.dataset.countKind==='emplacements'?' emplacements':' places';card.querySelector('.shared-count').textContent=v.count.value+unit;}if(v.draw&&card.querySelector('.shared-draw'))card.querySelector('.shared-draw').textContent=v.draw.value;if(v.welcome&&card.querySelector('.shared-welcome'))card.querySelector('.shared-welcome').textContent=v.welcome.value;if(v.placer&&card.querySelector('.shared-placer'))card.querySelector('.shared-placer').textContent=v.placer.value;if(v.clientModel&&card.querySelector('.shared-client-model'))card.querySelector('.shared-client-model').textContent=v.clientModel.value;if(state.photo){const add=card.querySelector('.market-photo-add');if(add)add.remove();if(!card.querySelector('.market-photo')){const title=card.querySelector('.name');title.insertAdjacentHTML('afterend','<button type="button" class="market-photo" data-src="'+esc(state.photo.url)+'" data-caption="Vue générale reconnue et liée au point GPS pris sur le marché"><img loading="lazy" decoding="async" fetchpriority="low" data-photo-src="'+esc(state.photo.url)+'" alt="Vue générale du marché"></button>')}}});wirePhotos();refreshVisibleStatus();
    }).catch(()=>{});
  }

  function closePhoto(){photoModal.classList.remove('open');photoLarge.removeAttribute('src');}
  document.getElementById('photoClose').addEventListener('click',closePhoto);
  photoModal.addEventListener('click',event=>{if(event.target===photoModal)closePhoto();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')closePhoto();});

  async function start(){
    heading.textContent='📍 À MOINS DE '+LIMIT_KM+' KM — MARCHÉS PUIS ÉVÉNEMENTS';
    status.textContent='Calcul depuis '+referenceLabel+' — marchés '+(showTomorrow?'de demain : ':'d’aujourd’hui : ')+selectedDay+' puis événements du mois…';
    try{
      const lat=userLat, lon=userLon;
      if(!Number.isFinite(lat)||!Number.isFinite(lon)){
        status.textContent='Aucune position « Retourner sur la place » enregistrée. Enregistre d’abord ta place depuis l’accueil.';
        return;
      }
      await loadNearbyShards(lat,lon);
      await loadDisabledKeys();
      const todayRows=rowsForToday();
      const nearby=keepWithin80(todayRows,lat,lon);
      render(nearby);
    }catch(e){status.textContent='Impossible de calculer les marchés. Réessaie.';}
  }
  start();
  setInterval(async()=>{
    const changed=await loadDisabledKeys();
    if(changed){start();return;}
    const current=new Date(),tomorrow=current.getHours()>=17,target=new Date(current);
    if(tomorrow)target.setDate(target.getDate()+1);
    const token=target.getFullYear()+'-'+target.getMonth()+'-'+target.getDate()+'-'+(tomorrow?'tomorrow':'today');
    if(token===viewToken)return;
    viewDate=target;showTomorrow=tomorrow;selectedDay=DAYS[viewDate.getDay()];viewToken=token;start();
  },30000);
})();
</script>
