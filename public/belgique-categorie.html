<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>Catégorie Belgique</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:linear-gradient(145deg,#071726,#0a111b 55%,#16110d);color:#fff}.wrap{width:min(760px,94vw);margin:auto;padding:18px 0 34px}.top{display:flex;align-items:center;gap:12px}.back{display:inline-flex;padding:12px 17px;border-radius:14px;background:#19334a;color:#fff;text-decoration:none;font-weight:950;border:2px solid #ffffff44}.hero{margin:14px 0;padding:18px;border-radius:22px;text-align:center;border:3px solid #ffffff33;background:#0b111be8}.hero.noel{border-color:#e54242;background:linear-gradient(145deg,#3b0808,#190808)}.hero.brocante{border-color:#f39b19;background:linear-gradient(145deg,#3c2105,#1a1004)}.hero h1{margin:0;font-size:31px}.hero p{margin:7px 0 0;color:#e7e7e7;font-weight:800}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}.filters select,.filters input{min-height:54px;width:100%;border:2px solid #5faee8;border-radius:13px;background:#07111d;color:#fff;padding:8px;font:850 16px Arial}.count{margin:10px 0;color:#ffd36d;font-weight:950;text-align:center}.cards{display:grid;gap:12px}.card{background:#0c1520;border:2px solid #334b60;border-radius:20px;padding:15px;box-shadow:0 8px 20px #0007}.card.noel{border-color:#df4545}.card.brocante{border-color:#f39b19}.name{font-size:22px;font-weight:1000;line-height:1.1}.meta{margin-top:7px;color:#eef3f7;font-weight:800;line-height:1.35}.type{color:#ffd36d}.go{display:block;margin-top:12px;width:100%;min-height:52px;border:0;border-radius:13px;background:linear-gradient(135deg,#13a966,#0878cb);color:#fff;font:950 17px Arial;cursor:pointer}.empty{text-align:center;padding:24px;color:#ddd;font-weight:850}@media(max-width:520px){.filters{grid-template-columns:1fr}.hero h1{font-size:27px}}
</style></head><body><main class="wrap"><div class="top"><a class="back" href="choix-marches-final.html">← RETOUR</a></div><section id="hero" class="hero"><h1 id="title"></h1><p id="subtitle"></p></section><div class="filters"><select id="province"><option value="">TOUTE LA BELGIQUE</option></select><input id="search" type="search" placeholder="Rechercher une ville ou un nom"></div><div id="count" class="count"></div><section id="cards" class="cards"></section></main>
<script src="market-config-be.js"></script><script>
(function(){
'use strict';
var p=new URLSearchParams(location.search),kind=p.get('kind')==='noel'?'noel':'brocante',title=document.getElementById('title'),hero=document.getElementById('hero'),sub=document.getElementById('subtitle'),province=document.getElementById('province'),search=document.getElementById('search'),cards=document.getElementById('cards'),count=document.getElementById('count'),rows=[];
hero.classList.add(kind);title.textContent=kind==='noel'?'🎄 MARCHÉS DE NOËL':'🧺 BROCANTES & VIDE-GRENIERS';sub.textContent='Chargement sécurisé depuis le serveur…';
var areaNames={};(areas||[]).forEach(function(a){areaNames[String(a[0])]=a[1];var o=document.createElement('option');o.value=a[0];o.textContent=a[1];province.appendChild(o)});
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function creds(){var s=null,c='';try{s=JSON.parse(localStorage.getItem('carplay_shared_subscription')||'null')}catch(e){}if(s&&s.code)c=String(s.code||'');var d=localStorage.getItem('carplay_device_id')||'';if(d.length<16){d='phone-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);localStorage.setItem('carplay_device_id',d)}return{code:c,deviceId:d,deviceType:'phone'}}
function gps(r){var q=encodeURIComponent((r[7]||'')+' '+(r[2]||'')+' '+(r[3]||'')),pref=localStorage.getItem('gps_pref')||'Google Maps';location.href=pref==='Waze'?'https://www.waze.com/ul?q='+q+'&navigate=yes':'https://www.google.com/maps/search/?api=1&query='+q}
function render(){var a=province.value,q=norm(search.value),shown=rows.filter(function(r){if(a&&String(r[0])!==a)return false;return !q||norm([r[2],r[3],r[4],r[6],r[7]].join(' ')).indexOf(q)>=0});count.textContent=shown.length+' résultat'+(shown.length>1?'s':'')+' dans cette catégorie';cards.innerHTML=shown.map(function(r,i){return '<article class="card '+kind+'"><div class="name">'+esc(r[2]||'Sans nom')+'</div><div class="meta">📍 '+esc(r[3]||areaNames[r[0]]||'À vérifier')+' — '+esc(areaNames[r[0]]||'Belgique')+'</div><div class="meta">📅 '+esc(r[4]||'Date à vérifier')+'</div><div class="meta">🕒 '+esc(r[5]||'Horaire à vérifier')+'</div><div class="meta type">'+esc(r[6]||'À vérifier')+'</div><button class="go" type="button" data-i="'+i+'">🧭 Y ALLER</button></article>'}).join('')||'<article class="card empty">Aucun résultat dans cette catégorie.</article>';cards.querySelectorAll('.go').forEach(function(b){b.onclick=function(){gps(shown[Number(this.getAttribute('data-i'))])}})}
province.onchange=render;search.oninput=render;
var a=creds();fetch('/api/markets/category',{method:'POST',headers:{'content-type':'application/json'},cache:'no-store',body:JSON.stringify({kind:kind,code:a.code,deviceId:a.deviceId,deviceType:a.deviceType})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})}).then(function(j){rows=(j.markets||[]).map(function(m){return[m.area,m.kind,m.name,m.city,m.day,m.hours,m.note||m.kind,m.address||'']});sub.textContent=kind==='noel'?'Marchés de Noël protégés sur le serveur.':'Brocantes et vide-greniers protégés sur le serveur.';render()}).catch(function(){sub.textContent='Connexion ou abonnement nécessaire.';cards.innerHTML='<article class="card empty">Marchés protégés indisponibles pour le moment.</article>';count.textContent=''})
})();
</script></body></html>
