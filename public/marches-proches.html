var pos=null;try{var rlat=Number(localStorage.getItem('return_lat')),rlon=Number(localStorage.getItem('return_lon'));if(Number.isFinite(rlat)&&Number.isFinite(rlon)&&localStorage.getItem('return_lat')&&localStorage.getItem('return_lon'))pos={lat:rlat,lon:rlon,source:'retourner-sur-la-place'};else pos=JSON.parse(sessionStorage.getItem('near_market_position')||'null')}catch(e){};

var adjacency={

Promise.all([frenchDepartment(),belgiumProvince()]).then(function(z){var dep=z[0],prov=z[1],jobs=[];if(dep){var ds=adjacency[dep]||[dep];ds.forEach(function(d){jobs.push(query('FR',d))});if(['59','08','55','54'].indexOf(dep)>=0)['hainaut','namur','luxembourg','liege'].forEach(function(p){jobs.push(query('BE',p))})}if(prov){(beAdj[prov]||[prov]).forEach(function(p){jobs.push(query('BE',p))})}if(!jobs.length){status.textContent='Zone non reconnue automatiquement.';return[]}return Promise.all(jobs)}).then(function(groups){var all=[];(groups||[]).forEach(function(g){all=all.concat(g)});var seen={},uniq=[];all.forEach(function(m){var k=[m.country,m.area,m.name,m.city,m.day].join('|');if(!seen[k]){seen[k]=1;uniq.push(m)}});status.textContent=uniq.length?'Calcul des distances…':'Aucun marché enregistré dans la zone aujourd’hui.';var idx=0,found=[];function next(){if(idx>=uniq.length){render(found);return}var m=uniq[idx++],q=[m.address,m.city,m.country==='BE'?'Belgique':'France'].filter(Boolean).join(' ');geocode(q,m.country).then(function(g){if(g){var d=distance(Number(pos.lat),Number(pos.lon),g.lat,g.lon);if(d<=80)found.push({m:m,distance:d})}setTimeout(next,80)})}next()}).catch(function(){status.textContent='Recherche indisponible pour le moment.'});
