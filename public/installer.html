<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><meta name="theme-color" content="#050505"><link rel="manifest" href="/manifest.webmanifest?v=couteau-suisse-v239"><meta name="apple-mobile-web-app-title" content="Couteau Suisse"><meta name="application-name" content="Couteau Suisse"><link rel="apple-touch-icon" sizes="180x180" href="/couteau-suisse-180.png?v=239"><link rel="apple-touch-icon-precomposed" href="/couteau-suisse-180.png?v=239"><title>Télécharger Couteau Suisse</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050505;color:#fff;font-family:Arial,sans-serif;padding:18px;display:flex;justify-content:center}main{width:min(680px,100%);margin:auto;text-align:center}.panel{background:#111;border:2px solid #333;border-radius:28px;padding:24px;box-shadow:0 15px 45px #000}.logo{width:105px;height:105px;border-radius:24px}h1{font-size:clamp(34px,9vw,52px);line-height:1.05;margin:12px 0 8px}.intro{font-size:21px;line-height:1.4;margin:10px 0 22px;color:#eee}.choice{display:block;width:100%;border:0;border-radius:22px;padding:23px 14px;margin:16px 0;font-size:clamp(21px,6vw,28px);font-weight:900;text-decoration:none;cursor:pointer}.android{background:#25c66a;color:#07150b}.iphone{background:#087ee5;color:#fff}.note{font-size:16px;color:#bbb;line-height:1.45;margin-top:20px}#tutorial{display:block}#tutorial h2{font-size:clamp(30px,8vw,48px);line-height:1.08;margin:5px 0 18px}video{display:block;width:100%;max-height:78vh;border:3px solid #ffd400;border-radius:22px;background:#000;box-shadow:0 12px 40px #000}.after{display:none;margin-top:18px}.after.show{display:block}.openApp{display:block;width:100%;padding:22px;border:0;border-radius:20px;background:#ffd400;color:#111;font-size:25px;font-weight:900;text-decoration:none}</style></head>
<body><main><section id="tutorial" class="panel"><h2>REGARDEZ LA VIDÉO DE PRÉSENTATION</h2><video id="iphoneVideo" controls playsinline preload="metadata" poster="/couteau-suisse-512.png"><source src="/tutoriel-comment-installer-iphone.mp4" type="video/mp4"></video><div id="afterVideo" class="after"><p class="intro"><b>Maintenant, refaites les étapes sur le site.</b></p><a class="openApp" href="/index.html">OUVRIR L’APPLICATION</a></div></section></main>
<script>
const video=document.getElementById('iphoneVideo');
const afterVideo=document.getElementById('afterVideo');
let referral='';try{referral=(new URL(location.href)).searchParams.get('ref')||'';if(referral){localStorage.setItem('carplay_pending_referral',referral);document.cookie='carplay_pending_referral='+encodeURIComponent(referral)+'; Max-Age=2592000; Path=/; SameSite=Lax; Secure'}}catch(e){}
const appUrl='/index.html'+(referral?'?ref='+encodeURIComponent(referral):'');
const openLink=document.querySelector('.openApp');if(openLink)openLink.href=appUrl;
function startPresentation(){
  scrollTo(0,0);
  const p=video.play();
  if(p&&p.catch)p.catch(()=>{});
}
video.addEventListener('ended',()=>{
  afterVideo.classList.add('show');
  setTimeout(()=>location.href=appUrl,1200);
});
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',startPresentation);
}else{
  startPresentation();
}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js?v=239-notifications-logo').catch(()=>{});
</script></body></html>
