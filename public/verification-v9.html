<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>Vérifier le marché</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#07101d;color:#fff}.page{width:94%;max-width:820px;margin:0 auto;padding:16px}.topBack{display:inline-flex;align-items:center;justify-content:center;min-width:165px;min-height:58px;margin:2px 0 12px;padding:10px 19px;border:3px solid #ffd36c;border-radius:16px;background:linear-gradient(135deg,#ff9a19,#ff5b00);color:#fff;font-size:21px;font-weight:1000;box-shadow:0 6px 18px #0008}.title{text-align:center;font-size:34px;font-weight:950;color:#f39b19;margin:5px 0 8px}.market{text-align:center;font-size:21px;font-weight:900;margin-bottom:16px}.section{margin:12px 0;padding:14px;border:2px solid #f39b19;border-radius:16px;background:#10233a}.sectionTitle{font-size:20px;font-weight:950;margin-bottom:10px}.section input[type=time],.section input[type=number]{width:100%;height:58px;border:2px solid #62d8ff;border-radius:12px;background:#081727;color:#fff;font-size:24px;padding:8px 12px}.choices{display:flex;flex-wrap:wrap;gap:10px}.choice{display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 13px;border:2px solid #62d8ff;border-radius:12px;background:#081727;font-size:19px;font-weight:900}.choice input{width:27px;height:27px}.buttons{display:flex;gap:12px;margin:18px 0 30px}.buttons button{flex:1;min-height:65px;border:0;border-radius:15px;color:#fff;font-size:20px;font-weight:950}.cancel{background:#555}.save{background:#087ee5}@media(max-width:620px){.title{font-size:28px}.buttons{flex-direction:column}.choice{flex:1 1 45%}}
</style></head><body><main class="page"><button type="button" class="topBack" onclick="goBack()">← RETOUR</button><div class="title">VÉRIFIER CE MARCHÉ</div><div id="market" class="market"></div>
<section class="section"><div class="sectionTitle">HORAIRE</div><input id="time" type="time" step="60"></section>
<section class="section"><div class="sectionTitle">NOMBRE DE COMMERÇANTS</div><input id="count" type="number" min="0" inputmode="numeric" placeholder="Ex. 45"></section>
<section class="section"><div class="sectionTitle">ACCUEIL DU PLACIER</div><div class="choices"><label class="choice"><input name="welcome" type="radio" value="Gentil">Gentil</label><label class="choice"><input name="welcome" type="radio" value="Correct">Correct</label><label class="choice"><input name="welcome" type="radio" value="Diable">Diable</label></div><div class="choices" style="margin-top:10px"><label class="choice"><input id="woman" type="checkbox">Femme</label><label class="choice"><input id="man" type="checkbox">Homme</label><label class="choice"><input id="municipal" type="checkbox">Municipal</label></div></section>
<section class="section"><div class="sectionTitle">MODÈLE DE CLIENTS</div><div class="choices"><label class="choice"><input name="client" type="radio" value="Français">Français</label><label class="choice"><input name="client" type="radio" value="Noir">Noir</label><label class="choice"><input name="client" type="radio" value="Mélangé">Mélangé</label></div></section>
<section class="section"><div class="sectionTitle">TIRAGE AU SORT</div><div class="choices"><label class="choice"><input name="draw" type="radio" value="Oui">Oui</label><label class="choice"><input name="draw" type="radio" value="Non">Non</label></div></section>
<div class="buttons"><button class="cancel" onclick="goBack()">ANNULER</button><button class="save" onclick="saveForm()">ENREGISTRER</button></div></main><script>
function byId(x){return document.getElementById(x)}function queryParam(name){var z=location.search;if(z.charAt(0)==='?')z=z.substring(1);var q=z.split('&'),i,p;for(i=0;i<q.length;i++){p=q[i].split('=');if(decodeURIComponent(p[0]||'')===name)return decodeURIComponent(p.slice(1).join('=')||'')}return''}function payload(){try{return JSON.parse(localStorage.getItem('verify_form_payload')||'null')}catch(e){return null}}function setRadio(name,value){var a=document.getElementsByName(name),i;for(i=0;i<a.length;i++)a[i].checked=a[i].value===value}function radio(name){var a=document.getElementsByName(name),i;for(i=0;i<a.length;i++)if(a[i].checked)return a[i].value;return''}var qk=queryParam('k'),p=null;if(qk){var old={};try{old=JSON.parse(localStorage.getItem(qk)||'{}')}catch(e){}p={key:qk,name:queryParam('n')||'Marché',defaultTime:queryParam('t'),defaultCount:queryParam('c'),values:old}}else{p=payload()};if(!p){alert('Marché introuvable.');history.back()}else{var s=p.values||{},a=s.placer||[];byId('market').innerHTML=p.name||'Marché';byId('time').value=s.time||p.defaultTime||'';byId('count').value=s.count||p.defaultCount||'';setRadio('welcome',s.welcome||'');setRadio('client',s.clientModel||'');setRadio('draw',s.draw||'');byId('woman').checked=a.indexOf('Femme')>=0;byId('man').checked=a.indexOf('Homme')>=0;byId('municipal').checked=a.indexOf('Municipal')>=0}function goBack(){var back=queryParam('back');if(back){location.href=back;return}history.back()}function saveForm(){if(!p)return;var placer=[];if(byId('woman').checked)placer.push('Femme');if(byId('man').checked)placer.push('Homme');if(byId('municipal').checked)placer.push('Municipal');var s={time:byId('time').value,count:byId('count').value,welcome:radio('welcome'),placer:placer,clientModel:radio('client'),draw:radio('draw')};try{localStorage.setItem(p.key,JSON.stringify(s));localStorage.setItem('verify_form_saved','1')}catch(e){}goBack()}
</script></body></html>
