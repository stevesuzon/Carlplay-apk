<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marchés supprimés</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07111d;color:#fff;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:18px}a{color:#6fe0ff}button,select,input{font:inherit;font-weight:700;padding:12px;border-radius:12px;border:2px solid #526578;background:#102438;color:#fff}button{cursor:pointer}.filters,.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.filters input{flex:1;min-width:180px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card,.detail{background:#0c1b2b;border:2px solid #f39b19;border-radius:18px;padding:16px}.card h2{color:#6fe0ff;margin:0 0 10px}.card p{line-height:1.5}.restore{background:#175c35}.delete{background:#922d32}.notice{line-height:1.5;color:#c9d9e8}.overlay{position:fixed;inset:0;background:#000c;z-index:100000;padding:16px;overflow:auto}.overlay[hidden]{display:none}.detail{max-width:800px;margin:auto}.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.compare section{border:1px solid #526578;border-radius:12px;padding:14px;overflow-wrap:anywhere}.compare dt{color:#a5c9df;margin-top:12px}.compare dd{margin:4px 0}.status{font-weight:800;line-height:1.5;min-height:24px}.back{display:inline-block;margin-bottom:12px}.actions button{flex:1;min-width:160px}button:disabled{opacity:.5}</style>

<body><main><a class="back" href="/index.html">← Retour aux réglages</a><h1>Marchés supprimés</h1><p class="notice">Retrouve ici les fiches masquées comme doublons. Ouvre une fiche pour comparer avec le marché conservé, puis remets-la ou confirme son effacement. Les décisions de l’administrateur s’appliquent à l’application.</p>
<div class="filters"><input id="search" type="search" placeholder="Ville, nom ou adresse" aria-label="Rechercher"><select id="day" aria-label="Jour"><option value="">Tous les jours</option><option>lundi</option><option>mardi</option><option>mercredi</option><option>jeudi</option><option>vendredi</option><option>samedi</option><option>dimanche</option></select><select id="state" aria-label="État"><option value="pending">À vérifier</option><option value="deleted">Effacés</option><option value="restored">Remis</option><option value="all">Tous</option></select></div>
<p id="status" class="status" role="status">Chargement des marchés…</p><div id="list" class="cards"></div></main>
<div id="detail" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="detail"><button id="close" type="button">← Retour à la liste</button><h2 id="detailTitle">Vérifier le doublon</h2><div id="comparison" class="compare"></div><p id="actionStatus" class="status" role="status"></p><div class="actions"><button id="restore" class="restore">REMETTRE CE MARCHÉ</button><button id="delete" class="delete">EFFACER CETTE FICHE</button><button id="pending">REVOIR PLUS TARD</button></div></div></div>
</body></html>
