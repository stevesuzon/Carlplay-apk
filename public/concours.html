<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a38">
<title>Jeu concours CarPlay</title>
<meta name="description" content="Participez au jeu concours CarPlay, gagnez des points et montez dans le classement.">
<meta property="og:type" content="website">
<meta property="og:title" content="🏆 Jeu concours CarPlay">
<meta property="og:description" content="Gagnez des points, montez dans le classement et tentez de gagner un abonnement.">
<meta property="og:url" content="https://carplay-telephone.appli-suzon.workers.dev/concours.html">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 0,#123d72,#061a38 44%,#020b19);color:#fff}
body{padding:max(14px,env(safe-area-inset-top)) 14px max(22px,env(safe-area-inset-bottom))}
main{width:min(620px,100%);margin:auto;text-align:center}
.poster{display:block;color:#fff;text-decoration:none;border:3px solid #f6c431;border-radius:28px;padding:18px;background:linear-gradient(180deg,#072957,#04162f);box-shadow:0 18px 50px #000b}
.trophy{font-size:82px;line-height:1;filter:drop-shadow(0 8px 13px #000)}
h1{margin:6px 0 5px;color:#ffd84f;font-size:clamp(34px,10vw,56px);line-height:1;text-shadow:0 4px 10px #000}
.sub{font-size:clamp(19px,5.5vw,28px);font-weight:950;margin:8px 0 18px}
.card{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:12px;margin:11px 0;padding:17px 13px;border:2px solid #36a9ff;border-radius:21px;background:linear-gradient(135deg,#075eb2,#063c82);box-shadow:inset 0 0 22px #3bb8ff33}
.icon{font-size:58px}
.card strong{font-size:clamp(25px,7vw,38px);line-height:1.05;color:#ffd84f}
.prizes{margin:14px 0 5px;padding:18px 12px;border:3px solid #ffd84f;border-radius:22px;background:linear-gradient(135deg,#087536,#03471f)}
.prizes h2{margin:0 0 9px;color:#ffd84f;font-size:35px}
.prizes p{margin:6px 0;font-size:clamp(19px,5vw,26px);font-weight:900}
.cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:74px;margin:16px 0 10px;border:3px solid #fff;border-radius:20px;background:linear-gradient(135deg,#ffbf18,#ff7a00);color:#111;text-decoration:none;font-size:clamp(22px,6vw,31px);font-weight:1000;box-shadow:0 10px 28px #0009}
.hint{margin:8px 0 2px;font-size:15px;font-weight:850;color:#dceaff}
.share{width:100%;min-height:58px;margin-top:12px;border:2px solid #65ccff;border-radius:17px;background:#0a355d;color:#fff;font-size:19px;font-weight:950}
@media(max-width:390px){.poster{padding:13px}.trophy{font-size:65px}.card{grid-template-columns:65px 1fr}.icon{font-size:46px}}
</style>
</head>
<body>
<main>
<div class="poster">
<div class="trophy">🏆</div>
<h1>JEU CONCOURS</h1>
<div class="sub">COMMENT PARTICIPER ?</div>
<div class="card"><span class="icon">📍</span><strong>GAGNEZ<br>DES POINTS</strong></div>
<div class="card"><span class="icon">🥇</span><strong>MONTEZ DANS<br>LE CLASSEMENT</strong></div>
<section class="prizes">
<h2>🎁 À GAGNER</h2>
<p>1er et 2e : abonnement à vie</p>
<p>3e, 4e et 5e : 1 an gratuit</p>
</section>
<a class="cta" href="/installer.html">📲 TÉLÉCHARGER / OUVRIR L’APPLICATION</a>
<div class="hint">Appuyez ici pour regarder la présentation puis ouvrir l’application</div>
<button id="shareContest" class="share" type="button">📤 ENVOYER LE CONCOURS À UN AMI</button>
</div>
</main>
<script>
document.getElementById('shareContest').onclick=async function(){
 const data={title:'Jeu concours CarPlay',text:'🏆 Participez au jeu concours CarPlay',url:location.href};
 try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);this.textContent='LIEN COPIÉ ✓';setTimeout(()=>this.textContent='📤 PARTAGER LE CONCOURS',1600)}}catch(_){}
};
</script>
</body>
</html>
