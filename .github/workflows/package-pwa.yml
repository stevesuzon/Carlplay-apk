name: Package PWA ZIP
on:
  push:
    branches: ["main"]
    paths:
      - 'public/**'
      - 'src/**'
      - '.github/workflows/package-pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-pwa-main
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PWA files
        shell: bash
        run: |
          set -euo pipefail
          test -d public
          test -d src
          test -f public/market-data-fr.js
          test -f public/markets-17-complete-v144.js
          test -f public/markets-35-corrections-v142.js
          test -f public/markets-35-missing-v143.js
          test -f public/markets-44-complete.js
          test -f public/markets-france-national.js
          test -f public/market-weekly-filter.js
          test -f public/marches-final.html
      - name: Create complete PWA ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip
          zip -rq CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip public src
      - name: Upload PWA ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5
          path: CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip
          retention-days: 30
      - name: Put the latest ZIP at the repository root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Plusieurs mises à jour peuvent arriver à quelques secondes d'intervalle.
          # On repart toujours du dernier main, puis on reconstruit le ZIP pour éviter
          # les conflits de rebase sur le fichier binaire ZIP.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -f CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip
            zip -rq CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip public src
            printf 'Cloudflare deploy trigger: %s\nRun: %s\nSource: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.run_id }}" "$(git rev-parse HEAD)" > cloudflare-deploy-trigger.txt
            git add -f CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip cloudflare-deploy-trigger.txt
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Met à jour le ZIP Couteau Suisse [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Impossible de publier le ZIP après 3 tentatives."
          exit 1
