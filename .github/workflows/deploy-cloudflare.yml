name: Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - "src/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-main-v485
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Deploy carplay-telephone to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.toml

      - name: Vérifier le serveur Couteau Suisse après déploiement
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://carplay-telephone.appli-suzon.workers.dev"
          ok=0
          for i in 1 2 3; do
            code="$(curl -sS --max-time 15 -o /tmp/health.json -w '%{http_code}' "$BASE/api/health" || true)"
            echo "HEALTH HTTP=$code"
            cat /tmp/health.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
              ok=1
              break
            fi
            sleep 4
          done

          response="$(curl -sS --max-time 15 -w '\n%{http_code}' -X POST "$BASE/api/status" -H 'content-type: application/json' --data '{}' || true)"
          status_code="$(printf '%s\n' "$response" | tail -n1)"
          status_body="$(printf '%s\n' "$response" | sed '$d')"
          echo "STATUS HTTP=$status_code"
          printf '%s\n' "$status_body"

          test "$ok" = "1"
          test "$status_code" = "400"
          printf '%s' "$status_body" | grep -q 'DONNEES_INVALIDES'

      - name: Vérifier les choix des marchés supprimés
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://carplay-telephone.appli-suzon.workers.dev"
          code="$(curl -sS --max-time 20 -o /tmp/market-decisions.json -w '%{http_code}' "$BASE/api/market-duplicate-decisions")"
          echo "DUPLICATE REVIEW HTTP=$code"
          cat /tmp/market-decisions.json
          test "$code" = "200"
          python -c 'import json; j=json.load(open("/tmp/market-decisions.json")); assert j["ok"] is True and isinstance(j["decisions"],dict)'
          code="$(curl -sS --max-time 20 -X POST -H 'content-type: application/json' --data '{}' -o /tmp/market-review-auth.json -w '%{http_code}' "$BASE/api/market-duplicate-decisions")"
          echo "DUPLICATE REVIEW AUTH HTTP=$code"
          cat /tmp/market-review-auth.json
          test "$code" = "401"
