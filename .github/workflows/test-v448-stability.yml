name: Test V448 Stability

on:
  push:
    branches: ["test-v448-stabilite"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test tools
        run: |
          npm install
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Worker
        shell: bash
        run: |
          set -e
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/v448-wrangler.log 2>&1 &
          echo $! > /tmp/v448-wrangler.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/v448-wrangler.log
          exit 1

      - name: Test mobile UI, buttons and long-press voice
        shell: bash
        run: |
          cat > test-v448.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            viewport:{width:390,height:844},
            isMobile:true,
            hasTouch:true,
            deviceScaleFactor:3,
            userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1',
            serviceWorkers:'block'
          });

          await context.addInitScript(() => {
            try {
              const did='test-device-v448';
              const identity={firstName:'Test',lastName:'Utilisateur',email:'test-v448@example.com'};
              localStorage.setItem('carplay_device_id',did);
              localStorage.setItem('carplay_app_identity_v240',JSON.stringify(identity));
              localStorage.setItem('carplay_identity_email_verified_v304',JSON.stringify({email:identity.email,deviceId:did,verifiedAt:Date.now()}));
              localStorage.setItem('carplay_recovery_email',identity.email);
              sessionStorage.setItem('carplay_install_browser_handoff_v282','1');
              localStorage.setItem('carplay_voice_enabled_v387','1');
              localStorage.setItem('carplay_admin_here','1');
              localStorage.setItem('carplay_notifications_enabled','0');
            } catch (_) {}
            window.__spokenV448 = [];
            class FakeUtterance {
              constructor(text){this.text=String(text||'');this.lang='';this.rate=1;this.pitch=1;this.volume=1;this.voice=null;this.onstart=null;this.onend=null;this.onerror=null;}
            }
            const fakeSynth = {
              paused:false,
              speaking:false,
              pending:false,
              getVoices(){return [{lang:'fr-FR',name:'Français test'}]},
              addEventListener(){},
              cancel(){this.paused=false;this.speaking=false},
              resume(){this.paused=false},
              pause(){this.paused=true},
              speak(u){
                window.__spokenV448.push(String(u.text||''));
                this.speaking=true;
                if(typeof u.onstart==='function')u.onstart();
                setTimeout(()=>{this.speaking=false;if(typeof u.onend==='function')u.onend()},5);
              }
            };
            try { Object.defineProperty(window,'SpeechSynthesisUtterance',{configurable:true,value:FakeUtterance}); } catch (_) { window.SpeechSynthesisUtterance=FakeUtterance; }
            try { Object.defineProperty(window,'speechSynthesis',{configurable:true,value:fakeSynth}); } catch (_) { window.speechSynthesis=fakeSynth; }
          });

          const page = await context.newPage();
          const pageErrors=[];
          const navigations=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('framenavigated',f=>{if(f===page.mainFrame())navigations.push(f.url())});
          await page.route('**/api/contest/status',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,participant:null,entries:[],points:0})}));
          await page.route('**/api/presence',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,count:0})}));

          async function openHome(){
            await page.goto('http://127.0.0.1:8787/?testv448='+Date.now(),{waitUntil:'commit',timeout:10000});
            await page.waitForTimeout(1600);
            const state=await page.evaluate(()=>({path:location.pathname,home:!!document.getElementById('nearby80Button'),voice:!!window.CouteauVoice}));
            assert(state.path==='/'||state.path==='/index.html','Unexpected navigation: '+page.url()+' history='+JSON.stringify(navigations));
            assert(state.home,'Home did not render nearby market button; url='+page.url());
            assert(state.voice,'Voice module did not initialize; url='+page.url());
          }
          function assert(cond,msg){if(!cond)throw new Error(msg)}

          await openHome();

          const duplicateCounts = await page.evaluate(() => ({
            voice:document.querySelectorAll('script[src*="voice-assist-v388.js"]').length,
            subscription:document.querySelectorAll('script[src*="subscription-web.js"]').length,
            contest:document.querySelectorAll('script[src*="contest-v188.js"]').length
          }));
          assert(duplicateCounts.voice===1,'Voice script loaded '+duplicateCounts.voice+' times');
          assert(duplicateCounts.subscription===1,'Subscription script loaded '+duplicateCounts.subscription+' times');
          assert(duplicateCounts.contest===1,'Contest script loaded '+duplicateCounts.contest+' times');

          const required=['#nearby80Button','a.marketHomeFast','#homeAddressBookBtn','#contestHomeButton','#housePhotoButton','.returnPlaceTrafic'];
          for(const sel of required) assert(await page.locator(sel).count()===1,'Missing home control '+sel);

          const layout = await page.evaluate(() => {
            const w=document.getElementById('weatherBubble');
            const c=document.getElementById('contestHomeButton');
            const h=document.getElementById('housePhotoButton');
            if(w){w.style.display='block';w.style.visibility='visible';w.textContent='☁️ 0 % — TRÈS BON JOUR POUR TRAVAILLER — JEUDI';}
            const r=e=>e?e.getBoundingClientRect():null;
            const overlaps=(a,b)=>!!(a&&b&&a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top);
            const wr=r(w),cr=r(c),hr=r(h);
            return {weather:wr,contest:cr,house:hr,weatherContest:overlaps(wr,cr),weatherHouse:overlaps(wr,hr)};
          });
          assert(!layout.weatherContest,'Weather overlaps Contest button');
          assert(!layout.weatherHouse,'Weather overlaps House button');

          const callout = await page.evaluate(() => {
            const el=document.getElementById('homeAddressBookBtn');
            const ev=new Event('contextmenu',{bubbles:true,cancelable:true});
            const dispatched=el.dispatchEvent(ev);
            const cs=getComputedStyle(el);
            return {prevented:ev.defaultPrevented||dispatched===false, userSelect:cs.userSelect, webkitUserSelect:cs.webkitUserSelect};
          });
          assert(callout.prevented,'Long-press context menu not prevented');

          async function hold(selector){
            await page.evaluate(async (selector) => {
              const el=document.querySelector(selector);
              if(!el)throw new Error('Missing '+selector);
              const r=el.getBoundingClientRect();
              const opts={identifier:Date.now()%100000,target:el,clientX:r.left+r.width/2,clientY:r.top+r.height/2,pageX:r.left+r.width/2,pageY:r.top+r.height/2,screenX:0,screenY:0,radiusX:2,radiusY:2,rotationAngle:0,force:1};
              const t=new Touch(opts);
              el.dispatchEvent(new TouchEvent('touchstart',{bubbles:true,cancelable:true,touches:[t],targetTouches:[t],changedTouches:[t]}));
              await new Promise(r=>setTimeout(r,1320));
              el.dispatchEvent(new TouchEvent('touchend',{bubbles:true,cancelable:true,touches:[],targetTouches:[],changedTouches:[t]}));
              await new Promise(r=>setTimeout(r,80));
            },selector);
          }

          const targets=[
            ['#homeAddressBookBtn',/adresse|carnet/i],
            ['a.marketHomeFast',/march/i],
            ['#contestHomeButton',/concours/i],
            ['#housePhotoButton',/maison|mesurer/i],
            ['#nearby80Button',/march/i]
          ];
          for(const [sel,rx] of targets){
            const before=await page.evaluate(()=>window.__spokenV448.length);
            await hold(sel);
            const after=await page.evaluate((before)=>window.__spokenV448.slice(before).filter(x=>String(x).trim()),before);
            assert(after.some(x=>rx.test(x)),'No meaningful voice for '+sel+'; got '+JSON.stringify(after));
          }

          // A normal tap on Marchés must navigate immediately and must not trigger the long-press voice.
          await openHome();
          const spokenBefore=await page.evaluate(()=>window.__spokenV448.length);
          const started=Date.now();
          await page.locator('a.marketHomeFast').tap({timeout:3000});
          await page.waitForURL(/choix-marches-v409\.html/,{timeout:2500});
          const elapsed=Date.now()-started;
          assert(elapsed<2500,'Market navigation too slow: '+elapsed+'ms');
          const spokenAfter=await page.evaluate(()=>window.__spokenV448.length);
          assert(spokenAfter===spokenBefore,'Normal tap triggered voice');

          assert(pageErrors.length===0,'Page JS errors: '+pageErrors.join(' | '));
          console.log(JSON.stringify({ok:true,duplicates:duplicateCounts,layout,marketTapMs:elapsed},null,2));
          await browser.close();
          EOF
          node test-v448.mjs

      - name: Show Worker log on failure
        if: failure()
        run: cat /tmp/v448-wrangler.log || true
