name: Apply CarPlay page 2 update
on:
  push:
    branches: [main]
    paths:
      - 'deploy-page2/READY'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply packaged update
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy-page2/READY || exit 0
          mkdir -p src public
          cat deploy-page2/src_index_js_gz_*.b64 | base64 -d | gzip -dc > src/index.js
          cat deploy-page2/subscription_web_js_gz_*.b64 | base64 -d | gzip -dc > public/subscription-web.js
          cat deploy-page2/admin_html_gz_*.b64 | base64 -d | gzip -dc > public/admin.html
          cat deploy-page2/verification_v9_html_gz_*.b64 | base64 -d | gzip -dc > public/verification-v9.html
          cat deploy-page2/admin_approval_overlay_js_*.b64 | base64 -d > public/admin-approval-overlay.js
          cat deploy-page2/modification_demande_html_*.b64 | base64 -d > public/modification-demande.html
          cat deploy-page2/sw_js_*.b64 | base64 -d > public/sw.js
          cat deploy-page2/app_version_json_*.b64 | base64 -d > public/app-version.json
          cat deploy-page2/schema_sql_*.b64 | base64 -d > schema.sql
          node --check src/index.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf deploy-page2
          rm -f .github/workflows/apply-page2.yml
          git add -A
          git commit -m 'Deploy demande page 2 et vérification e-mail'
          git push origin HEAD:main
