name: Test V453 Voice Fallback

on:
  push:
    branches: ["test-v453-voice-fallback"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-v453-voice-fallback
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test tools
        run: |
          npm install
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Syntax
        run: node --check public/voice-assist-v388.js

      - name: Start local Worker
        shell: bash
        run: |
          set -e
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/v453-wrangler.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:8787/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v453-wrangler.log
          exit 1

      - name: Test iPhone fallback button
        shell: bash
        run: |
          cat > test-v453.mjs <<'EOF'
          import { webkit } from 'playwright';
          function assert(x,m){if(!x)throw new Error(m)}
          const browser=await webkit.launch({headless:true});
          const context=await browser.newContext({
            viewport:{width:390,height:844},
            isMobile:true,
            hasTouch:true,
            deviceScaleFactor:3,
            userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1',
            serviceWorkers:'block'
          });

          await context.addInitScript(()=>{
            localStorage.setItem('carplay_voice_enabled_v387','1');
            window.__spokenV453=[];
            window.__voiceAttemptV453=0;
            class U{
              constructor(t){this.text=String(t||'');this.lang='';this.rate=1;this.pitch=1;this.volume=1;this.voice=null;this.onstart=null;this.onend=null;this.onerror=null;}
            }
            const synth={
              getVoices(){return[{lang:'fr-FR',name:'Français test'}]},addEventListener(){},cancel(){},resume(){},pause(){},
              speak(u){
                const txt=String(u.text||'');
                if(!txt.trim()){if(u.onstart)u.onstart();if(u.onend)u.onend();return;}
                window.__voiceAttemptV453++;
                if(window.__voiceAttemptV453===1){
                  // Simule iOS qui accepte l'appel mais ne démarre pas la voix.
                  return;
                }
                window.__spokenV453.push(txt);
                if(u.onstart)u.onstart();
                setTimeout(()=>u.onend&&u.onend(),5);
              }
            };
            Object.defineProperty(window,'SpeechSynthesisUtterance',{configurable:true,value:U});
            Object.defineProperty(window,'speechSynthesis',{configurable:true,value:synth});
          });

          const page=await context.newPage();
          await page.route('**/*',async route=>{
            const req=route.request(),u=req.url(),type=req.resourceType();
            if(type==='script'){
              if(u.includes('voice-assist-v388.js'))return route.continue();
              return route.fulfill({status:200,contentType:'application/javascript',body:''});
            }
            if(type==='image'||type==='font'||type==='media')return route.abort();
            return route.continue();
          });

          await page.goto('http://127.0.0.1:8787/?v453='+Date.now(),{waitUntil:'domcontentloaded',timeout:12000});
          await page.waitForFunction(()=>!!window.CouteauVoice,{timeout:6000});

          await page.evaluate(()=>{
            const b=document.createElement('button');
            b.id='voiceTestV453';
            b.textContent='Marchés';
            b.setAttribute('aria-label','Marchés');
            window.__activatedV453=0;
            b.onclick=()=>window.__activatedV453++;
            document.body.appendChild(b);
          });

          await page.evaluate(async()=>{
            const el=document.getElementById('voiceTestV453'),r=el.getBoundingClientRect();
            const p={clientX:r.left+r.width/2,clientY:r.top+r.height/2,pageX:r.left+r.width/2,pageY:r.top+r.height/2};
            const s=new Event('touchstart',{bubbles:true,cancelable:true});
            Object.defineProperty(s,'touches',{value:[p]});
            Object.defineProperty(s,'targetTouches',{value:[p]});
            Object.defineProperty(s,'changedTouches',{value:[p]});
            el.dispatchEvent(s);
            await new Promise(ok=>setTimeout(ok,1320));
            const e=new Event('touchend',{bubbles:true,cancelable:true});
            Object.defineProperty(e,'touches',{value:[]});
            Object.defineProperty(e,'targetTouches',{value:[]});
            Object.defineProperty(e,'changedTouches',{value:[p]});
            el.dispatchEvent(e);
            await new Promise(ok=>setTimeout(ok,950));
          });

          const fallback=page.locator('#voiceTapFallbackV400');
          assert(await fallback.count()===1,'Fallback button did not appear');
          assert(/TOUCHER POUR ÉCOUTER/i.test(await fallback.innerText()),'Wrong fallback label');
          assert(await page.evaluate(()=>window.__activatedV453)===0,'Long press activated original button');

          await fallback.tap();
          await page.waitForTimeout(120);
          const spoken=await page.evaluate(()=>window.__spokenV453);
          assert(spoken.some(x=>/marchés/i.test(x)),'Fallback did not trigger speech: '+JSON.stringify(spoken));
          assert(await page.locator('#voiceTapFallbackV400').count()===0,'Fallback button did not close');

          console.log(JSON.stringify({ok:true,spoken},null,2));
          await browser.close();
          EOF
          node test-v453.mjs

      - name: Show Worker log on failure
        if: failure()
        run: cat /tmp/v453-wrangler.log || true
