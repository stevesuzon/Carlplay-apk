name: Build APK
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "LATEST-APK.apk"
      - "CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore market sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat assets-src/markets-zip/marches.* | base64 -d | gunzip > /tmp/france-source.html
          cat assets-src/markets-zip/belgique.* | base64 -d | gunzip > /tmp/belgique-source.html
          cat assets-src/markets-zip/carplay.* | base64 -d | gunzip > app/src/main/assets/carplay-marches.html
      - name: Restore images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          A=Path('app/src/main/assets')
          for src,dst in [('assets-src/master.b64','master-front.jpg'),('assets-src/tabbert.b64','tabbert.jpg'),('assets-src/chineur-photo.b64','chineur.webp'),('assets-src/route66-bg.b64','route66-bg.jpg')]:
              raw=Path(src).read_text(errors='ignore'); clean=''.join(re.findall(r'[A-Za-z0-9+/]',raw)); clean+='='*((4-len(clean)%4)%4); (A/dst).write_bytes(base64.b64decode(clean,validate=False))
          p=A/'index.html'; s=p.read_text(errors='ignore').replace('master-front.png','master-front.jpg').replace('tabbert.png','tabbert.jpg').replace('chineur.svg','chineur.webp'); p.write_text(s)
          PY
      - name: Generate clean market pages
        run: python3 assets-src/generate_markets.py
      - name: Add autoradio download and USB guide
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html'); s=p.read_text(encoding='utf-8')
          marker='<div class="settingRow"><button class="settingHead" onclick="toggleSection(\'updateMenu\',this)">'
          block='''<div class="settingRow"><button class="settingHead" onclick="toggleSection('radioMenu',this)"><span>📻 Télécharger pour autoradio</span><span>⌄</span></button><div class="settingBody" id="radioMenu"><button onclick="openExternal('https://raw.githubusercontent.com/stevesuzon/Carlplay-apk/main/LATEST-APK.apk')">📥 TÉLÉCHARGER POUR AUTORADIO</button><button onclick="document.getElementById('usbGuide').style.display=document.getElementById('usbGuide').style.display==='block'?'none':'block'">🔑 COMMENT INSTALLER AVEC UNE CLÉ USB</button><div id="usbGuide" class="settingNote" style="display:none;font-size:18px;line-height:1.65;background:#111b2b;border-radius:14px;padding:16px;margin-top:8px"><b>1️⃣ Télécharge l’APK.</b><br><b>2️⃣ Mets le fichier APK sur une clé USB.</b><br><b>3️⃣ Branche la clé USB sur l’autoradio Android.</b><br><b>4️⃣ Ouvre la clé USB dans le gestionnaire de fichiers.</b><br><b>5️⃣ Appuie sur CarPlay-V5.apk.</b><br><b>6️⃣ Appuie sur INSTALLER.</b><br><b>7️⃣ Ouvre CarPlay.</b><br><br>Si Android le demande, autorise l’installation d’applications provenant de cette source.</div></div></div>'''
          if 'id="radioMenu"' not in s and marker in s: s=s.replace(marker,block+marker)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle assembleDebug
      - name: Prepare V5 Cloudflare package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/carplay-v5 && mkdir -p /tmp/carplay-v5
          cp -a app/src/main/assets/. /tmp/carplay-v5/
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/carplay-v5/CarPlay-V5.apk
          cd /tmp/carplay-v5
          zip -r "$GITHUB_WORKSPACE/CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip" .
      - name: Upload V5 package
        uses: actions/upload-artifact@v4
        with:
          name: CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5
          path: CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip
          retention-days: 30
      - name: Publish latest APK and replace V5 ZIP in GitHub
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/LATEST-APK.apk
          cp CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip /tmp/CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main && git reset --hard origin/main
          cp /tmp/LATEST-APK.apk LATEST-APK.apk
          cp /tmp/CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip
          git add LATEST-APK.apk CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip
          if ! git diff --cached --quiet; then git commit -m "Remplace V5 Cloudflare et APK"; git push origin HEAD:main; fi
