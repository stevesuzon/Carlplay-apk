name: Build APK TEST Licence Expiree
on:
  push:
    branches: ["test-licence-expiree"]
    paths-ignore:
      - "LATEST-APK-EXPIREE.apk"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore market sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat assets-src/markets-zip/marches.* | base64 -d | gunzip > /tmp/france-source.html
          cat assets-src/markets-zip/belgique.* | base64 -d | gunzip > /tmp/belgique-source.html
          cat assets-src/markets-zip/carplay.* | base64 -d | gunzip > app/src/main/assets/carplay-marches.html
      - name: Restore images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          A=Path('app/src/main/assets'); A.mkdir(parents=True,exist_ok=True)
          for src,dst in [('assets-src/master.b64','master-front.jpg'),('assets-src/tabbert.b64','tabbert.jpg'),('assets-src/chineur-photo.b64','chineur.webp'),('assets-src/route66-bg.b64','route66-bg.jpg')]:
              raw=Path(src).read_text(errors='ignore'); clean=''.join(re.findall(r'[A-Za-z0-9+/]',raw)); clean+='='*((4-len(clean)%4)%4); (A/dst).write_bytes(base64.b64decode(clean,validate=False))
          p=A/'index.html'; s=p.read_text(errors='ignore'); s=s.replace('master-front.png','master-front.jpg').replace('tabbert.png','tabbert.jpg').replace('chineur.svg','chineur.webp'); p.write_text(s)
          PY
      - name: Keep Master complete and detour Tabbert only
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image,ImageFilter
          from pathlib import Path
          from collections import deque
          A=Path('app/src/main/assets')
          im=Image.open(A/'tabbert.jpg').convert('RGBA'); w,h=im.size; p=im.load(); b=max(2,min(w,h)//45)
          samples=[]
          for yy in list(range(b))+list(range(h-b,h)):
            for xx in list(range(b))+list(range(w-b,w)):
              if xx<b or xx>=w-b or yy<b or yy>=h-b: samples.append(p[xx,yy][:3])
          ar=sum(x[0] for x in samples)/len(samples); ag=sum(x[1] for x in samples)/len(samples); ab=sum(x[2] for x in samples)/len(samples)
          def near(x,y):
            r,g,bb,a=p[x,y]; return (r-ar)**2+(g-ag)**2+(bb-ab)**2<=900
          bg=bytearray(w*h); q=deque()
          def add(x,y):
            i=y*w+x
            if not bg[i] and near(x,y): bg[i]=1; q.append((x,y))
          for x in range(w): add(x,0); add(x,h-1)
          for y in range(h): add(0,y); add(w-1,y)
          while q:
            x,y=q.popleft()
            if x:add(x-1,y)
            if x+1<w:add(x+1,y)
            if y:add(x,y-1)
            if y+1<h:add(x,y+1)
          mask=Image.new('L',(w,h),255); mp=mask.load()
          for y in range(h):
            for x in range(w):
              if bg[y*w+x]: mp[x,y]=0
          mask=mask.filter(ImageFilter.MaxFilter(3)).filter(ImageFilter.GaussianBlur(.55)); im.putalpha(mask); im.save(A/'tabbert.png','PNG',optimize=True)
          html=A/'index.html'; s=html.read_text(errors='ignore').replace('tabbert.jpg','tabbert.png')
          s=s.replace('.vehicleVisual img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 11px #0009)}','.vehicleVisual img{width:100%;height:100%;object-fit:cover;border-radius:22px;filter:drop-shadow(0 10px 11px #0009)}')
          html.write_text(s)
          PY
      - name: Generate clean market pages
        run: python3 assets-src/generate_markets.py
      - name: Improve market card design
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('marches.html','belgique-marches.html'):
            p=Path('app/src/main/assets')/name; s=p.read_text(encoding='utf-8')
            s=s.replace('.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}', '.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:stretch}')
            s=s.replace('.card{background:rgba(8,19,38,.94);padding:18px;border:1px solid #ffffff35;border-radius:20px}', '.card{background:rgba(8,19,38,.96);padding:20px;border:4px solid #f39b19;border-radius:22px;min-height:440px;height:100%;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.65)}')
            s=s.replace('.name{font-size:26px;font-weight:950}', '.name{font-size:38px;font-weight:950;line-height:1.10;text-shadow:0 2px 6px #000;margin-bottom:6px}')
            p.write_text(s,encoding='utf-8')
          PY
      - name: Final lock screen keypad
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/license-ui.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="11" autocomplete="off" placeholder="00.00.00.00" style="width:100%;height:58px','type="text" inputmode="none" readonly maxlength="11" autocomplete="off" placeholder="00.00.00.00" style="width:100%;height:58px',1)
          marker='<button id="hardUnlockBtn"'
          keypad='<div id="hardKeypad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px">'+''.join('<button type="button" data-k="%s" style="height:48px;border:1px solid #667080;border-radius:10px;background:#15191f;color:#fff;font-size:24px;font-weight:950">%s</button>'%(x,x) for x in ['1','2','3','4','5','6','7','8','9'])+'<button type="button" data-k="C" style="height:48px;border:1px solid #667080;border-radius:10px;background:#15191f;color:#fff;font-size:20px;font-weight:950">EFF</button><button type="button" data-k="0" style="height:48px;border:1px solid #667080;border-radius:10px;background:#15191f;color:#fff;font-size:24px;font-weight:950">0</button><button type="button" data-k="B" style="height:48px;border:1px solid #667080;border-radius:10px;background:#15191f;color:#fff;font-size:24px;font-weight:950">⌫</button></div>'
          s=s.replace(marker,keypad+marker,1)
          wire="if(inp){old.querySelectorAll('#hardKeypad button').forEach(function(k){k.onclick=function(){var raw=(inp.value||'').replace(/\\D/g,'');var v=this.getAttribute('data-k');if(v==='C')raw='';else if(v==='B')raw=raw.slice(0,-1);else if(raw.length<8)raw+=v;inp.value=[raw.slice(0,2),raw.slice(2,4),raw.slice(4,6),raw.slice(6,8)].filter(Boolean).join('.')}});}"
          s=s.replace("if(inp)inp.addEventListener('input',function(){fmtInput(this)});",wire,1)
          s=s.replace("setInterval(lockOverlay,1000);","setInterval(function(){if(!document.getElementById('hardLock'))lockOverlay()},1000);")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Clock day and network position
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/stevesuzon/carlplay/MainActivity.java'); s=p.read_text()
          s=s.replace('void updateClock(){if(clock!=null)clock.setText(new SimpleDateFormat("HH:mm",Locale.FRANCE).format(new Date()));}','void updateClock(){if(clock!=null){Date d=new Date();String heure=new SimpleDateFormat("HH:mm",Locale.FRANCE).format(d);String jour=new SimpleDateFormat("EEEE",Locale.FRANCE).format(d).toUpperCase(Locale.FRANCE);clock.setText(heure+"\\n"+jour);}}')
          s=s.replace('clock.setTextSize(34);','clock.setTextSize(25);')
          s=s.replace('new FrameLayout.LayoutParams(-2,58*d,Gravity.TOP|Gravity.CENTER_HORIZONTAL)','new FrameLayout.LayoutParams(-2,72*d,Gravity.TOP|Gravity.CENTER_HORIZONTAL)')
          s=s.replace('new FrameLayout.LayoutParams(-2,58*d,Gravity.TOP|Gravity.RIGHT);np.setMargins(0,8*d,22*d,0);root.addView(network,np);','new FrameLayout.LayoutParams(-2,58*d,Gravity.TOP|Gravity.CENTER_HORIZONTAL);np.setMargins(0,14*d,0,0);network.setTranslationX(190*d);root.addView(network,np);')
          p.write_text(s)
          PY
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK TEST expiree
        run: gradle assembleDebug
      - name: Upload APK TEST expiree
        uses: actions/upload-artifact@v4
        with:
          name: CarPlay-Travaille-TEST-LICENCE-EXPIREE
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish APK expiree direct
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/LATEST-APK-EXPIREE.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin test-licence-expiree
          git reset --hard origin/test-licence-expiree
          cp /tmp/LATEST-APK-EXPIREE.apk LATEST-APK-EXPIREE.apk
          git add LATEST-APK-EXPIREE.apk
          if ! git diff --cached --quiet; then git commit -m "Publie APK licence expirée [skip ci]"; git push origin HEAD:test-licence-expiree; fi
