name: Build APK
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "LATEST-APK.apk"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore markets from saved ZIP
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat assets-src/markets-zip/marches.* | base64 -d | gunzip > app/src/main/assets/marches.html
          cat assets-src/markets-zip/belgique.* | base64 -d | gunzip > app/src/main/assets/belgique-marches.html
          cat assets-src/markets-zip/carplay.* | base64 -d | gunzip > app/src/main/assets/carplay-marches.html
          test -s app/src/main/assets/marches.html
          test -s app/src/main/assets/belgique-marches.html
          test -s app/src/main/assets/carplay-marches.html
          grep -q '<html' app/src/main/assets/marches.html
          grep -q '<html' app/src/main/assets/belgique-marches.html
          echo "France: $(wc -c < app/src/main/assets/marches.html) bytes"
          echo "Belgique: $(wc -c < app/src/main/assets/belgique-marches.html) bytes"
          echo "CarPlay: $(wc -c < app/src/main/assets/carplay-marches.html) bytes"

      - name: Install vehicle images
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          tr -cd 'A-Za-z0-9+/=' < assets-src/master.b64 | base64 -d > app/src/main/assets/master-front.jpg
          tr -cd 'A-Za-z0-9+/=' < assets-src/tabbert.b64 | base64 -d > app/src/main/assets/tabbert.jpg
          test -s app/src/main/assets/master-front.jpg
          test -s app/src/main/assets/tabbert.jpg
          grep -rl --include='*.html' 'master-front.png' app/src/main/assets | xargs -r sed -i 's/master-front\.png/master-front.jpg/g'
          grep -rl --include='*.html' 'tabbert.png' app/src/main/assets | xargs -r sed -i 's/tabbert\.png/tabbert.jpg/g'

      - name: Prepare market UI for autoradio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/marches.html')
          s=p.read_text(encoding='utf-8')
          inject=r'''
          <style id="apk-market-ui">
          #apkDepartmentWrap{position:sticky;top:0;z-index:99990;width:min(900px,98%);margin:0 auto 14px;padding:10px 8px 12px;background:linear-gradient(180deg,rgba(20,28,43,.98),rgba(20,28,43,.92));backdrop-filter:blur(8px)}
          #apkDepartmentButton{width:100%;min-height:78px;border:3px solid #65d2ff;border-radius:24px;background:linear-gradient(135deg,#05aaff,#1934d7);color:#fff;font-size:28px;font-weight:950;letter-spacing:.3px;box-shadow:0 8px 24px #0008;text-align:left;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
          #apkDepartmentPanel{display:none;position:fixed;left:2vw;right:2vw;top:92px;bottom:0;z-index:100000;background:linear-gradient(180deg,#152f42,#211923);border:3px solid #65d2ff;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px #000b;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
          #apkDepartmentPanel.open{display:block}
          .apkDepRow{width:100%;min-height:64px;margin:6px 0;border:1px solid #ffffff35;border-radius:18px;background:linear-gradient(135deg,#263650,#1b2638);color:#fff;font-size:22px;font-weight:900;text-align:left;padding:12px 18px;box-shadow:0 4px 10px #0005}
          .apkDepRow:active{transform:scale(.99);background:linear-gradient(135deg,#ff9a19,#ff3d00)}
          #apkDepartmentClose{position:sticky;top:0;width:100%;min-height:58px;margin-bottom:8px;border:0;border-radius:16px;background:#d34343;color:#fff;font-size:20px;font-weight:900;z-index:2}
          #deps .search,#deps #list,#deps #empty{display:none!important}
          </style>
          <script id="apk-market-ui-script">
          (function(){
            var deps='01|Ain,02|Aisne,03|Allier,04|Alpes-de-Haute-Provence,05|Hautes-Alpes,06|Alpes-Maritimes,07|Ardèche,08|Ardennes,09|Ariège,10|Aube,11|Aude,12|Aveyron,13|Bouches-du-Rhône,14|Calvados,15|Cantal,16|Charente,17|Charente-Maritime,18|Cher,19|Corrèze,2A|Corse-du-Sud,2B|Haute-Corse,21|Côte-d’Or,22|Côtes-d’Armor,23|Creuse,24|Dordogne,25|Doubs,26|Drôme,27|Eure,28|Eure-et-Loir,29|Finistère,30|Gard,31|Haute-Garonne,32|Gers,33|Gironde,34|Hérault,35|Ille-et-Vilaine,36|Indre,37|Indre-et-Loire,38|Isère,39|Jura,40|Landes,41|Loir-et-Cher,42|Loire,43|Haute-Loire,44|Loire-Atlantique,45|Loiret,46|Lot,47|Lot-et-Garonne,48|Lozère,49|Maine-et-Loire,50|Manche,51|Marne,52|Haute-Marne,53|Mayenne,54|Meurthe-et-Moselle,55|Meuse,56|Morbihan,57|Moselle,58|Nièvre,59|Nord,60|Oise,61|Orne,62|Pas-de-Calais,63|Puy-de-Dôme,64|Pyrénées-Atlantiques,65|Hautes-Pyrénées,66|Pyrénées-Orientales,67|Bas-Rhin,68|Haut-Rhin,69|Rhône,70|Haute-Saône,71|Saône-et-Loire,72|Sarthe,73|Savoie,74|Haute-Savoie,75|Paris,76|Seine-Maritime,77|Seine-et-Marne,78|Yvelines,79|Deux-Sèvres,80|Somme,81|Tarn,82|Tarn-et-Garonne,83|Var,84|Vaucluse,85|Vendée,86|Vienne,87|Haute-Vienne,88|Vosges,89|Yonne,90|Territoire de Belfort,91|Essonne,92|Hauts-de-Seine,93|Seine-Saint-Denis,94|Val-de-Marne,95|Val-d’Oise'.split(',').map(x=>x.split('|'));
            function hideOldTop(){
              document.querySelectorAll('body *').forEach(function(el){
                var t=(el.innerText||'').trim().toLowerCase();
                if(!t||t.length>120)return;
                var r=el.getBoundingClientRect();
                if(r.top>650)return;
                if((t.includes('vérification')&&t.includes('20'))||(t.includes('verification')&&t.includes('20'))||(t.includes('envoy')&&t.includes('fichier'))||t==='pk') el.style.display='none';
              });
            }
            function scrollToResults(){
              setTimeout(function(){
                var candidates=['#days','.days','#jours','.jours','#markets','.markets','#marketList','.market-list','#list'];
                for(var i=0;i<candidates.length;i++){
                  var e=document.querySelector(candidates[i]);
                  if(e&&e.offsetParent!==null){e.scrollIntoView({behavior:'smooth',block:'start'});return;}
                }
                window.scrollTo({top:Math.min(document.body.scrollHeight,window.innerHeight*0.75),behavior:'smooth'});
              },250);
            }
            function choose(code,name){
              var panel=document.getElementById('apkDepartmentPanel'),btn=document.getElementById('apkDepartmentButton');
              panel.classList.remove('open');document.body.style.overflow='';
              btn.firstChild.nodeValue=code+' — '+name+'  ';
              try{if(typeof selectDep==='function')selectDep(code);else if(window.selectDep)window.selectDep(code)}catch(e){}
              scrollToResults();
            }
            function install(){
              if(document.getElementById('apkDepartmentWrap'))return true;
              var host=document.getElementById('deps')||document.body;
              if(!host)return false;
              var wrap=document.createElement('div');wrap.id='apkDepartmentWrap';
              var btn=document.createElement('button');btn.id='apkDepartmentButton';btn.type='button';btn.appendChild(document.createTextNode('CHOISIR SON DÉPARTEMENT  '));var arrow=document.createElement('span');arrow.textContent='▼';btn.appendChild(arrow);
              var panel=document.createElement('div');panel.id='apkDepartmentPanel';
              var close=document.createElement('button');close.id='apkDepartmentClose';close.type='button';close.textContent='FERMER';close.onclick=function(){panel.classList.remove('open');document.body.style.overflow=''};panel.appendChild(close);
              deps.forEach(function(d){var b=document.createElement('button');b.className='apkDepRow';b.type='button';b.textContent=d[0]+' — '+d[1];b.onclick=function(){choose(d[0],d[1])};panel.appendChild(b)});
              btn.onclick=function(){panel.classList.add('open');document.body.style.overflow='hidden'};
              wrap.appendChild(btn);wrap.appendChild(panel);
              if(host===document.body)host.insertBefore(wrap,host.firstChild);else host.insertBefore(wrap,host.firstChild);
              hideOldTop();
              return true;
            }
            var n=0;function boot(){n++;if(!install()&&n<50)setTimeout(boot,120)}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
            setTimeout(hideOldTop,600);
          })();
          </script>
          '''
          s=s.replace('</body>',inject+'\n</body>',1) if '</body>' in s else s+inject
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify market UI
        run: |
          grep -q 'apkDepartmentButton' app/src/main/assets/marches.html
          grep -q 'CHOISIR SON DÉPARTEMENT' app/src/main/assets/marches.html
          grep -q 'Ille-et-Vilaine' app/src/main/assets/marches.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carlplay-APK-Tous-Marches
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest APK in repository
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/LATEST-APK.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/LATEST-APK.apk LATEST-APK.apk
          git add LATEST-APK.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "APK compilé avec menu départements autoradio [skip ci]"
          git push origin HEAD:main
