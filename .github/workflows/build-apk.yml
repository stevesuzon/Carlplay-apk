name: Build APK
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "LATEST-APK.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore market sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat assets-src/markets-zip/marches.* | base64 -d | gunzip > /tmp/france-source.html
          cat assets-src/markets-zip/belgique.* | base64 -d | gunzip > /tmp/belgique-source.html
          cat assets-src/markets-zip/carplay.* | base64 -d | gunzip > app/src/main/assets/carplay-marches.html
          test -s /tmp/france-source.html
          test -s /tmp/belgique-source.html

      - name: Restore images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          A=Path('app/src/main/assets')
          A.mkdir(parents=True,exist_ok=True)
          pairs=[('assets-src/master.b64','master-front.jpg'),('assets-src/tabbert.b64','tabbert.jpg'),('assets-src/chineur-photo.b64','chineur.webp'),('assets-src/route66-bg.b64','route66-bg.jpg')]
          for src,dst in pairs:
              raw=Path(src).read_text(errors='ignore')
              clean=''.join(re.findall(r'[A-Za-z0-9+/]',raw))
              clean+='='*((4-len(clean)%4)%4)
              (A/dst).write_bytes(base64.b64decode(clean,validate=False))
          p=A/'index.html'
          if p.exists():
              s=p.read_text(errors='ignore')
              s=s.replace('master-front.png','master-front.jpg').replace('tabbert.png','tabbert.jpg').replace('chineur.svg','chineur.webp')
              p.write_text(s)
          PY

      - name: Generate clean market pages
        run: python3 assets-src/generate_markets.py

      - name: Enlarge market names only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('marches.html','belgique-marches.html'):
              p=Path('app/src/main/assets')/name
              s=p.read_text(encoding='utf-8')
              s=s.replace('.name{font-size:26px;font-weight:950}', '.name{font-size:34px;font-weight:950;line-height:1.12}')
              p.write_text(s,encoding='utf-8')
          PY

      - name: Verify clean pages
        shell: bash
        run: |
          set -euo pipefail
          grep -q "MARCHÉS DE FRANCE" app/src/main/assets/marches.html
          grep -q "CHOISIR SON DÉPARTEMENT" app/src/main/assets/marches.html
          grep -q "MARCHÉS DE BELGIQUE" app/src/main/assets/belgique-marches.html
          if grep -qi "article de travail" app/src/main/assets/marches.html; then exit 1; fi
          if grep -qi "mes vérifications" app/src/main/assets/marches.html; then exit 1; fi
          if grep -qi "ce site ne vous convient pas" app/src/main/assets/marches.html; then exit 1; fi

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Carlplay-APK-Tous-Marches
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/LATEST-APK.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/LATEST-APK.apk LATEST-APK.apk
          git add LATEST-APK.apk
          if ! git diff --cached --quiet; then
            git commit -m "APK pages marchés propres France Belgique [skip ci]"
            git push origin HEAD:main
          fi
