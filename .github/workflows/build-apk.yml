name: Build APK
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "LATEST-APK.apk"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore markets from saved ZIP
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat assets-src/markets-zip/marches.* | base64 -d | gunzip > app/src/main/assets/marches.html
          cat assets-src/markets-zip/belgique.* | base64 -d | gunzip > app/src/main/assets/belgique-marches.html
          cat assets-src/markets-zip/carplay.* | base64 -d | gunzip > app/src/main/assets/carplay-marches.html
          test -s app/src/main/assets/marches.html
          test -s app/src/main/assets/belgique-marches.html
          test -s app/src/main/assets/carplay-marches.html
          grep -q '<html' app/src/main/assets/marches.html
          grep -q '<html' app/src/main/assets/belgique-marches.html
          echo "France: $(wc -c < app/src/main/assets/marches.html) bytes"
          echo "Belgique: $(wc -c < app/src/main/assets/belgique-marches.html) bytes"
          echo "CarPlay: $(wc -c < app/src/main/assets/carplay-marches.html) bytes"

      - name: Install vehicle images
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          tr -cd 'A-Za-z0-9+/=' < assets-src/master.b64 | base64 -d > app/src/main/assets/master-front.jpg
          tr -cd 'A-Za-z0-9+/=' < assets-src/tabbert.b64 | base64 -d > app/src/main/assets/tabbert.jpg
          test -s app/src/main/assets/master-front.jpg
          test -s app/src/main/assets/tabbert.jpg
          grep -rl --include='*.html' 'master-front.png' app/src/main/assets | xargs -r sed -i 's/master-front\.png/master-front.jpg/g'
          grep -rl --include='*.html' 'tabbert.png' app/src/main/assets | xargs -r sed -i 's/tabbert\.png/tabbert.jpg/g'

      - name: Add permanent department dropdown
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/marches.html')
          s = p.read_text(encoding='utf-8')
          inject = r'''
          <style id="apk-department-style">
          #deps .search,#deps #list,#deps #empty{display:none!important}
          #apkDepartmentWrap{width:min(760px,96%);margin:18px auto 26px;position:relative;z-index:9999}
          #apkDepartmentLabel{display:block;margin:0 0 8px;font-size:18px;font-weight:900;color:#f4c542}
          #apkDepartmentSelect{width:100%;display:block;padding:20px 52px 20px 20px;border:3px solid #f4c542;border-radius:18px;background:#211923;color:#fff;font-size:22px;font-weight:950;box-shadow:0 8px 24px #0007;appearance:auto;-webkit-appearance:menulist}
          #apkDepartmentSelect option{background:#211923;color:#fff;font-size:18px}
          </style>
          <script id="apk-department-menu">
          (function(){
            var deps=[['01','Ain'],['02','Aisne'],['03','Allier'],['04','Alpes-de-Haute-Provence'],['05','Hautes-Alpes'],['06','Alpes-Maritimes'],['07','Ardèche'],['08','Ardennes'],['09','Ariège'],['10','Aube'],['11','Aude'],['12','Aveyron'],['13','Bouches-du-Rhône'],['14','Calvados'],['15','Cantal'],['16','Charente'],['17','Charente-Maritime'],['18','Cher'],['19','Corrèze'],['2A','Corse-du-Sud'],['2B','Haute-Corse'],['21','Côte-d’Or'],['22','Côtes-d’Armor'],['23','Creuse'],['24','Dordogne'],['25','Doubs'],['26','Drôme'],['27','Eure'],['28','Eure-et-Loir'],['29','Finistère'],['30','Gard'],['31','Haute-Garonne'],['32','Gers'],['33','Gironde'],['34','Hérault'],['35','Ille-et-Vilaine'],['36','Indre'],['37','Indre-et-Loire'],['38','Isère'],['39','Jura'],['40','Landes'],['41','Loir-et-Cher'],['42','Loire'],['43','Haute-Loire'],['44','Loire-Atlantique'],['45','Loiret'],['46','Lot'],['47','Lot-et-Garonne'],['48','Lozère'],['49','Maine-et-Loire'],['50','Manche'],['51','Marne'],['52','Haute-Marne'],['53','Mayenne'],['54','Meurthe-et-Moselle'],['55','Meuse'],['56','Morbihan'],['57','Moselle'],['58','Nièvre'],['59','Nord'],['60','Oise'],['61','Orne'],['62','Pas-de-Calais'],['63','Puy-de-Dôme'],['64','Pyrénées-Atlantiques'],['65','Hautes-Pyrénées'],['66','Pyrénées-Orientales'],['67','Bas-Rhin'],['68','Haut-Rhin'],['69','Rhône'],['70','Haute-Saône'],['71','Saône-et-Loire'],['72','Sarthe'],['73','Savoie'],['74','Haute-Savoie'],['75','Paris'],['76','Seine-Maritime'],['77','Seine-et-Marne'],['78','Yvelines'],['79','Deux-Sèvres'],['80','Somme'],['81','Tarn'],['82','Tarn-et-Garonne'],['83','Var'],['84','Vaucluse'],['85','Vendée'],['86','Vienne'],['87','Haute-Vienne'],['88','Vosges'],['89','Yonne'],['90','Territoire de Belfort'],['91','Essonne'],['92','Hauts-de-Seine'],['93','Seine-Saint-Denis'],['94','Val-de-Marne'],['95','Val-d’Oise']];
            function install(){
              var host=document.getElementById('deps');
              if(!host||document.getElementById('apkDepartmentSelect'))return !!host;
              var wrap=document.createElement('div');wrap.id='apkDepartmentWrap';
              var lab=document.createElement('label');lab.id='apkDepartmentLabel';lab.htmlFor='apkDepartmentSelect';lab.textContent='DÉPARTEMENT';
              var sel=document.createElement('select');sel.id='apkDepartmentSelect';
              var first=document.createElement('option');first.value='';first.textContent='CHOISIR UN DÉPARTEMENT';first.selected=true;sel.appendChild(first);
              deps.forEach(function(d){var o=document.createElement('option');o.value=d[0];o.textContent=d[0]+' — '+d[1];sel.appendChild(o)});
              sel.addEventListener('change',function(){
                var v=this.value;if(!v)return;
                try{if(typeof selectDep==='function'){selectDep(v)}else if(window.selectDep){window.selectDep(v)}}catch(e){}
              });
              wrap.appendChild(lab);wrap.appendChild(sel);host.insertBefore(wrap,host.firstChild);
              return true;
            }
            var tries=0;function go(){tries++;if(!install()&&tries<40)setTimeout(go,150)}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
          })();
          </script>
          '''
          s = s.replace('</body>', inject + '\n</body>', 1) if '</body>' in s else s + inject
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify department dropdown was injected
        run: |
          grep -q 'apkDepartmentSelect' app/src/main/assets/marches.html
          grep -q 'CHOISIR UN DÉPARTEMENT' app/src/main/assets/marches.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carlplay-APK-Tous-Marches
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest APK in repository
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LATEST-APK.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST-APK.apk
          git commit -m "APK compilé avec menu départements corrigé [skip ci]" || exit 0
          git push
