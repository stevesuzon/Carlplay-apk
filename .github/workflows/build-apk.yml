name: Build APK
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "LATEST-APK.apk"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download market files
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 https://voiture.appli-suzon.workers.dev/carplay-marches.html -o app/src/main/assets/carplay-marches.html
          curl -fL --retry 3 https://voiture.appli-suzon.workers.dev/marches.html -o app/src/main/assets/marches.html
          curl -fL --retry 3 https://voiture.appli-suzon.workers.dev/belgique-marches.html -o app/src/main/assets/belgique-marches.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carlplay-APK-Tous-Marches
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest APK in repository
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LATEST-APK.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST-APK.apk
          git commit -m "APK compilé avec tous les marchés [skip ci]" || exit 0
          git push
