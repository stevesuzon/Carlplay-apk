name: Build APK TEST Licence Expiree
on:
  push:
    branches: ["test-licence-expiree"]
    paths-ignore:
      - "LATEST-APK-EXPIREE.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore market sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat assets-src/markets-zip/marches.* | base64 -d | gunzip > /tmp/france-source.html
          cat assets-src/markets-zip/belgique.* | base64 -d | gunzip > /tmp/belgique-source.html
          cat assets-src/markets-zip/carplay.* | base64 -d | gunzip > app/src/main/assets/carplay-marches.html
          test -s /tmp/france-source.html
          test -s /tmp/belgique-source.html

      - name: Restore images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          A=Path('app/src/main/assets')
          A.mkdir(parents=True,exist_ok=True)
          pairs=[('assets-src/master.b64','master-front.jpg'),('assets-src/tabbert.b64','tabbert.jpg'),('assets-src/chineur-photo.b64','chineur.webp'),('assets-src/route66-bg.b64','route66-bg.jpg')]
          for src,dst in pairs:
              raw=Path(src).read_text(errors='ignore')
              clean=''.join(re.findall(r'[A-Za-z0-9+/]',raw))
              clean+='='*((4-len(clean)%4)%4)
              (A/dst).write_bytes(base64.b64decode(clean,validate=False))
          p=A/'index.html'
          if p.exists():
              s=p.read_text(errors='ignore')
              s=s.replace('master-front.png','master-front.jpg').replace('tabbert.png','tabbert.jpg').replace('chineur.svg','chineur.webp')
              p.write_text(s)
          PY

      - name: Generate clean market pages
        run: python3 assets-src/generate_markets.py

      - name: Improve market card design
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('marches.html','belgique-marches.html'):
              p=Path('app/src/main/assets')/name
              s=p.read_text(encoding='utf-8')
              s=s.replace('.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}', '.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:stretch}')
              s=s.replace('.card{background:rgba(8,19,38,.94);padding:18px;border:1px solid #ffffff35;border-radius:20px}', '.card{background:rgba(8,19,38,.96);padding:20px;border:4px solid #f39b19;border-radius:22px;min-height:440px;height:100%;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.65)}')
              s=s.replace('.name{font-size:26px;font-weight:950}', '.name{font-size:38px;font-weight:950;line-height:1.10;text-shadow:0 2px 6px #000;margin-bottom:6px}')
              s=s.replace('.meta{margin-top:9px;font-size:18px;line-height:1.35}', '.meta{margin-top:10px;font-size:20px;line-height:1.38;font-weight:750}')
              s=s.replace('.weather{margin-top:16px;padding:12px;border-radius:14px;background:rgba(2,12,25,.72);font-size:17px}', '.weather{margin-top:16px;padding:13px;border-radius:14px;background:rgba(2,12,25,.82);font-size:18px;border:1px solid #f39b1977}')
              s=s.replace('.actions{display:flex;gap:12px;margin-top:16px}', '.actions{display:flex;gap:12px;margin-top:auto;padding-top:18px}')
              s=s.replace('.actions button{flex:1;height:58px;border:0;border-radius:15px;color:#fff;font-size:17px;font-weight:900}', '.actions button{flex:1;height:64px;border:0;border-radius:15px;color:#fff;font-size:19px;font-weight:950}')
              p.write_text(s,encoding='utf-8')
          PY

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK TEST expiree
        run: gradle assembleDebug

      - name: Upload APK TEST expiree
        uses: actions/upload-artifact@v4
        with:
          name: CarPlay-Travaille-TEST-LICENCE-EXPIREE
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK expiree direct
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/LATEST-APK-EXPIREE.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin test-licence-expiree
          git reset --hard origin/test-licence-expiree
          cp /tmp/LATEST-APK-EXPIREE.apk LATEST-APK-EXPIREE.apk
          git add LATEST-APK-EXPIREE.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publie APK licence expirée [skip ci]"
            git push origin HEAD:test-licence-expiree
          fi
