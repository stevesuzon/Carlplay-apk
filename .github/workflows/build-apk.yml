name: Build APK
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "LATEST-APK.apk"
      - "CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore market sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat assets-src/markets-zip/marches.* | base64 -d | gunzip > /tmp/france-source.html
          cat assets-src/markets-zip/belgique.* | base64 -d | gunzip > /tmp/belgique-source.html
          cat assets-src/markets-zip/carplay.* | base64 -d | gunzip > app/src/main/assets/carplay-marches.html
      - name: Restore images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          A=Path('app/src/main/assets')
          for src,dst in [('assets-src/master.b64','master-front.jpg'),('assets-src/tabbert.b64','tabbert.jpg'),('assets-src/chineur-photo.b64','chineur.webp'),('assets-src/route66-bg.b64','route66-bg.jpg')]:
              raw=Path(src).read_text(errors='ignore'); clean=''.join(re.findall(r'[A-Za-z0-9+/]',raw)); clean+='='*((4-len(clean)%4)%4); (A/dst).write_bytes(base64.b64decode(clean,validate=False))
          p=A/'index.html'; s=p.read_text(errors='ignore').replace('master-front.png','master-front.jpg').replace('tabbert.png','tabbert.jpg').replace('chineur.svg','chineur.webp'); p.write_text(s)
          PY
      - name: Generate clean market pages
        run: python3 assets-src/generate_markets.py
      - name: Add visible update notification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8',errors='ignore')
          # Remove previous injected notification if present, then inject a fresh version id.
          start=s.find('<!-- CP_UPDATE_START -->')
          end=s.find('<!-- CP_UPDATE_END -->')
          if start!=-1 and end!=-1:
              s=s[:start]+s[end+len('<!-- CP_UPDATE_END -->'):]
          inline=r'''<!-- CP_UPDATE_START --><style>#cpUpdateNotice{position:fixed!important;z-index:2147483647!important;top:118px!important;left:4%!important;width:92%!important;box-sizing:border-box!important;background:#07111f!important;color:#fff!important;border:3px solid #ff9818!important;border-radius:18px!important;padding:13px 10px!important;text-align:center!important;font:bold 17px Arial,sans-serif!important;box-shadow:0 8px 24px #000a!important}#cpUpdateDetail{display:none;position:fixed;z-index:2147483647;inset:0;background:#000c;padding:18px}.cpUpdateBox{margin:17vh auto 0;max-width:620px;background:#0d1b2d;color:#fff;border:3px solid #ff9818;border-radius:20px;padding:20px;font:17px Arial;line-height:1.45}</style><div id="cpUpdateNotice" onclick="cpOpenUpdate()">🔔 NOUVELLE MISE À JOUR — APPUYEZ ICI</div><div id="cpUpdateDetail" onclick="if(event.target===this)this.style.display='none'"><div class="cpUpdateBox"><h2>🔄 Mise à jour</h2><p>🛒 Marchés : informations et corrections.</p><p>📍 GPS : destinations améliorées.</p><p>📲 Installation : iPhone et Android.</p><p>🔔 Notifications : nouveau système d’affichage.</p><small>Appuyez à côté pour fermer.</small></div></div><script>window.cpOpenUpdate=function(){var n=document.getElementById('cpUpdateNotice');if(n)n.style.display='none';var d=document.getElementById('cpUpdateDetail');if(d)d.style.display='block';try{localStorage.setItem('cp_seen_update_v2','2026-08-27-notification-v2')}catch(e){}};(function(){var seen=false;try{seen=localStorage.getItem('cp_seen_update_v2')==='2026-08-27-notification-v2'}catch(e){}var n=document.getElementById('cpUpdateNotice');if(seen&&n)n.style.display='none';if(!seen&&n)setTimeout(function(){if(n&&n.parentNode)n.style.display='none';try{localStorage.setItem('cp_seen_update_v2','2026-08-27-notification-v2')}catch(e){}},4000)})();</script><!-- CP_UPDATE_END -->'''
          s=s.replace('</body>',inline+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle assembleDebug
      - name: Prepare V5 Cloudflare package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/carplay-v5 && mkdir -p /tmp/carplay-v5
          cp -a app/src/main/assets/. /tmp/carplay-v5/
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/carplay-v5/CarPlay-V5.apk
          cd /tmp/carplay-v5
          zip -r "$GITHUB_WORKSPACE/CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip" .
      - name: Upload V5 package
        uses: actions/upload-artifact@v4
        with:
          name: CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5
          path: CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip
          retention-days: 30
      - name: Publish latest APK and replace V5 ZIP in GitHub
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/LATEST-APK.apk
          cp CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip /tmp/CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main && git reset --hard origin/main
          cp /tmp/LATEST-APK.apk LATEST-APK.apk
          cp /tmp/CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip
          git add LATEST-APK.apk CarPlay-TELEPHONE-GITHUB-CLOUDFLARE-V5.zip
          if ! git diff --cached --quiet; then git commit -m "Remplace V5 Cloudflare et APK"; git push origin HEAD:main; fi
