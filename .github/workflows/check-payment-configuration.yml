name: Check payment configuration
on:
  push:
    branches: [fix/access-permanent-block-20261021]
    paths: [.github/workflows/check-payment-configuration.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect required secret names without revealing values
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          url='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT']+'/workers/scripts/carplay-telephone/settings'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']})
          with urllib.request.urlopen(req) as r: data=json.load(r)
          if not data.get('success'): raise SystemExit('Cloudflare inspection failed')
          names={x['name'] for x in data['result']['bindings']}
          for name in ['STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET','CODE_PEPPER']:
              print(name+': Cloudflare='+str(name in names)+', GitHub='+str(bool(os.environ.get(name))))
          PY
