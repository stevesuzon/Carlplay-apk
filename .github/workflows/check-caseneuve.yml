name: Check Caseneuve subscription

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/check-caseneuve.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Check subscription status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npx wrangler d1 execute carplay-metiers --remote --config wrangler.toml --command "SELECT id,account_first_name,account_last_name,active,lifetime,expires_at,CASE WHEN phone_device IS NULL OR phone_device='' THEN 0 ELSE 1 END AS has_phone,CASE WHEN autoradio_device IS NULL OR autoradio_device='' THEN 0 ELSE 1 END AS has_autoradio,redeemed_at,updated_at FROM subscriptions WHERE (lower(trim(account_first_name))='pierre' AND lower(trim(account_last_name))='caseneuve') OR (lower(trim(account_first_name))='caseneuve' AND lower(trim(account_last_name))='pierre') ORDER BY id DESC LIMIT 10;"
