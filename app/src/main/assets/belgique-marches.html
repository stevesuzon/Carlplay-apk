<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Marchés Belgique</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:linear-gradient(135deg,#171d2a,#47241e);color:#fff}.wrap{width:min(1050px,95vw);margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:10;padding:8px 0 14px;background:linear-gradient(180deg,#171d2af5,#171d2a00)}.back{display:inline-block;padding:13px 18px;border-radius:14px;background:linear-gradient(135deg,#ff9a19,#ff5b00);color:#fff;text-decoration:none;font-weight:900}.title{font-size:34px;font-weight:950;text-align:center;flex:1}.hint{margin:4px 0 18px;padding:14px 16px;border-radius:16px;background:#0d1420cc;border:1px solid #ffffff22;font-size:17px;font-weight:800;text-align:center}.provinces{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.province{border:2px solid #ffffff40;border-radius:18px;padding:18px 12px;min-height:88px;background:linear-gradient(145deg,#ffd11a,#c61f2d);color:#fff;font-size:20px;font-weight:950;box-shadow:0 6px 18px #0006;cursor:pointer}.province.active{outline:4px solid #fff;background:linear-gradient(145deg,#ffea67,#e21f2f)}.days{display:none;margin-top:20px;grid-template-columns:repeat(4,1fr);gap:10px}.days.show{display:grid}.day{border:0;border-radius:16px;padding:15px 8px;background:#1e3354;color:#fff;font-size:18px;font-weight:900;cursor:pointer}.day.active{outline:4px solid #ffbd2e;background:#284a7c}.result{display:none;margin-top:18px;padding:20px;border-radius:20px;background:#0d1420e8;border:1px solid #ffffff26}.result.show{display:block}.result h2{margin:0 0 10px;font-size:28px}.empty{padding:18px;border-radius:15px;background:#1a2434;font-size:18px;font-weight:800;line-height:1.45}.small{margin-top:8px;color:#cdd7e6;font-size:14px}@media(max-width:760px){.provinces{grid-template-columns:repeat(2,1fr)}.days{grid-template-columns:repeat(2,1fr)}.title{font-size:26px}.province{font-size:18px}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="choix-marches.html">← RETOUR</a><div class="title">🇧🇪 MARCHÉS BELGIQUE</div><div style="width:92px"></div></div><div class="hint">Choisissez une province ou Bruxelles-Capitale, puis le jour. Les boutons restent grands et lisibles.</div><section class="provinces" id="provinces"></section><section class="days" id="days"></section><section class="result" id="result"><h2 id="resultTitle"></h2><div class="empty" id="resultBody"></div></section></main><script>const zones=['Anvers','Brabant flamand','Brabant wallon','Flandre occidentale','Flandre orientale','Hainaut','Liège','Limbourg','Luxembourg','Namur','Bruxelles-Capitale'];const jours=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];let zone='',jour='';const p=document.getElementById('provinces'),d=document.getElementById('days');zones.forEach(z=>{const b=document.createElement('button');b.className='province';b.textContent=z;b.onclick=()=>{zone=z;jour='';document.querySelectorAll('.province').forEach(x=>x.classList.toggle('active',x===b));d.classList.add('show');document.getElementById('result').classList.remove('show');localStorage.setItem('be_zone',z)};p.appendChild(b)});jours.forEach(j=>{const b=document.createElement('button');b.className='day';b.textContent=j;b.onclick=()=>{jour=j;document.querySelectorAll('.day').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('resultTitle').textContent=zone+' — '+jour;document.getElementById('resultBody').innerHTML='Aucun marché n’est encore enregistré pour cette sélection dans cette version.<div class="small">La page Belgique fonctionne maintenant correctement : province → jour → marchés. Les marchés pourront être ajoutés sans casser la navigation.</div>';document.getElementById('result').classList.add('show')};d.appendChild(b)});</script></body></html>
