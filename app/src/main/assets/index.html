<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Les 4 Pauvres Diables — Voiture</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#152f42,#6d4b28)}body:before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,rgba(255,190,70,.32),transparent 42%),linear-gradient(180deg,rgba(0,90,150,.12),rgba(60,20,0,.38));pointer-events:none}.wrap{position:relative;width:min(1100px,94vw);margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.status{font-weight:800;text-shadow:0 2px 4px #000}.gear{width:68px;height:68px;border-radius:50%;background:#293448;border:2px solid #8792a5;display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;position:relative;z-index:1002}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border-radius:28px;min-height:230px;padding:25px;box-shadow:0 8px 24px #0007;border:2px solid #ffffff55;cursor:pointer;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.blue{background:linear-gradient(145deg,#05aaff,#1934d7)}.orange{background:linear-gradient(145deg,#ff9a19,#ff3d00)}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.small{min-height:118px;border-radius:26px;padding:10px 22px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:24px;font-weight:900;box-shadow:0 8px 24px #0007;border:2px solid #ffffff55;cursor:pointer;position:relative;overflow:hidden}.green{background:linear-gradient(135deg,#09d66f,#00a5f4)}.red{background:linear-gradient(135deg,#ff456d,#ff1d24)}.tag{align-self:flex-end;border-radius:30px;background:#183f91aa;border:2px solid #ffffff55;padding:9px 16px;font-size:18px;font-weight:800;position:relative;z-index:3}.title{font-size:42px;font-weight:900;margin:18px 0 4px;text-shadow:0 3px 8px #0005;line-height:1.05}.marketText{margin-left:220px;position:relative;z-index:2;padding-right:8px}.vehicleVisual{position:absolute;left:10px;bottom:14px;width:220px;height:205px;display:flex;align-items:flex-end;justify-content:center;z-index:1}.vehicleVisual img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 11px #0009)}.chinaTitle{max-width:92%;font-size:35px}.returnVehicle{display:flex;align-items:center;justify-content:center;width:180px;height:105px;flex:0 0 180px}.returnVehicle img{width:180px;height:105px;object-fit:contain;filter:drop-shadow(0 5px 7px #0008)}.settings{display:none;position:fixed;top:0;right:0;bottom:0;width:min(430px,94vw);z-index:1001;padding:18px;background:#101724f5;border-left:2px solid #ffffff35;box-shadow:-10px 0 30px #0009;overflow-y:auto}.settings.open{display:block}.settings h2{margin:5px 0 14px;font-size:28px}.settingRow{margin:10px 0;border-radius:17px;overflow:hidden;background:#1d293c;border:1px solid #ffffff24}.settingHead{width:100%;padding:18px;border:0;background:#263650;color:#fff;font-size:20px;font-weight:900;text-align:left;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.settingBody{display:none;padding:10px}.settingBody.open{display:block}.settingBody button{width:100%;margin:6px 0;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:850;background:#eef2f8;color:#172033;cursor:pointer}.settingBody .selected{outline:4px solid #ffb62e;background:#fff4d8}.settingNote{font-size:13px;color:#d7dde8;padding:7px 4px 3px;line-height:1.4}.closeSettings{width:100%;margin-top:14px;padding:17px;border:0;border-radius:15px;background:#d34343;color:#fff;font-size:19px;font-weight:900}.saved{text-align:center;margin-top:8px;font-weight:700}@media(max-width:720px){.grid,.bottom{grid-template-columns:1fr}.title{font-size:32px}.marketText{margin-left:160px}.vehicleVisual{width:160px;height:165px}.returnVehicle{width:145px;flex-basis:145px}.returnVehicle img{width:145px;height:95px}}</style></head><body><div class="wrap"><div class="top"><div id="network" class="status">Vérification Internet…</div><div class="gear" onclick="toggleSettings()">⚙</div></div><div class="grid"><div class="card blue" onclick="location.href='choix-marches.html'"><div class="tag">FRANCE + BELGIQUE</div><div class="vehicleVisual"><img src="master-front.png" alt="Renault Master"></div><div class="marketText"><div class="title">MARCHÉS</div></div></div><div class="card orange" onclick="location.href='coin-de-chine.html'"><div class="tag">BONS COINS</div><div class="title chinaTitle">RETROUVER SON COIN DE CHINE</div></div></div></div><div class="bottom"><div class="small green" onclick="returnPlace()"><div class="returnVehicle"><img src="tabbert.png" alt="Caravane Tabbert"></div><span>RETOURNER AU CAMPING</span></div><div class="small red" onclick="clearReturnPlace()"><span style="font-size:42px">🗑️</span> EFFACER EMPLACEMENT</div></div><div id="settings" class="settings"><h2>⚙️ Réglages</h2><div class="settingRow"><button class="settingHead" onclick="toggleSection('gpsMenu',this)"><span>🧭 GPS / navigation</span><span>⌄</span></button><div class="settingBody" id="gpsMenu"><button id="gpsWaze" onclick="saveGps('Waze')">Waze</button><button id="gpsGoogle" onclick="saveGps('Google Maps')">Google Maps</button><div class="settingNote" id="gpsStatus"></div></div></div><div class="settingRow"><button class="settingHead" onclick="toggleSection('mapsMenu',this)"><span>🗺️ Cartes hors ligne</span><span>⌄</span></button><div class="settingBody" id="mapsMenu"><button onclick="openExternal('https://www.google.com/maps/search/France')">🇫🇷 France</button><button onclick="openExternal('https://www.google.com/maps/search/Belgique')">🇧🇪 Belgique</button><div class="settingNote">Ouvre Google Maps pour préparer les cartes hors connexion.</div></div></div><div class="settingRow"><button class="settingHead" onclick="toggleSection('updateMenu',this)"><span>🔄 Mise à jour de l’appli</span><span>⌄</span></button><div class="settingBody" id="updateMenu"><button onclick="openExternal('https://raw.githubusercontent.com/stevesuzon/Carlplay-apk/main/LATEST-APK.apk')">Télécharger la dernière APK</button><div class="settingNote">Version actuelle : 2026.08.19.8</div></div></div><button class="closeSettings" onclick="toggleSettings()">FERMER LES RÉGLAGES</button></div><div id="returnStatus" class="saved"></div></div><script>window.updateNetworkStatus=function(){let ok=false;try{ok=window.AndroidStatus?AndroidStatus.hasInternet():navigator.onLine}catch(e){ok=navigator.onLine}network.textContent=ok?'Internet disponible':'Réseau indisponible'};addEventListener('online',updateNetworkStatus);addEventListener('offline',updateNetworkStatus);setInterval(updateNetworkStatus,4000);updateNetworkStatus();function toggleSettings(){settings.classList.toggle('open')}function toggleSection(id,btn){const b=document.getElementById(id),open=b.classList.contains('open');document.querySelectorAll('.settingBody').forEach(x=>x.classList.remove('open'));document.querySelectorAll('.settingHead span:last-child').forEach(x=>x.textContent='⌄');if(!open){b.classList.add('open');btn.querySelector('span:last-child').textContent='⌃'}}function saveGps(v){localStorage.setItem('gps_pref',v);refreshPrefs()}function refreshPrefs(){const g=localStorage.getItem('gps_pref')||'';gpsStatus.textContent=g?'GPS choisi : '+g:'Aucun GPS choisi';gpsWaze.classList.toggle('selected',g==='Waze');gpsGoogle.classList.toggle('selected',g==='Google Maps')}function returnPlace(){let a=localStorage.getItem('return_lat'),o=localStorage.getItem('return_lon');if(!a||!o){if(!navigator.geolocation)return alert('GPS indisponible');navigator.geolocation.getCurrentPosition(p=>{localStorage.setItem('return_lat',p.coords.latitude);localStorage.setItem('return_lon',p.coords.longitude);showStatuses();alert('Camping enregistré. Appuie à nouveau pour y retourner.')},()=>alert('Impossible de récupérer votre position.'),{enableHighAccuracy:true});return}const q=a+','+o,pref=localStorage.getItem('gps_pref')||'Google Maps';location.href=pref==='Waze'?'https://waze.com/ul?ll='+encodeURIComponent(q)+'&navigate=yes':'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q)+'&travelmode=driving&dir_action=navigate'}function clearReturnPlace(){localStorage.removeItem('return_lat');localStorage.removeItem('return_lon');showStatuses();alert('Emplacement de retour effacé.')}function showStatuses(){returnStatus.textContent=localStorage.getItem('return_lat')?'Camping enregistré.':''}function openExternal(u){location.href=u}refreshPrefs();showStatuses();</script></body></html>
