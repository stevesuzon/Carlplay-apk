<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Carlplay</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#152f42,#6d4b28);overflow:auto}body:before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,rgba(255,190,70,.32),transparent 42%),linear-gradient(180deg,rgba(0,90,150,.12),rgba(60,20,0,.38));pointer-events:none}.wrap{position:relative;width:min(1100px,94vw);margin:auto;padding:24px;box-sizing:border-box}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.status{font-weight:700;text-shadow:0 2px 4px #000}.gear{width:64px;height:64px;border-radius:50%;background:#293448;border:2px solid #8792a5;display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border-radius:28px;min-height:230px;padding:28px;box-sizing:border-box;box-shadow:0 8px 24px #0007;border:2px solid #ffffff55;cursor:pointer;display:flex;flex-direction:column;justify-content:center}.blue{background:linear-gradient(145deg,#05aaff,#1934d7)}.orange{background:linear-gradient(145deg,#ff9a19,#ff3d00)}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.small{min-height:105px;border-radius:26px;padding:20px 28px;display:flex;align-items:center;justify-content:center;gap:18px;font-size:25px;font-weight:900;box-shadow:0 8px 24px #0007;border:2px solid #ffffff55;cursor:pointer}.green{background:linear-gradient(135deg,#09d66f,#00a5f4)}.red{background:linear-gradient(135deg,#ff456d,#ff1d24)}.tag{align-self:flex-end;border-radius:30px;background:#183f91aa;border:2px solid #ffffff55;padding:10px 20px;font-size:20px;font-weight:800}.title{font-size:48px;font-weight:900;margin:20px 0 8px;text-shadow:0 3px 8px #0005}.desc{font-size:20px;font-weight:600}.vehicle{font-size:52px;position:absolute;margin-top:35px}.marketText{margin-left:110px}.settings{display:none;margin-top:18px;padding:20px;border-radius:22px;background:#101724ee}.settings button{width:100%;margin:7px 0;padding:15px;border:0;border-radius:16px;font-size:18px;font-weight:800}.progressWrap{display:none;margin:12px 0}.track{height:16px;border-radius:10px;background:#333;overflow:hidden}.bar{height:100%;width:0;background:#fff}.saved{text-align:center;margin-top:8px;font-weight:700}@media(max-width:720px){.grid,.bottom{grid-template-columns:1fr}.card{min-height:170px}.title{font-size:34px}.marketText{margin-left:75px}.vehicle{font-size:40px}}</style></head><body><div class="wrap"><div class="top"><div id="network" class="status"></div><div class="gear" onclick="toggleSettings()">⚙</div></div><div class="grid"><div class="card blue" onclick="openMarkets()"><div class="tag">FRANCE + BELGIQUE</div><div class="vehicle">🚐</div><div class="marketText"><div class="title">MARCHÉS</div><div class="desc">Trouver rapidement un marché et lancer le GPS</div></div></div><div class="card orange" onclick="saveChineSpot()"><div class="tag">POSITIONS</div><div class="title">COIN DE CHINE</div><div class="desc">Enregistrer son coin de chine</div></div></div></div><div class="bottom"><div class="small green" onclick="returnPlace()"><span style="font-size:48px">🏕️</span> RETROUVE LA PLACE</div><div class="small red" onclick="clearReturnPlace()"><span style="font-size:42px">🗑️</span> EFFACER EMPLACEMENT</div></div><div id="settings" class="settings"><h2>Réglages</h2><button onclick="chooseGps()">Choisir le GPS / navigation</button><button onclick="downloadMap('France')">Télécharger la carte de France</button><button onclick="downloadMap('Belgique')">Télécharger la carte de Belgique</button><button onclick="checkUpdate()">Mise à jour de l'appli</button><div id="progressWrap" class="progressWrap"><div id="progressLabel">0 %</div><div class="track"><div id="bar" class="bar"></div></div></div><div id="mapStatus" class="saved"></div></div><div id="returnStatus" class="saved"></div><div id="chineStatus" class="saved"></div></div><script>function net(){network.textContent=navigator.onLine?'5G / Réseau disponible':'Hors ligne'}addEventListener('online',net);addEventListener('offline',net);net();function toggleSettings(){settings.style.display=settings.style.display==='block'?'none':'block'}function openMarkets(){location.href='https://voiture.appli-suzon.workers.dev/'}function saveChineSpot(){if(!navigator.geolocation)return alert('GPS indisponible');navigator.geolocation.getCurrentPosition(p=>{localStorage.setItem('chine_lat',p.coords.latitude);localStorage.setItem('chine_lon',p.coords.longitude);showStatuses();alert('Coin de chine enregistré.')},()=>alert('Impossible de récupérer votre position.'),{enableHighAccuracy:true})}function returnPlace(){let a=localStorage.getItem('return_lat'),o=localStorage.getItem('return_lon');if(!a||!o){if(!navigator.geolocation)return alert('GPS indisponible');navigator.geolocation.getCurrentPosition(p=>{localStorage.setItem('return_lat',p.coords.latitude);localStorage.setItem('return_lon',p.coords.longitude);showStatuses();alert('Place enregistrée. Appuyez à nouveau pour y revenir.')},()=>alert('Impossible de récupérer votre position.'),{enableHighAccuracy:true});return}alert('Retour vers la place enregistrée : '+Number(a).toFixed(6)+', '+Number(o).toFixed(6))}function clearReturnPlace(){localStorage.removeItem('return_lat');localStorage.removeItem('return_lon');showStatuses();alert('Emplacement de retour effacé.')}function showStatuses(){returnStatus.textContent=localStorage.getItem('return_lat')?'Place enregistrée.':'';chineStatus.textContent=localStorage.getItem('chine_lat')?'Coin de chine enregistré.':''}function chooseGps(){let x=prompt('Nom du GPS/navigation à utiliser :',localStorage.getItem('gps_choice')||'');if(x){localStorage.setItem('gps_choice',x);alert('GPS enregistré : '+x)}}function progress(label,done){progressWrap.style.display='block';let n=0,bar=document.getElementById('bar'),lab=document.getElementById('progressLabel');bar.style.width='0%';let t=setInterval(()=>{n=Math.min(100,n+5);bar.style.width=n+'%';lab.textContent=label+' : '+n+' %';if(n===100){clearInterval(t);done&&done()}},120)}function downloadMap(c){progress('Téléchargement '+c,()=>{localStorage.setItem('map_'+c,'100');mapStatus.textContent='Carte '+c+' prête à 100 %.'})}function checkUpdate(){progress('Vérification / mise à jour',()=>alert('Vérification terminée.'))}showStatuses();</script></body></html>
