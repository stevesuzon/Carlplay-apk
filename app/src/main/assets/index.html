<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Les 4 Pauvres Diables — Voiture</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#152f42,#6d4b28)}body:before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,rgba(255,190,70,.32),transparent 42%),linear-gradient(180deg,rgba(0,90,150,.12),rgba(60,20,0,.38));pointer-events:none}.wrap{position:relative;width:min(1100px,94vw);margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.status{font-weight:700;text-shadow:0 2px 4px #000}.gear{width:64px;height:64px;border-radius:50%;background:#293448;border:2px solid #8792a5;display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border-radius:28px;min-height:230px;padding:28px;box-shadow:0 8px 24px #0007;border:2px solid #ffffff55;cursor:pointer;display:flex;flex-direction:column;justify-content:center}.blue{background:linear-gradient(145deg,#05aaff,#1934d7)}.orange{background:linear-gradient(145deg,#ff9a19,#ff3d00)}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.small{min-height:105px;border-radius:26px;padding:20px 28px;display:flex;align-items:center;justify-content:center;gap:18px;font-size:25px;font-weight:900;box-shadow:0 8px 24px #0007;border:2px solid #ffffff55;cursor:pointer}.green{background:linear-gradient(135deg,#09d66f,#00a5f4)}.red{background:linear-gradient(135deg,#ff456d,#ff1d24)}.tag{align-self:flex-end;border-radius:30px;background:#183f91aa;border:2px solid #ffffff55;padding:10px 20px;font-size:20px;font-weight:800}.title{font-size:48px;font-weight:900;margin:20px 0 8px;text-shadow:0 3px 8px #0005}.desc{font-size:20px;font-weight:600}.vehicle{font-size:52px;position:absolute;margin-top:35px}.marketText{margin-left:110px}.settings{display:none;margin-top:18px;padding:20px;border-radius:22px;background:#101724ee}.settings button{width:100%;margin:7px 0;padding:15px;border:0;border-radius:16px;font-size:18px;font-weight:800}.saved{text-align:center;margin-top:8px;font-weight:700}@media(max-width:720px){.grid,.bottom{grid-template-columns:1fr}.card{min-height:170px}.title{font-size:34px}.marketText{margin-left:75px}.vehicle{font-size:40px}}</style></head><body><div class="wrap"><div class="top"><div id="network" class="status"></div><div class="gear" onclick="toggleSettings()">⚙</div></div><div class="grid"><div class="card blue" onclick="location.href='marches.html'"><div class="tag">FRANCE</div><div class="vehicle">🚐</div><div class="marketText"><div class="title">MARCHÉS</div><div class="desc">Même principe que le site : choisis le département puis le jour</div></div></div><div class="card orange" onclick="location.href='coin-de-chine.html'"><div class="tag">BONS COINS</div><div class="title">TROUVER UN COIN DE CHINE</div><div class="desc">Même principe que La Route & les Copains : localisation, description, enregistrement et GPS</div></div></div></div><div class="bottom"><div class="small green" onclick="returnPlace()"><span style="font-size:48px">🏕️</span> RETROUVE LA PLACE</div><div class="small red" onclick="clearReturnPlace()"><span style="font-size:42px">🗑️</span> EFFACER EMPLACEMENT</div></div><div id="settings" class="settings"><h2>Réglages</h2><button onclick="alert('La navigation utilise Google Maps ou Waze lorsque tu appuies sur ALLER dans un marché.')">GPS / navigation</button><button onclick="openExternal('https://www.google.com/maps')">Carte de France / Belgique</button><button onclick="alert('Version APK avec marchés intégrés — 2026.08.19.2')">Mise à jour de l'appli</button></div><div id="returnStatus" class="saved"></div></div><script>function net(){network.textContent=navigator.onLine?'Réseau disponible':'Hors ligne — marchés disponibles'}addEventListener('online',net);addEventListener('offline',net);net();function toggleSettings(){settings.style.display=settings.style.display==='block'?'none':'block'}function returnPlace(){let a=localStorage.getItem('return_lat'),o=localStorage.getItem('return_lon');if(!a||!o){if(!navigator.geolocation)return alert('GPS indisponible');navigator.geolocation.getCurrentPosition(p=>{localStorage.setItem('return_lat',p.coords.latitude);localStorage.setItem('return_lon',p.coords.longitude);showStatuses();alert('Place enregistrée. Appuie à nouveau pour y revenir.')},()=>alert('Impossible de récupérer votre position.'),{enableHighAccuracy:true});return}location.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a+','+o)+'&travelmode=driving&dir_action=navigate'}function clearReturnPlace(){localStorage.removeItem('return_lat');localStorage.removeItem('return_lon');showStatuses();alert('Emplacement de retour effacé.')}function showStatuses(){returnStatus.textContent=localStorage.getItem('return_lat')?'Place enregistrée.':''}function openExternal(u){location.href=u}showStatuses();</script></body></html>
