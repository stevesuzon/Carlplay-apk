<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Carlplay Hors ligne</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}body{display:flex;align-items:center;justify-content:center}.wrap{width:100%;max-width:1000px;padding:24px;box-sizing:border-box;text-align:center}.title{font-size:42px;font-weight:700;margin-bottom:8px}.status{font-size:16px;opacity:.75;margin-bottom:18px}.progressWrap{display:none;margin:0 0 20px}.track{height:16px;border-radius:10px;background:#333;overflow:hidden}.bar{height:100%;width:0;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.btn{display:flex;align-items:center;justify-content:center;min-height:105px;border-radius:22px;background:#222;border:2px solid #444;color:#fff;font-size:23px;font-weight:700;text-decoration:none;cursor:pointer}.settingPanel{display:none;margin-top:14px;padding:18px;border-radius:20px;background:#1b1b1b;border:1px solid #444}.settingPanel .btn{min-height:68px;margin-top:10px;font-size:19px}.settings{margin-top:18px}.saved{margin-top:14px;font-size:15px;opacity:.8}.caravan{font-size:31px;margin-right:10px}@media(max-width:700px){.title{font-size:30px}.grid{grid-template-columns:1fr}.btn{min-height:78px;font-size:19px}}</style></head><body><div class="wrap"><div class="title">Mode voiture</div><div id="network" class="status"></div><div id="progressWrap" class="progressWrap"><div id="progressLabel">Téléchargement : 0 %</div><div class="track"><div id="bar" class="bar"></div></div></div><div class="grid"><a class="btn" href="https://voiture.appli-suzon.workers.dev/">Marchés France / Belgique</a><div class="btn" onclick="saveSpot()">Enregistrer son coin de chine</div><div class="btn" onclick="returnSpot()"><span class="caravan">▰</span>Revenir sur la place</div><div class="btn" onclick="clearSpot()">Effacer la position</div></div><div class="settings"><div class="btn" onclick="toggleSettings()">Réglages</div><div id="settings" class="settingPanel"><b>GPS</b><div class="btn" onclick="chooseGps()">Choisir le GPS / navigation</div><b style="display:block;margin-top:18px">Cartes hors ligne</b><div class="btn" onclick="demoDownload('France')">Télécharger la carte de France</div><div class="btn" onclick="demoDownload('Belgique')">Télécharger la carte de Belgique</div><div class="saved" id="mapStatus">Aucune carte téléchargée.</div></div></div><div class="saved" id="spotStatus"></div></div><script>function net(){document.getElementById('network').textContent=navigator.onLine?'Réseau disponible — connexion automatique':'Hors ligne — interface locale active'}addEventListener('online',net);addEventListener('offline',net);net();function toggleSettings(){let e=document.getElementById('settings');e.style.display=e.style.display==='block'?'none':'block'}function saveSpot(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{localStorage.setItem('chine_lat',p.coords.latitude);localStorage.setItem('chine_lon',p.coords.longitude);showSpot();alert('Coin de chine enregistré.')},()=>alert('Impossible de récupérer votre position.'),{enableHighAccuracy:true}):alert('GPS indisponible')}function showSpot(){document.getElementById('spotStatus').textContent=localStorage.getItem('chine_lat')?'Coin de chine enregistré dans l’appareil.':'Aucun coin de chine enregistré.'}function clearSpot(){localStorage.removeItem('chine_lat');localStorage.removeItem('chine_lon');showSpot();alert('La position « Revenir sur la place » a été effacée.')}function returnSpot(){let a=localStorage.getItem('chine_lat'),o=localStorage.getItem('chine_lon');if(!a||!o){alert('Enregistrez d’abord votre coin de chine.');return}alert('Retour vers la position enregistrée : '+Number(a).toFixed(6)+', '+Number(o).toFixed(6))}function chooseGps(){let x=prompt('Nom du GPS/navigation à utiliser :',localStorage.getItem('gps_choice')||'');if(x){localStorage.setItem('gps_choice',x);alert('GPS enregistré : '+x)}}function demoDownload(country){let w=document.getElementById('progressWrap'),b=document.getElementById('bar'),l=document.getElementById('progressLabel'),s=document.getElementById('mapStatus');w.style.display='block';let n=0;b.style.width='0%';let t=setInterval(()=>{n=Math.min(100,n+5);b.style.width=n+'%';l.textContent='Téléchargement '+country+' : '+n+' %';if(n===100){clearInterval(t);localStorage.setItem('map_'+country,'100');s.textContent='Carte de '+country+' téléchargée à 100 % et prête.'}},120)}showSpot();</script></body></html>
