<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>Installer CarPlay</title><style>body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.box{width:min(650px,100%);background:#111;border:2px solid #333;border-radius:28px;padding:24px;text-align:center}h1{font-size:34px}.choice{width:100%;border:0;border-radius:22px;padding:20px 14px;margin:14px 0;font-size:23px;font-weight:900}.apple{background:#f5f5f7;color:#111}.android{background:#39d353;color:#07150b}.guide{display:none;text-align:left;background:#1b1b1b;padding:18px;border-radius:18px;font-size:19px;line-height:1.55}.guide.open{display:block}</style></head><body><div class="box"><h1>📲 INSTALLER CARPLAY</h1><button class="choice apple" onclick="iphone()"> APPLI iPHONE</button><div id="ig" class="guide"><b>iPhone :</b><br>1. La fenêtre Partager va s’ouvrir.<br>2. Appuie sur <b>Ajouter à l’écran d’accueil</b>.<br>3. Appuie sur <b>Ajouter</b>.</div><button class="choice android" onclick="android()">🤖 APPLI ANDROID</button><div id="ag" class="guide"><b>Android :</b><br>Chrome → ⋮ → <b>Installer l’application</b> ou <b>Ajouter à l’écran d’accueil</b> → Installer.</div></div><script>function iphone(){ig.classList.add('open');ag.classList.remove('open');if(navigator.share)navigator.share({title:'CarPlay',url:location.origin}).catch(()=>{})}function android(){ag.classList.add('open');ig.classList.remove('open')}</script></body></html>
