<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>Installer CarPlay</title><style>body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.box{width:min(650px,100%);background:#111;border:2px solid #333;border-radius:28px;padding:24px;text-align:center}h1{font-size:34px}.choice{width:100%;border:0;border-radius:22px;padding:20px 14px;margin:14px 0;font-size:23px;font-weight:900}.apple{background:#f5f5f7;color:#111}.android{background:#39d353;color:#07150b}.guide{display:none;text-align:left;background:#1b1b1b;padding:18px;border-radius:18px;font-size:19px;line-height:1.55}.guide.open{display:block}.hint{display:none;position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:9999;width:min(560px,92vw);background:#ff9818;color:#111;border:3px solid #fff;border-radius:20px;padding:16px 18px;font-size:20px;font-weight:900;text-align:center;box-shadow:0 8px 28px #000}.hint.show{display:block}</style></head><body><div id="hint" class="hint"></div><div class="box"><h1>📲 INSTALLER CARPLAY</h1><button class="choice apple" onclick="iphone()"> APPLI iPHONE</button><div id="ig" class="guide"><b>iPhone :</b><br>Dans le menu qui s’ouvre, appuie sur <b>Ajouter à l’écran d’accueil</b>, puis <b>Ajouter</b>.</div><button class="choice android" onclick="androidInstall()">🤖 APPLI ANDROID</button><div id="ag" class="guide"><b>Android :</b><br>Si la fenêtre d’installation n’apparaît pas : Chrome → ⋮ → <b>Installer l’application</b> ou <b>Ajouter à l’écran d’accueil</b> → Installer.</div></div><script>var deferredInstall=null;addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e});function showHint(t){hint.textContent=t;hint.classList.add('show');setTimeout(function(){hint.classList.remove('show')},2200)}function iphone(){ig.classList.add('open');ag.classList.remove('open');showHint('👇 Dans le menu Partager, appuie sur « Ajouter à l’écran d’accueil »');setTimeout(function(){if(navigator.share)navigator.share({title:'CarPlay',text:'Installer CarPlay sur l’écran d’accueil',url:location.origin}).catch(function(){})},450)}async function androidInstall(){ag.classList.add('open');ig.classList.remove('open');showHint('👇 Appuie sur « Installer l’application »');if(deferredInstall){setTimeout(async function(){try{deferredInstall.prompt();await deferredInstall.userChoice}catch(e){}deferredInstall=null},450);return}setTimeout(function(){showHint('Chrome : ⋮ → Installer l’application / Ajouter à l’écran d’accueil')},500)}</script></body></html>
