<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Trouver un coin de chine</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#152f42,#6d4b28);color:#fff;min-height:100vh}.wrap{width:min(900px,94vw);margin:auto;padding:22px}.back{display:inline-block;color:#171017;text-decoration:none;background:linear-gradient(135deg,#ffb62e,#ff7a00);border:2px solid #ffd36d;padding:13px 18px;border-radius:15px;font-weight:900;box-shadow:0 6px 16px #0005}.hero{margin:18px 0;padding:24px;border-radius:24px;background:#101724dd;border:1px solid #ffffff22}.hero h1{margin:0 0 8px;font-size:38px}.hero p{margin:0;color:#ddd}.form,.saved{background:#101724ee;border:1px solid #ffffff22;border-radius:22px;padding:20px;margin-top:16px}.field{margin:14px 0}.field label{display:block;font-weight:900;margin-bottom:7px}.field input,.field textarea{width:100%;padding:15px;border-radius:14px;border:1px solid #ffffff2b;background:#211923;color:#fff;font-size:17px}.field textarea{min-height:120px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button,.gps{border:0;border-radius:14px;padding:14px 17px;background:#f4c542;color:#171017;font-weight:900;font-size:16px;text-decoration:none;display:inline-block;cursor:pointer}.actions .secondary{background:#ffffff18;color:#fff}.place{padding:16px;border-radius:16px;background:#211923;border:1px solid #ffffff18;margin-top:12px}.place h3{margin:0 0 8px}.muted{color:#bdb5bd;font-size:13px}.empty{color:#bdb5bd}.danger{background:#ff4b56!important;color:#fff!important}.streetPreview{margin-top:12px;border-radius:16px;overflow:hidden;border:2px solid #f4c542;background:#0c1118}.streetPreview iframe{display:block;width:100%;height:260px;border:0;background:#111}.streetLabel{padding:10px 12px;font-weight:900;background:#151b25;color:#fff}.streetFallback{padding:14px;text-align:center;color:#ddd;font-weight:700}@media(max-width:650px){.hero h1{font-size:30px}.actions button,.gps{width:100%}.streetPreview iframe{height:220px}}</style></head><body><main class="wrap"><a class="back" href="index.html">← RETOUR</a><section class="hero"><h1>📍 Trouver un coin de chine</h1><p>Enregistre ta position. Une vue Street View de l’endroit s’affiche pour reconnaître facilement l’emplacement.</p></section><section class="form"><div class="field"><label for="place">Nom du coin de chine</label><input id="place" placeholder="Ex. Bon coin près de Rennes"></div><div class="field"><label for="address">Adresse ou localisation</label><input id="address" placeholder="Adresse, commune ou coordonnées GPS"></div><div class="actions"><button type="button" onclick="locate()">📍 Utiliser ma position</button><button type="button" class="secondary" onclick="openMap()">🧭 Voir sur la carte</button></div><div id="liveStreet"></div><div class="field"><label for="desc">Description</label><textarea id="desc" placeholder="Ex. Bon passage, facile pour se garer, calme..."></textarea></div><div class="actions"><button type="button" onclick="savePlace()">💾 Enregistrer ce coin</button><button type="button" class="secondary" onclick="shareCurrent()">📤 Partager la fiche</button></div><p class="muted">Les coins enregistrés restent sur cet appareil. Le bouton « Y aller » respecte le GPS choisi dans Réglages.</p></section><section class="saved"><h2>Mes coins de chine enregistrés</h2><div id="places"></div></section></main><script>let lat=null,lng=null;function streetUrl(a,o){return 'https://www.google.com/maps?layer=c&cbll='+encodeURIComponent(a+','+o)+'&cbp=12,0,0,0,0&output=embed'}function streetOpenUrl(a,o){return 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+encodeURIComponent(a+','+o)}function streetHtml(a,o){if(a===null||o===null||a===undefined||o===undefined)return '';return '<div class="streetPreview"><div class="streetLabel">📷 Vue Street View de l’emplacement</div><iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="'+streetUrl(a,o)+'"></iframe><div class="streetFallback">Si aucune image Street View n’existe ici, appuyez sur « Ouvrir Street View ».</div><div class="actions" style="padding:0 12px 12px"><button type="button" class="secondary" data-street-open>👁️ Ouvrir Street View</button></div></div>'}function showLiveStreet(){liveStreet.innerHTML=streetHtml(lat,lng);const b=liveStreet.querySelector('[data-street-open]');if(b)b.onclick=()=>openStreet(lat,lng)}function openStreet(a,o){if(a===null||o===null)return;location.href=streetOpenUrl(a,o)}function locate(){if(!navigator.geolocation){alert('GPS indisponible');return}navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;address.value=lat.toFixed(6)+', '+lng.toFixed(6);showLiveStreet()},()=>alert('Impossible de récupérer la position.'),{enableHighAccuracy:true})}function preferredGps(){return localStorage.getItem('gps_pref')||'Google Maps'}function navTo(q){const gps=preferredGps();if(gps==='Waze'){location.href='https://www.waze.com/ul?ll='+encodeURIComponent(q)+'&navigate=yes'}else{location.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q)+'&travelmode=driving&dir_action=navigate'}}function openMap(){const q=(lat!==null&&lng!==null)?lat+','+lng:address.value.trim();if(!q){alert('Indique une adresse ou utilise ta position.');return}if(preferredGps()==='Waze'){location.href='https://www.waze.com/ul?q='+encodeURIComponent(q)}else{location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}}function getPlaces(){try{return JSON.parse(localStorage.getItem('chine_places')||'[]')}catch(e){return[]}}function savePlace(){const p={id:Date.now(),name:place.value.trim()||'Coin de chine',address:address.value.trim(),desc:desc.value.trim(),lat:lat,lng:lng};if(!p.address&&p.lat===null){alert('Ajoute une adresse ou utilise ta position.');return}const a=getPlaces();a.unshift(p);localStorage.setItem('chine_places',JSON.stringify(a));place.value='';address.value='';desc.value='';lat=null;lng=null;liveStreet.innerHTML='';render();alert('Coin de chine enregistré avec sa localisation.')}function gps(p){const q=(p.lat!==null&&p.lng!==null)?p.lat+','+p.lng:p.address;navTo(q)}function del(id){const a=getPlaces().filter(p=>p.id!==id);localStorage.setItem('chine_places',JSON.stringify(a));render()}function shareObj(p){const txt='📍 '+p.name+'\n'+(p.address||((p.lat||'')+', '+(p.lng||'')))+(p.desc?'\n'+p.desc:'');if(navigator.share){navigator.share({title:p.name,text:txt}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>alert('Fiche copiée.'))}else{alert(txt)}}function shareCurrent(){const p={name:place.value.trim()||'Coin de chine',address:address.value.trim(),desc:desc.value.trim(),lat:lat,lng:lng};if(!p.address&&p.lat===null){alert('Ajoute une adresse ou utilise ta position.');return}shareObj(p)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){const a=getPlaces();places.innerHTML=a.length?'':'<p class="empty">Aucun coin enregistré pour le moment.</p>';a.forEach(p=>{const d=document.createElement('div');d.className='place';d.innerHTML='<h3>📍 '+esc(p.name)+'</h3>'+(p.address?'<p><strong>Localisation :</strong> '+esc(p.address)+'</p>':'')+(p.desc?'<p>'+esc(p.desc)+'</p>':'')+streetHtml(p.lat,p.lng)+'<div class="actions"><button type="button" data-gps>🧭 Y aller</button><button type="button" class="secondary" data-share>📤 Partager</button><button type="button" class="danger" data-del>🗑️ Effacer</button></div>';d.querySelector('[data-gps]').onclick=()=>gps(p);const sb=d.querySelector('[data-street-open]');if(sb)sb.onclick=()=>openStreet(p.lat,p.lng);d.querySelector('[data-share]').onclick=()=>shareObj(p);d.querySelector('[data-del]').onclick=()=>del(p.id);places.appendChild(d)})}render();</script></body></html>
