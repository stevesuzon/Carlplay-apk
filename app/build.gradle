plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stevesuzon.carlplay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stevesuzon.carlplay'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('transparentVehicleBackgrounds') {
    doLast {
        def assets = file('src/main/assets')
        [['master-front.jpg','master-front.png'],['tabbert.jpg','tabbert.png']].each { pair ->
            def input = new File(assets,pair[0]); if(!input.exists()) return
            def src = javax.imageio.ImageIO.read(input); if(src==null) return
            int w=src.width,h=src.height
            def out=new java.awt.image.BufferedImage(w,h,java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def samples=[]; int band=Math.max(2,Math.min(w,h).intdiv(40))
            for(int y=0;y<band;y++)for(int x=0;x<band;x++)samples<<(src.getRGB(x,y)&0xffffff)
            for(int y=0;y<band;y++)for(int x=w-band;x<w;x++)samples<<(src.getRGB(x,y)&0xffffff)
            for(int y=h-band;y<h;y++)for(int x=0;x<band;x++)samples<<(src.getRGB(x,y)&0xffffff)
            for(int y=h-band;y<h;y++)for(int x=w-band;x<w;x++)samples<<(src.getRGB(x,y)&0xffffff)
            int ar=(samples.collect{(it>>16)&255}.sum()/samples.size()) as int
            int ag=(samples.collect{(it>>8)&255}.sum()/samples.size()) as int
            int ab=(samples.collect{it&255}.sum()/samples.size()) as int
            def bg=new boolean[w*h]; def q=new java.util.ArrayDeque<Integer>()
            def add={int x,int y->int i=y*w+x;if(!bg[i]){bg[i]=true;q.add(i)}}
            for(int x=0;x<w;x++){add(x,0);add(x,h-1)};for(int y=0;y<h;y++){add(0,y);add(w-1,y)}
            int th=72
            while(!q.isEmpty()){
                int i=q.removeFirst(),x=i%w,y=i.intdiv(w),rgb=src.getRGB(x,y),r=(rgb>>16)&255,g=(rgb>>8)&255,b=rgb&255
                int d=(r-ar)*(r-ar)+(g-ag)*(g-ag)+(b-ab)*(b-ab)
                if(d>th*th){bg[i]=false;continue}
                if(x>0&&!bg[i-1]){bg[i-1]=true;q.add(i-1)};if(x<w-1&&!bg[i+1]){bg[i+1]=true;q.add(i+1)}
                if(y>0&&!bg[i-w]){bg[i-w]=true;q.add(i-w)};if(y<h-1&&!bg[i+w]){bg[i+w]=true;q.add(i+w)}
            }
            for(int y=0;y<h;y++)for(int x=0;x<w;x++){
                int i=y*w+x
                int rgb=src.getRGB(x,y)&0xffffff
                int argb = bg[i] ? rgb : ((int)0xff000000 | rgb)
                out.setRGB(x,y,argb)
            }
            javax.imageio.ImageIO.write(out,'png',new File(assets,pair[1]))
        }
        def html=new File(assets,'index.html');if(html.exists()){def s=html.getText('UTF-8');s=s.replace('master-front.jpg','master-front.png').replace('tabbert.jpg','tabbert.png');html.setText(s,'UTF-8')}
    }
}

tasks.configureEach { t -> if(t.name=='preDebugBuild') t.dependsOn 'transparentVehicleBackgrounds' }
